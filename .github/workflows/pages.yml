name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site directory
        run: |
          mkdir _site
          # Salin file presentasi dan aset statis tanpa folder PDF dan arsip besar
          rsync -av ./ _site/ \
            --exclude '_site' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'Presentasi Catpuccin' \
            --exclude 'Claude outputs' \
            --exclude 'node_modules' \
            --exclude '*.py' \
            --exclude '*.zip'
          echo "Ukuran direktori _site yang akan di-deploy:"
          du -sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Retry Deploy to GitHub Pages (jika terjadi gangguan koneksi sementara)
        if: steps.deployment.outcome == 'failure'
        id: deployment-retry
        uses: actions/deploy-pages@v4
