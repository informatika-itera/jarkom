<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/></marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/></marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/></marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/></marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#ea580c"/></marker>
        <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#475569"/></marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>
    <rect width="960" height="540" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="42" rx="8" fill="#0f172a"/>
    <text x="480.0" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">PRINSIP NETRALITAS INTERNET (NET NEUTRALITY) VS FAST LANES</text>

    <!-- Left: Net Neutrality Open Internet -->
    <rect x="40" y="80" width="420" height="420" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
    <rect x="55" y="95" width="390" height="30" rx="6" fill="#15803d"/>
    <text x="250" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">DENGAN NET NEUTRALITY (INTERNET TERBUKA)</text>

    <text x="70" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#166534">Prinsip Kesetaraan Paket Data (Common Carrier):</text>
    <text x="70" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Semua bit diperlakukan sama tanpa diskriminasi sumber &amp; aplikasi.</text>

    <!-- Highway lanes -->
    <rect x="70" y="200" width="360" height="150" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <line x1="70" y1="250" x2="430" y2="250" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>
    <line x1="70" y1="300" x2="430" y2="300" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Cars in lanes -->
    <rect x="90" y="215" width="90" height="24" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="135" y="231" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">Startup Lokal</text>

    <rect x="210" y="215" width="90" height="24" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="255" y="231" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">Web Edukasi</text>

    <rect x="330" y="215" width="80" height="24" rx="4" fill="#fed7aa" stroke="#ea580c"/>
    <text x="370" y="231" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7c2d12" text-anchor="middle">Big Tech</text>

    <text x="250" y="280" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">Semua Melaju di Kecepatan Maksimal yang Sama!</text>

    <rect x="70" y="370" width="360" height="110" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="85" y="395" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#14532d">&bull; Tidak Ada Pemblokiran Sewenang-wenang</text>
    <text x="85" y="420" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#14532d">&bull; Tidak Ada Throttling Kecepatan Kompetitor</text>
    <text x="85" y="445" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#14532d">&bull; Inovasi Startup Kecil Terlindungi</text>

    <!-- Right: Without Net Neutrality -->
    <rect x="500" y="80" width="420" height="420" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#sh)"/>
    <rect x="515" y="95" width="390" height="30" rx="6" fill="#b91c1c"/>
    <text x="710" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">TANPA NET NEUTRALITY (KOMERSIALISASI ISP)</text>

    <text x="530" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Praktik Diskriminatif ISP Terhadap Konten:</text>
    <text x="530" y="175" font-family="system-ui, sans-serif" font-size="11" fill="#475569">Jalur dipisah berdasar kemampuan membayar upeti.</text>

    <!-- Split lanes -->
    <rect x="530" y="200" width="360" height="65" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="545" y="222" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e40af">Jalur Cepat Berbayar (Paid Fast Lane):</text>
    <rect x="545" y="230" width="150" height="24" rx="4" fill="#fed7aa" stroke="#ea580c"/>
    <text x="620" y="246" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7c2d12" text-anchor="middle">Raksasa Big Tech</text>
    <text x="750" y="246" font-family="monospace" font-size="10" font-weight="700" fill="#1e40af">1 Gbps (Lancar)</text>

    <rect x="530" y="280" width="360" height="70" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="545" y="302" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#991b1b">Jalur Lambat Tercekik (Throttled Slow Lane):</text>
    <rect x="545" y="315" width="150" height="24" rx="4" fill="#e2e8f0" stroke="#94a3b8"/>
    <text x="620" y="331" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Startup / Kampus / Edukasi</text>
    <text x="750" y="331" font-family="monospace" font-size="10" font-weight="700" fill="#dc2626">512 Kbps (Macet)</text>

    <rect x="530" y="370" width="360" height="110" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="545" y="395" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">&bull; Monopoli Konglomerasi Digital</text>
    <text x="545" y="420" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">&bull; ISP Mencekik Layanan Streaming Pesaing</text>
    <text x="545" y="445" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b">&bull; Matinya Kompetisi &amp; Hak Informasi Publik</text>
</svg>