<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/></marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/></marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/></marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/></marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#ea580c"/></marker>
        <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#475569"/></marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>
    <rect width="960" height="540" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="42" rx="8" fill="#0f172a"/>
    <text x="480.0" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">ANATOMI SERANGAN MIRAI IOT BOTNET & 1.2 TBPS DDOS</text>

    <!-- Step 1: Scan -->
    <rect x="40" y="90" width="200" height="380" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8" filter="url(#sh)"/>
    <rect x="50" y="102" width="180" height="26" rx="4" fill="#1e40af"/>
    <text x="140" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">1. MASS RECON / SCAN</text>
    <text x="140" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">Pemindaian Port IPv4 Global</text>
    <text x="140" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Scanning acak jutaan IP</text>
    <text x="140" y="185" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">mencari port terbuka:</text>
    <rect x="60" y="200" width="160" height="40" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="140" y="225" font-family="monospace" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">Port 23 (Telnet) &amp; 2323</text>
    <text x="140" y="270" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Target utama: Kamera CCTV murah, DVR, router rumahan tanpa proteksi.</text>

    <!-- Arrow 1 to 2 -->
    <line x1="240" y1="280" x2="270" y2="280" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>

    <!-- Step 2: Brute Force -->
    <rect x="270" y="90" width="200" height="380" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.8" filter="url(#sh)"/>
    <rect x="280" y="102" width="180" height="26" rx="4" fill="#c2410c"/>
    <text x="370" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">2. DEFAULT CREDENTIALS</text>
    <text x="370" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#c2410c" text-anchor="middle">Kamus 68 Pasang Password</text>
    <text x="370" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Mencoba otomatis:</text>
    <rect x="285" y="190" width="170" height="95" rx="4" fill="#ffffff" stroke="#fed7aa"/>
    <text x="295" y="210" font-family="monospace" font-size="10" fill="#9a3412">&bull; root : xc3511</text>
    <text x="295" y="230" font-family="monospace" font-size="10" fill="#9a3412">&bull; admin : admin</text>
    <text x="295" y="250" font-family="monospace" font-size="10" fill="#9a3412">&bull; root : vizxv</text>
    <text x="295" y="270" font-family="monospace" font-size="10" fill="#9a3412">&bull; default : default</text>
    <text x="370" y="315" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Pengguna tidak pernah mengganti password pabrik!</text>

    <!-- Arrow 2 to 3 -->
    <line x1="470" y1="280" x2="500" y2="280" stroke="#ea580c" stroke-width="2.5" marker-end="url(#arrO)"/>

    <!-- Step 3: C2 Infection -->
    <rect x="500" y="90" width="200" height="380" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8" filter="url(#sh)"/>
    <rect x="510" y="102" width="180" height="26" rx="4" fill="#be185d"/>
    <text x="600" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">3. INFECTION &amp; C2</text>
    <text x="600" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#be185d" text-anchor="middle">Injeksi Biner Malware</text>
    <text x="600" y="170" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Mengunduh biner Mirai</text>
    <text x="600" y="185" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">dan mematikan telnet lain.</text>
    <rect x="515" y="200" width="170" height="50" rx="4" fill="#ffffff" stroke="#fbcfe8"/>
    <text x="600" y="222" font-family="monospace" font-size="10" font-weight="700" fill="#9d174d" text-anchor="middle">Command &amp; Control</text>
    <text x="600" y="240" font-family="monospace" font-size="9" fill="#db2777" text-anchor="middle">Hubungkan ke Botmaster</text>
    <text x="600" y="280" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#db2777" text-anchor="middle">Ratusan Ribu Zombie Bots</text>
    <text x="600" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">siap menunggu instruksi serentak.</text>

    <!-- Arrow 3 to 4 -->
    <line x1="700" y1="280" x2="730" y2="280" stroke="#db2777" stroke-width="2.5" marker-end="url(#arrR)"/>

    <!-- Step 4: 1.2 Tbps Attack -->
    <rect x="730" y="90" width="200" height="380" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#sh)"/>
    <rect x="740" y="102" width="180" height="26" rx="4" fill="#b91c1c"/>
    <text x="830" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">4. TERABIT DDOS WAVE</text>
    <text x="830" y="150" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b91c1c" text-anchor="middle">Serangan Terkordinasi Masif</text>
    <rect x="745" y="175" width="170" height="70" rx="4" fill="#ffffff" stroke="#fca5a5"/>
    <text x="830" y="198" font-family="monospace" font-size="11" font-weight="800" fill="#b91c1c" text-anchor="middle">1.2 Tbps DDoS!</text>
    <text x="830" y="218" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">SYN Flood + UDP Amplif.</text>
    <text x="830" y="233" font-family="system-ui, sans-serif" font-size="9" fill="#dc2626" text-anchor="middle">Melumpuhkan DNS Dyn Global</text>
    <text x="830" y="275" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Twitter, GitHub, Spotify, dan Netflix padam berjam-jam pada 21 Okt 2016.</text>

    <!-- Footer lesson -->
    <rect x="40" y="485" width="890" height="40" rx="6" fill="#0f172a"/>
    <text x="485" y="510" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171" text-anchor="middle">Pelajaran Krusial: Selalu ganti default password pada perangkat IoT &amp; matikan port manajemen publik (Telnet)!</text>
</svg>