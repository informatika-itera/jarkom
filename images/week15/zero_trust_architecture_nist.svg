<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/></marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/></marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/></marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/></marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#ea580c"/></marker>
        <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#475569"/></marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>
    <rect width="960" height="540" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="42" rx="8" fill="#0f172a"/>
    <text x="480.0" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">ARSITEKTUR ZERO TRUST (NIST SP 800-207): NEVER TRUST, ALWAYS VERIFY</text>

    <!-- Left: Untrusted Subjects -->
    <rect x="40" y="90" width="220" height="400" rx="10" fill="#f8fafc" stroke="#dc2626" stroke-width="2" filter="url(#sh)"/>
    <rect x="55" y="105" width="190" height="28" rx="5" fill="#dc2626"/>
    <text x="150" y="124" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">UNTITLED / UNTRUSTED</text>
    <text x="150" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">Semua Subjek Dianggap Bahaya</text>

    <rect x="55" y="175" width="190" height="60" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="150" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Pegawai WFH / Remote</text>
    <text x="150" y="218" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Laptop Pribadi (BYOD)</text>

    <rect x="55" y="255" width="190" height="60" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="150" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Pegawai di Dalam Kantor</text>
    <text x="150" y="298" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">LAN Internal != Tepercaya!</text>

    <rect x="55" y="335" width="190" height="60" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="150" y="358" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Perangkat IoT &amp; Rekanan</text>
    <text x="150" y="378" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">Vendor Pihak Ketiga</text>

    <rect x="55" y="415" width="190" height="60" rx="6" fill="#fee2e2"/>
    <text x="150" y="438" font-family="monospace" font-size="10" font-weight="800" fill="#991b1b" text-anchor="middle">ASUMSI UTAMA:</text>
    <text x="150" y="458" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#991b1b" text-anchor="middle">"Assume Breach"</text>

    <!-- Middle: Policy Decision Point (PDP) -->
    <rect x="310" y="90" width="340" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
    <rect x="325" y="105" width="310" height="28" rx="5" fill="#1e40af"/>
    <text x="480" y="124" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">POLICY DECISION POINT (PDP)</text>

    <rect x="330" y="145" width="140" height="65" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="400" y="168" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Policy Engine</text>
    <text x="400" y="188" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Kalkulasi Risk Score</text>
    <text x="400" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle">Evaluasi Aturan</text>

    <rect x="490" y="145" width="140" height="65" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="560" y="168" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Policy Admin</text>
    <text x="560" y="188" font-family="system-ui, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Terbitkan Token</text>
    <text x="560" y="202" font-family="system-ui, sans-serif" font-size="9" fill="#16a34a" text-anchor="middle">Kredensial Sesi</text>

    <text x="480" y="235" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">Konteks: Identitas + Postur OS + Lokasi + Jam Akses</text>
    <text x="480" y="255" font-family="monospace" font-size="10" fill="#2563eb" text-anchor="middle">MFA + Device Health Attestation</text>

    <!-- PEP (Policy Enforcement Point) -->
    <rect x="310" y="340" width="340" height="150" rx="10" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
    <rect x="325" y="355" width="310" height="28" rx="5" fill="#166534"/>
    <text x="480" y="374" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">POLICY ENFORCEMENT POINT (PEP)</text>

    <text x="480" y="415" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Gateway / Proxy / ZTNA Connector</text>
    <text x="480" y="435" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Membuka Terowongan mTLS Dinamis Hanya ke Satu Layanan</text>
    <text x="480" y="455" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">Mikrosegmentasi Per-Aplikasi (Bukan Akses Seluruh LAN!)</text>

    <line x1="480" y1="290" x2="480" y2="340" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>

    <!-- Right: Protected Enterprise Resources -->
    <rect x="700" y="90" width="220" height="400" rx="10" fill="#f8fafc" stroke="#10b981" stroke-width="2" filter="url(#sh)"/>
    <rect x="715" y="105" width="190" height="28" rx="5" fill="#047857"/>
    <text x="810" y="124" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">PROTECTED RESOURCES</text>
    <text x="810" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#065f46" text-anchor="middle">Aset Terlindungi Penuh</text>

    <rect x="715" y="175" width="190" height="60" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="810" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Database Nilai Kampus</text>
    <text x="810" y="218" font-family="system-ui, sans-serif" font-size="10" fill="#047857" text-anchor="middle">Hanya Role Dosen Berizin</text>

    <rect x="715" y="255" width="190" height="60" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="810" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">GitLab Repository Kode</text>
    <text x="810" y="298" font-family="system-ui, sans-serif" font-size="10" fill="#047857" text-anchor="middle">SSH Key + 2FA Valid</text>

    <rect x="715" y="335" width="190" height="60" rx="6" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="810" y="358" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Server Keuangan ITERA</text>
    <text x="810" y="378" font-family="system-ui, sans-serif" font-size="10" fill="#047857" text-anchor="middle">Enkripsi AES-256 Sesi</text>

    <line x1="650" y1="415" x2="700" y2="415" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
    <line x1="260" y1="210" x2="310" y2="180" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>
    <line x1="260" y1="365" x2="310" y2="415" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>
</svg>