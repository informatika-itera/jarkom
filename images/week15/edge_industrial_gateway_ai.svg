<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/></marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/></marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/></marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/></marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#ea580c"/></marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>
    <rect width="960" height="540" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="42" rx="8" fill="#0f172a"/>
    <text x="480.0" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">ANATOMI INDUSTRIAL EDGE GATEWAY & KOMPUTASI EDGE AI</text>

    <!-- Factory Field Devices -->
    <rect x="35" y="110" width="160" height="350" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" filter="url(#sh)"/>
    <text x="115" y="140" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">FIELD SENSORS</text>
    <rect x="45" y="160" width="140" height="50" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="115" y="185" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Kamera CCTV 4K</text>
    <text x="115" y="200" font-family="monospace" font-size="9" fill="#dc2626" text-anchor="middle">30 FPS Video Stream</text>

    <rect x="45" y="225" width="140" height="50" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="115" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">PLC Siemens S7</text>
    <text x="115" y="265" font-family="monospace" font-size="9" fill="#2563eb" text-anchor="middle">Modbus TCP / PROFINET</text>

    <rect x="45" y="290" width="140" height="50" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="115" y="315" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Sensor Getaran &amp; Suhu</text>
    <text x="115" y="330" font-family="monospace" font-size="9" fill="#16a34a" text-anchor="middle">RS-485 Serial Modbus</text>

    <!-- Edge Gateway Box Central -->
    <rect x="240" y="80" width="460" height="420" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5" filter="url(#sh)"/>
    <rect x="255" y="95" width="430" height="30" rx="6" fill="#c2410c"/>
