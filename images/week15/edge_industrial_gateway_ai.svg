    <!-- Hardware Modules -->
    <rect x="260" y="140" width="200" height="85" rx="6" fill="#ffffff" stroke="#fed7aa"/>
    <text x="360" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#9a3412" text-anchor="middle">Industrial I/O Interface</text>
    <text x="360" y="185" font-family="monospace" font-size="9" fill="#475569" text-anchor="middle">Dual GbE LAN + Isolated RS485</text>
    <text x="360" y="202" font-family="monospace" font-size="9" fill="#475569" text-anchor="middle">CAN Bus + GPIO + 4G LTE Slot</text>

    <!-- Edge AI Chip -->
