    <text x="580" y="185" font-family="monospace" font-size="9" fill="#6b21a8" text-anchor="middle">Google Coral TPU / Jetson Orin</text>
    <text x="580" y="202" font-family="monospace" font-size="9" fill="#7e22ce" text-anchor="middle">4 - 40 TOPS Low-Power AI</text>

