    <text x="470" y="265" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#c2410c" text-anchor="middle">Software &amp; Microservices Runtime (Docker / K3s)</text>

    <rect x="275" y="280" width="185" height="50" rx="4" fill="#f1f5f9"/>
    <text x="367" y="302" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Protocol Converter</text>
    <text x="367" y="318" font-family="monospace" font-size="9" fill="#2563eb" text-anchor="middle">Modbus/OPC-UA &rarr; MQTT</text>

    <rect x="480" y="280" width="185" height="50" rx="4" fill="#faf5ff"/>
    <text x="572" y="302" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7e22ce" text-anchor="middle">Edge AI Object Detection</text>
    <text x="572" y="318" font-family="monospace" font-size="9" fill="#9333ea" text-anchor="middle">YOLOv8 On-Device (3 ms)</text>

    <rect x="275" y="340" width="390" height="35" rx="4" fill="#f0fdf4" stroke="#86efac"/>
    <text x="470" y="362" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Local Filtering: 98% Video Sampah Dibuang di Sini!</text>

    <text x="470" y="425" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c" text-anchor="middle">Hanya Anomali / JSON Alert Berukuran 500 Byte yang Dikirim ke Cloud!</text>

    <!-- Cloud Side Right -->
    <rect x="740" y="160" width="180" height="250" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
    <text x="830" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">ENTERPRISE CLOUD</text>
    <text x="830" y="225" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Pusat Analitik &amp; Dashboard</text>
    <rect x="755" y="250" width="150" height="50" rx="4" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="830" y="272" font-family="monospace" font-size="10" font-weight="700" fill="#1e3a8a" text-anchor="middle">Bandwidth Hemat!</text>
    <text x="830" y="288" font-family="system-ui, sans-serif" font-size="9" fill="#15803d" text-anchor="middle">Hanya Kirim Alert</text>

    <!-- Arrows -->
    <line x1="195" y1="280" x2="240" y2="280" stroke="#64748b" stroke-width="3" marker-end="url(#arrS)"/>
    <line x1="700" y1="280" x2="740" y2="280" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
</svg>