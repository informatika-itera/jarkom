<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/></marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/></marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/></marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/></marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#ea580c"/></marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>
    <rect width="960" height="540" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="42" rx="8" fill="#0f172a"/>
    <text x="480.0" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">TUMPUKAN PROTOKOL APLIKASI IOT: HTTP VS COAP VS MQTT</text>

    <!-- Table columns -->
    <rect x="60" y="90" width="260" height="380" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" filter="url(#sh)"/>
    <rect x="70" y="102" width="240" height="28" rx="4" fill="#475569"/>
    <text x="190" y="122" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">HTTP / REST (WEB STANDARD)</text>

    <rect x="75" y="145" width="230" height="45" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="190" y="172" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Application: HTTP / JSON</text>

    <rect x="75" y="200" width="230" height="45" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="190" y="227" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Security: TLS 1.3</text>

    <rect x="75" y="255" width="230" height="45" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="190" y="282" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">Transport: TCP (Heavy Handshake)</text>

    <rect x="75" y="315" width="230" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="85" y="338" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a">Karakteristik Kunci:</text>
    <text x="85" y="358" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">&bull; Header: ~1000 - 2000 Byte</text>
    <text x="85" y="375" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">&bull; Boros Baterai &amp; Bandwidth</text>
    <text x="85" y="392" font-family="system-ui, sans-serif" font-size="10" fill="#475569">&bull; Request-Response Polling</text>

    <!-- CoAP Column -->
    <rect x="350" y="90" width="260" height="380" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="2" filter="url(#sh)"/>
    <rect x="360" y="102" width="240" height="28" rx="4" fill="#15803d"/>
    <text x="480" y="122" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">COAP (RFC 7252 RESTFUL)</text>

    <rect x="365" y="145" width="230" height="45" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="480" y="172" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">Application: CoAP (GET/POST)</text>

    <rect x="365" y="200" width="230" height="45" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="480" y="227" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">Security: DTLS (Datagram TLS)</text>

    <rect x="365" y="255" width="230" height="45" rx="4" fill="#bbf7d0" stroke="#16a34a"/>
    <text x="480" y="282" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#14532d" text-anchor="middle">Transport: UDP (Connectionless)</text>

    <rect x="365" y="315" width="230" height="85" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="375" y="338" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#14532d">Karakteristik Kunci:</text>
    <text x="375" y="358" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">&bull; Header: 4 Byte (Super Ringan)</text>
    <text x="375" y="375" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">&bull; Dukungan Multicast</text>
    <text x="375" y="392" font-family="system-ui, sans-serif" font-size="10" fill="#15803d">&bull; Async Confirmable (CON/NON)</text>

    <!-- MQTT Column -->
    <rect x="640" y="90" width="260" height="380" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
    <rect x="650" y="102" width="240" height="28" rx="4" fill="#1e40af"/>
    <text x="770" y="122" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">MQTT (ISO/IEC 20922 PUB/SUB)</text>

    <rect x="655" y="145" width="230" height="45" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="770" y="172" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Application: MQTT (Topics)</text>

    <rect x="655" y="200" width="230" height="45" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="770" y="227" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Security: TLS 1.3</text>

    <rect x="655" y="255" width="230" height="45" rx="4" fill="#bfdbfe" stroke="#2563eb"/>
    <text x="770" y="282" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Transport: TCP (Reliable Stream)</text>

    <rect x="655" y="315" width="230" height="85" rx="6" fill="#ffffff" stroke="#93c5fd"/>
    <text x="665" y="338" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e3a8a">Karakteristik Kunci:</text>
    <text x="665" y="358" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb">&bull; Header: 2 Byte (Sangat Hemat)</text>
    <text x="665" y="375" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb">&bull; Broker Terpusat (Decoupled)</text>
    <text x="665" y="392" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb">&bull; 3 Tingkat QoS (0, 1, 2)</text>

    <rect x="60" y="480" width="840" height="45" rx="6" fill="#0f172a"/>
    <text x="480" y="508" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">Rekomendasi: Gunakan CoAP jika butuh UDP/Multicast; gunakan MQTT jika butuh keandalan event stream.</text>
</svg>