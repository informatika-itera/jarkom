<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/></marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/></marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/></marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/></marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#ea580c"/></marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>
    <rect width="960" height="540" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="42" rx="8" fill="#0f172a"/>
    <text x="480.0" y="42" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">KECERDASAN BUATAN DALAM JARINGAN: AIOPS DEFENDER VS ADVERSARIAL AI</text>

    <!-- Left: AI Defender AIOps -->
    <rect x="40" y="80" width="420" height="420" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#sh)"/>
    <rect x="55" y="95" width="390" height="30" rx="6" fill="#1e40af"/>
    <text x="250" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">AI UNTUK PERTAHANAN (AIOPS DEFENDER)</text>

    <text x="70" y="150" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1e40af">Otomasi Deteksi &amp; Pemulihan Mandiri:</text>
    <rect x="70" y="165" width="360" height="75" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="85" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">1. Behavioral Anomaly Detection</text>
    <text x="85" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Mempelajari baseline jam kerja pegawai; deteksi jika ada</text>
    <text x="85" y="226" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb">transfer data masif abnormal jam 3 pagi.</text>

    <rect x="70" y="255" width="360" height="75" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="85" y="280" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">2. Automated DDoS Mitigation</text>
    <text x="85" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Menganalisis jutaan flow per detik; injeksi aturan</text>
    <text x="85" y="316" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb">BGP Flowspec untuk blackhole botnet dalam milidetik.</text>

    <rect x="70" y="345" width="360" height="75" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="85" y="370" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">3. Predictive Network Maintenance</text>
    <text x="85" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Prediksi degradasi sinyal fiber optik / Wi-Fi AP sebelum</text>
    <text x="85" y="406" font-family="system-ui, sans-serif" font-size="10" fill="#2563eb">terjadi putus link layanan kampus.</text>

    <rect x="70" y="435" width="360" height="50" rx="6" fill="#dbeafe"/>
    <text x="250" y="465" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e3a8a" text-anchor="middle">Tujuan: Zero Downtime &amp; Respons Cepat</text>

    <!-- Right: Adversarial AI Threats -->
    <rect x="500" y="80" width="420" height="420" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#sh)"/>
    <rect x="515" y="95" width="390" height="30" rx="6" fill="#b91c1c"/>
    <text x="710" y="115" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">AI DI TANGAN PERETAS (ADVERSARIAL AI)</text>

    <text x="530" y="150" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Eksploitasi Cerdas Berkecepatan Tinggi:</text>
    <rect x="530" y="165" width="360" height="75" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="545" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">1. Deepfake Phishing &amp; Social Eng.</text>
    <text x="545" y="210" font-family="system-ui, sans-serif" font-size="10" fill="#475569">LLM menghasilkan email spear-phishing kredibel tanpa</text>
    <text x="545" y="226" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">kesalahan tata bahasa, meniru gaya dosen/pimpinan.</text>

    <rect x="530" y="255" width="360" height="75" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="545" y="280" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">2. Polymorphic Malware Evading IDS</text>
    <text x="545" y="300" font-family="system-ui, sans-serif" font-size="10" fill="#475569">GANs memodifikasi tanda tangan payload malware agar</text>
    <text x="545" y="316" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">lolos menembus antivirus berbasis signature.</text>

    <rect x="530" y="345" width="360" height="75" rx="6" fill="#ffffff" stroke="#fca5a5"/>
    <text x="545" y="370" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0f172a">3. Automated Zero-Day Discovery</text>
    <text x="545" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Fuzzing bertenaga AI menguji jutaan kombinasi paket</text>
    <text x="545" y="406" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626">mencari celah buffer overflow di router target.</text>

    <rect x="530" y="435" width="360" height="50" rx="6" fill="#fee2e2"/>
    <text x="710" y="465" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">Perang Senjata: AI vs AI di Lapisan Jaringan</text>
</svg>