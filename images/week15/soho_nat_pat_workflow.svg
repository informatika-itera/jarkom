<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/>
    </marker>
    <marker id="arrTeal" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="720" fill="#ffffff" rx="16"/>

  <!-- Top Header -->
  <text x="480" y="46" text-anchor="middle" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="0.5">CARA KERJA ROUTER NAT &amp; PAT</text>
  <text x="480" y="70" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">Port Address Translation: Puluhan Perangkat LAN Berbagi 1 IP Publik ISP</text>

  <!-- Zone 1: LAN PRIVAT (Left) -->
  <rect x="24" y="96" width="236" height="494" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#sh)"/>
  <rect x="44" y="84" width="196" height="26" rx="13" fill="#1d4ed8"/>
  <text x="142" y="102" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">LAN PRIVAT (RFC 1918)</text>

  <!-- Laptop Card -->
  <rect x="40" y="132" width="204" height="170" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <!-- Laptop Icon -->
  <rect x="108" y="146" width="68" height="44" rx="4" fill="#1e293b"/>
  <rect x="113" y="151" width="58" height="34" rx="2" fill="#38bdf8"/>
  <polygon points="98,192 186,192 194,200 90,200" fill="#64748b"/>
  <text x="142" y="222" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">LAPTOP KERJA</text>
  <rect x="64" y="232" width="156" height="24" rx="6" fill="#dbeafe"/>
  <text x="142" y="249" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">192.168.1.10 : 54321</text>
  <text x="142" y="276" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Kirim Paket Outbound #1</text>
  <text x="142" y="292" text-anchor="middle" font-size="11" fill="#64748b">Dst: 142.250.190.46 : 443</text>

  <!-- Smartphone Card -->
  <rect x="40" y="330" width="204" height="170" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <!-- Phone Icon -->
  <rect x="126" y="344" width="32" height="54" rx="5" fill="#1e293b"/>
  <rect x="130" y="350" width="24" height="40" rx="2" fill="#2dd4bf"/>
  <circle cx="142" cy="394" r="2" fill="#94a3b8"/>
  <text x="142" y="418" text-anchor="middle" font-size="14" font-weight="800" fill="#0f172a">SMARTPHONE</text>
  <rect x="64" y="428" width="156" height="24" rx="6" fill="#ccfbf1"/>
  <text x="142" y="445" text-anchor="middle" font-size="13" font-weight="700" fill="#0f766e">192.168.1.12 : 51002</text>
  <text x="142" y="472" text-anchor="middle" font-size="11.5" font-weight="600" fill="#475569">Kirim Paket Outbound #2</text>
  <text x="142" y="488" text-anchor="middle" font-size="11" fill="#64748b">Dst: 142.250.190.46 : 443</text>

  <text x="142" y="534" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">IP Privat TIDAK BISA</text>
  <text x="142" y="550" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">di-routing di Internet!</text>

  <!-- Zone 2: ROUTER NAT & PAT (Center) -->
  <rect x="304" y="96" width="356" height="494" rx="14" fill="#f0fdfa" stroke="#5eead4" stroke-width="2" filter="url(#sh)"/>
  <rect x="356" y="84" width="252" height="26" rx="13" fill="#0f766e"/>
  <text x="482" y="102" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">ROUTER SOHO (NAT / PAT)</text>

  <!-- Router Visual Box -->
  <rect x="328" y="128" width="308" height="96" rx="10" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <!-- Router Graphic -->
  <rect x="348" y="160" width="84" height="36" rx="6" fill="#0f172a"/>
  <rect x="364" y="138" width="5" height="22" rx="2" fill="#334155"/>
  <rect x="411" y="138" width="5" height="22" rx="2" fill="#334155"/>
  <circle cx="362" cy="178" r="3" fill="#22c55e"/>
  <circle cx="372" cy="178" r="3" fill="#38bdf8"/>
  <circle cx="382" cy="178" r="3" fill="#f59e0b"/>
  <!-- Interface Labels -->
  <text x="448" y="152" font-size="12" font-weight="800" fill="#1e40af">Interface LAN (Gateway):</text>
  <text x="448" y="169" font-size="13" font-weight="700" fill="#0f172a">192.168.1.1 /24</text>
  <text x="448" y="193" font-size="12" font-weight="800" fill="#b45309">Interface WAN (1 IP Publik):</text>
  <text x="448" y="210" font-size="13" font-weight="700" fill="#92400e">203.0.113.5</text>

  <!-- NAT Translation Table -->
  <rect x="322" y="246" width="320" height="202" rx="10" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
  <rect x="322" y="246" width="320" height="32" rx="8" fill="#0d9488"/>
  <rect x="322" y="266" width="320" height="12" fill="#0d9488"/>
  <text x="482" y="267" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">NAT TRANSLATION TABLE (RAM)</text>

  <!-- Table Header -->
  <rect x="322" y="278" width="160" height="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="482" y="278" width="160" height="28" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="402" y="297" text-anchor="middle" font-size="11.5" font-weight="800" fill="#334155">LAN (IP:Port Privat)</text>
  <text x="562" y="297" text-anchor="middle" font-size="11.5" font-weight="800" fill="#334155">WAN (IP:Port Publik)</text>

  <!-- Table Row 1 -->
  <rect x="322" y="306" width="160" height="44" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="482" y="306" width="160" height="44" fill="#fffbeb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="402" y="333" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e40af">192.168.1.10 : 54321</text>
  <text x="562" y="333" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b45309">203.0.113.5 : 40001</text>

  <!-- Table Row 2 -->
  <rect x="322" y="350" width="160" height="44" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="482" y="350" width="160" height="44" fill="#fffbeb" stroke="#cbd5e1" stroke-width="1"/>
  <text x="402" y="377" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f766e">192.168.1.12 : 51002</text>
  <text x="562" y="377" text-anchor="middle" font-size="12.5" font-weight="800" fill="#b45309">203.0.113.5 : 40002</text>

  <!-- Table Note -->
  <text x="482" y="416" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0f172a">Port Eksternal Unik (:40001 vs :40002)</text>
  <text x="482" y="433" text-anchor="middle" font-size="11" fill="#475569">membedakan pemilik paket saat balasan tiba!</text>

  <!-- Rewrite Steps Pill inside Center -->
  <rect x="322" y="466" width="320" height="50" rx="8" fill="#dcfce7" stroke="#86efac" stroke-width="1.5"/>
  <text x="482" y="487" text-anchor="middle" font-size="12" font-weight="800" fill="#166534">1. Outbound Rewrite: Ubah Src IP ke 203.0.113.5</text>
  <text x="482" y="505" text-anchor="middle" font-size="12" font-weight="800" fill="#166534">2. Inbound Lookup: Cocokkan Port ke Tabel NAT</text>

  <rect x="322" y="526" width="320" height="46" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="482" y="546" text-anchor="middle" font-size="11.5" font-weight="800" fill="#991b1b">Inbound Asing Tanpa Baris Tabel?</text>
  <text x="482" y="563" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b91c1c">Diblokir (kecuali ada Port Forwarding)</text>

  <!-- Zone 3: INTERNET PUBLIK (Right) -->
  <rect x="704" y="96" width="232" height="494" rx="14" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" filter="url(#sh)"/>
  <rect x="724" y="84" width="192" height="26" rx="13" fill="#d97706"/>
  <text x="820" y="102" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">INTERNET PUBLIK</text>

  <!-- Outbound Packet Badges Seen by Server -->
  <rect x="720" y="138" width="200" height="82" rx="10" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
  <text x="820" y="159" text-anchor="middle" font-size="12" font-weight="800" fill="#92400e">Paket Dilihat Server Sebagai:</text>
  <rect x="734" y="168" width="172" height="20" rx="4" fill="#fef3c7"/>
  <text x="820" y="182" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">Src 203.0.113.5 : 40001</text>
  <rect x="734" y="193" width="172" height="20" rx="4" fill="#fef3c7"/>
  <text x="820" y="207" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b45309">Src 203.0.113.5 : 40002</text>

  <!-- Web Server Icon -->
  <rect x="720" y="250" width="200" height="178" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="1.8"/>
  <rect x="780" y="266" width="80" height="68" rx="6" fill="#1e293b"/>
  <rect x="788" y="274" width="64" height="12" rx="2" fill="#334155"/>
  <circle cx="796" cy="280" r="2.5" fill="#22c55e"/>
  <rect x="788" y="294" width="64" height="12" rx="2" fill="#334155"/>
  <circle cx="796" cy="300" r="2.5" fill="#38bdf8"/>
  <rect x="788" y="314" width="64" height="12" rx="2" fill="#334155"/>
  <circle cx="796" cy="320" r="2.5" fill="#f59e0b"/>
  <text x="820" y="358" text-anchor="middle" font-size="15" font-weight="800" fill="#0f172a">WEB SERVER</text>
  <rect x="742" y="368" width="156" height="24" rx="6" fill="#fef3c7"/>
  <text x="820" y="385" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">142.250.190.46 : 443</text>
  <text x="820" y="413" text-anchor="middle" font-size="11" font-weight="600" fill="#64748b">Mengenal 1 IP Publik 203.0.113.5</text>

  <!-- Return Packet Box -->
  <rect x="720" y="454" width="200" height="96" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="820" y="476" text-anchor="middle" font-size="12" font-weight="800" fill="#166534">Balasan Dikirim Ke:</text>
  <text x="820" y="497" text-anchor="middle" font-size="12.5" font-weight="800" fill="#15803d">203.0.113.5 : 40001</text>
  <text x="820" y="518" text-anchor="middle" font-size="11" fill="#334155">Router mengembalikan tujuan</text>
  <text x="820" y="534" text-anchor="middle" font-size="11" font-weight="700" fill="#1e40af">→ 192.168.1.10 : 54321</text>

  <!-- Connecting Arrows -->
  <!-- Laptop -> Router -->
  <path d="M244,218 L302,218 L302,324 L318,324" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
  <!-- Phone -> Router -->
  <path d="M244,414 L286,414 L286,372 L318,372" fill="none" stroke="#0d9488" stroke-width="3" marker-end="url(#arrTeal)"/>
  <!-- Router -> Internet (Outbound) -->
  <path d="M642,328 L680,328 L680,180 L714,180" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
  <path d="M642,372 L690,372 L690,336 L714,336" fill="none" stroke="#0d9488" stroke-width="3" marker-end="url(#arrTeal)"/>
  <!-- Internet -> Router (Inbound Return) -->
  <path d="M720,498 L646,498" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-dasharray="6,4" marker-end="url(#arrGreen)"/>
  <!-- Router -> Laptop (Inbound Return) -->
  <path d="M322,491 L268,491 L268,262 L248,262" fill="none" stroke="#16a34a" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrGreen)"/>

  <!-- Bottom Footer Strip -->
  <rect x="24" y="612" width="912" height="82" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="44" y="628" width="210" height="50" rx="8" fill="#1e40af"/>
  <text x="149" y="650" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">MENGAPA NAT PENTING?</text>
  <text x="149" y="667" text-anchor="middle" font-size="11.5" font-weight="600" fill="#dbeafe">Mengatasi Kelangkaan IPv4</text>
  <text x="276" y="646" font-size="13.5" font-weight="700" fill="#0f172a">• Hemat Alamat IP Publik: Cukup 1 IP Publik ISP untuk seluruh laptop, HP, &amp; IoT di rumah/kampus.</text>
  <text x="276" y="670" font-size="13.5" font-weight="700" fill="#0f172a">• Isolasi Dasar: Komputer lokal tersembunyi dari pemindaian langsung internet luar (Stateful).</text>
</svg>
