<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/>
        </marker>
        <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#475569"/>
        </marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="44" rx="10" fill="#0f172a"/>
    <text x="480" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">MEMBACA KUALITAS SINYAL WI-FI NYATA: SKALA RSSI (dBm) &amp; SNR</text>

    <!-- LEFT: SIGNAL STRENGTH LADDER -->
    <g transform="translate(24, 76)">
        <rect width="530" height="442" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" filter="url(#sh)"/>
        <text x="265" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e3a8a" text-anchor="middle">Skala RSSI (Kekuatan Sinyal Wi-Fi — Satuan Negatif dBm)</text>

        <!-- Tier 1: -30 to -50 -->
        <rect x="20" y="46" width="490" height="62" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
        <rect x="32" y="57" width="112" height="38" rx="6" fill="#15803d"/>
        <text x="88" y="81" font-family="monospace" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">-30 s.d. -50 dBm</text>
        <text x="158" y="71" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#14532d">Sangat Kuat (Sebelahan dengan AP)</text>
        <text x="158" y="91" font-family="system-ui, sans-serif" font-size="10.5" fill="#166534">Maksimal throughput (QAM-256 / 1024), cocok streaming 4K &amp; gaming.</text>

        <!-- Tier 2: -51 to -67 -->
        <rect x="20" y="118" width="490" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/>
        <rect x="32" y="129" width="112" height="38" rx="6" fill="#1d4ed8"/>
        <text x="88" y="153" font-family="monospace" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">-51 s.d. -67 dBm</text>
        <text x="158" y="143" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e3a8a">Bagus / Layak Zoom &amp; VoIP</text>
        <text x="158" y="163" font-family="system-ui, sans-serif" font-size="10.5" fill="#1e40af">-67 dBm adalah batas minimal standar enterprise untuk voice &amp; video.</text>

        <!-- Tier 3: -68 to -75 -->
        <rect x="20" y="190" width="490" height="62" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.8"/>
        <rect x="32" y="201" width="112" height="38" rx="6" fill="#d97706"/>
        <text x="88" y="225" font-family="monospace" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">-68 s.d. -75 dBm</text>
        <text x="158" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#92400e">Sedang — Browsing Dasar</text>
        <text x="158" y="235" font-family="system-ui, sans-serif" font-size="10.5" fill="#78350f">Mulai turun kecepatan modulasi; video call dapat patah-patah saat ramai.</text>

        <!-- Tier 4: -76 to -85 -->
        <rect x="20" y="262" width="490" height="62" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/>
        <rect x="32" y="273" width="112" height="38" rx="6" fill="#dc2626"/>
        <text x="88" y="297" font-family="monospace" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">-76 s.d. -85 dBm</text>
        <text x="158" y="287" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#991b1b">Lemah — Packet Loss &amp; Putus-putus</text>
        <text x="158" y="307" font-family="system-ui, sans-serif" font-size="10.5" fill="#7f1d1d">Laju data jatuh ke 1–6 Mbps (BPSK); memicu Rate Anomaly ke AP!</text>

        <!-- Tier 5: -90 to -95 -->
        <rect x="20" y="334" width="490" height="58" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.6"/>
        <rect x="32" y="344" width="112" height="38" rx="6" fill="#334155"/>
        <text x="88" y="368" font-family="monospace" font-size="13" font-weight="800" fill="#94a3b8" text-anchor="middle">-90 s.d. -95 dBm</text>
        <text x="158" y="360" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#f8fafc">Noise Floor (Batas Derau Latar)</text>
        <text x="158" y="378" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Sinyal tenggelam oleh noise radio; koneksi tidak bisa terbentuk.</text>

        <text x="265" y="420" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">Ingat: -50 dBm bernilai 100x LEBIH KUAT daripada -70 dBm (beda 20 dB)!</text>
    </g>

    <!-- RIGHT: SNR FORMULA & LINK QUALITY -->
    <g transform="translate(570, 76)">
        <rect width="366" height="442" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6" filter="url(#sh)"/>
        <rect x="16" y="12" width="334" height="28" rx="7" fill="#1e40af"/>
        <text x="183" y="30" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">Menghitung SNR dari Hasil Pengukuran</text>

        <!-- Formula Box -->
        <rect x="20" y="54" width="326" height="82" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="183" y="76" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#1e3a8a" text-anchor="middle">Rumus Praktis Admin Jaringan:</text>
        <text x="183" y="102" font-family="monospace" font-size="13" font-weight="800" fill="#1d4ed8" text-anchor="middle">SNR (dB) = RSSI (dBm) - Noise (dBm)</text>
        <text x="183" y="122" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Semakin jauh RSSI berada di atas Noise Floor, kian jernih.</text>

        <!-- Concrete Example 1 -->
        <rect x="20" y="150" width="326" height="106" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="34" y="172" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#166534">Contoh A (Ruang Kuliah Tenang):</text>
        <text x="34" y="192" font-family="monospace" font-size="11" fill="#0f172a">RSSI = -62 dBm | Noise = -94 dBm</text>
        <text x="34" y="212" font-family="monospace" font-size="11.5" font-weight="800" fill="#15803d">SNR  = (-62) - (-94) = +32 dB</text>
        <text x="34" y="236" font-family="system-ui, sans-serif" font-size="10" fill="#14532d">Kualitas SANGAT BAIK! Stabil untuk ujian &amp; Zoom.</text>

        <!-- Concrete Example 2 -->
        <rect x="20" y="270" width="326" height="106" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
        <text x="34" y="292" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#991b1b">Contoh B (Kos Padat 2.4 GHz):</text>
        <text x="34" y="312" font-family="monospace" font-size="11" fill="#0f172a">RSSI = -62 dBm | Noise = -74 dBm</text>
        <text x="34" y="332" font-family="monospace" font-size="11.5" font-weight="800" fill="#dc2626">SNR  = (-62) - (-74) = +12 dB</text>
        <text x="34" y="356" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">Meski bar sinyal penuh, interferensi menaikkan</text>
        <text x="34" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">noise floor sehingga Wi-Fi sering putus (drop)!</text>

        <!-- Tool note -->
        <rect x="20" y="388" width="326" height="38" rx="7" fill="#fffbeb" stroke="#f59e0b"/>
        <text x="183" y="405" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#92400e" text-anchor="middle">Tips Tugas Lab: Cek via WiFi Analyzer /</text>
        <text x="183" y="419" font-family="monospace" font-size="9.5" fill="#78350f" text-anchor="middle">netsh wlan show networks mode=bssid</text>
    </g>
</svg>