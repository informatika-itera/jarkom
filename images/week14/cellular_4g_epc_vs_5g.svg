<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/>
        </marker>
        <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#475569"/>
        </marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="44" rx="10" fill="#0f172a"/>
    <text x="480" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">ARSITEKTUR 4G LTE (RAN + EPC) &amp; TIGA PILAR 5G NEW RADIO</text>

    <!-- TOP PANEL: 4G LTE Architecture -->
    <g transform="translate(24, 72)">
        <rect width="912" height="232" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e3a8a">Arsitektur All-IP 4G LTE (Pemisahan Control Plane &amp; Data Plane)</text>

        <!-- RAN Group -->
        <rect x="18" y="38" width="260" height="178" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-dasharray="5,3"/>
        <text x="148" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1d4ed8" text-anchor="middle">Radio Access Network (RAN)</text>

        <rect x="30" y="88" width="94" height="90" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
        <text x="77" y="122" font-size="24" text-anchor="middle">📱</text>
        <text x="77" y="146" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">UE</text>
        <text x="77" y="164" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">SIM / IMSI</text>

        <line x1="124" y1="133" x2="164" y2="133" stroke="#ea580c" stroke-width="3" stroke-dasharray="4,3"/>

        <rect x="166" y="88" width="98" height="90" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
        <text x="215" y="122" font-size="24" text-anchor="middle">🗼</text>
        <text x="215" y="146" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">eNode-B</text>
        <text x="215" y="164" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">OFDM Radio</text>

        <!-- EPC Group -->
        <rect x="294" y="38" width="448" height="178" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="5,3"/>
        <text x="518" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#166534" text-anchor="middle">Enhanced Packet Core (EPC)</text>

        <!-- Control Plane: MME & HSS (Top row inside EPC) -->
        <rect x="330" y="70" width="160" height="52" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
        <text x="410" y="92" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#92400e" text-anchor="middle">MME (Control Plane)</text>
        <text x="410" y="109" font-family="system-ui, sans-serif" font-size="10" fill="#78350f" text-anchor="middle">Otentikasi, Paging, Handoff</text>

        <rect x="546" y="70" width="165" height="52" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
        <text x="628" y="92" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#9d174d" text-anchor="middle">HSS (Database)</text>
        <text x="628" y="109" font-family="system-ui, sans-serif" font-size="10" fill="#831843" text-anchor="middle">Kunci Pelanggan &amp; IMSI</text>

        <line x1="490" y1="96" x2="546" y2="96" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3"/>
        <line x1="264" y1="108" x2="330" y2="96" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3"/>

        <!-- Data Plane: S-GW & P-GW (Bottom row inside EPC) -->
        <rect x="330" y="148" width="160" height="54" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
        <text x="410" y="170" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#166534" text-anchor="middle">S-GW (Serving GW)</text>
        <text x="410" y="187" font-family="system-ui, sans-serif" font-size="10" fill="#14532d" text-anchor="middle">Endpoint GTP Tunnel</text>

        <rect x="546" y="148" width="165" height="54" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
        <text x="628" y="170" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#1e40af" text-anchor="middle">P-GW (PDN GW)</text>
        <text x="628" y="187" font-family="system-ui, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle">NAT &amp; Gerbang IP Publik</text>

        <!-- Data Plane Arrows -->
        <line x1="264" y1="154" x2="330" y2="174" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arrG)"/>
        <line x1="490" y1="175" x2="546" y2="175" stroke="#16a34a" stroke-width="3.5" marker-end="url(#arrG)"/>
        <line x1="410" y1="122" x2="410" y2="148" stroke="#64748b" stroke-width="2" stroke-dasharray="3,2"/>

        <!-- Internet Cloud -->
        <ellipse cx="828" cy="145" rx="68" ry="48" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
        <text x="828" y="140" font-size="24" text-anchor="middle">🌐</text>
        <text x="828" y="164" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">Internet</text>
        <line x1="711" y1="175" x2="760" y2="156" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrB)"/>
    </g>

    <!-- BOTTOM PANEL: 5G NR Architecture & 3 Pillars -->
    <g transform="translate(24, 318)">
        <rect width="912" height="202" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
        <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#5b21b6">5G New Radio (NR): Spektrum mmWave &amp; 3 Pilar Layanan IMT-2020</text>

        <!-- Left Card: FR1 vs FR2 -->
        <g transform="translate(18, 40)">
            <rect width="268" height="146" rx="10" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
            <text x="134" y="24" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#5b21b6" text-anchor="middle">Pita Frekuensi &amp; Pico-cells</text>
            <text x="14" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">FR1 (Sub-6 GHz):</tspan> Cakupan luas, tembus gedung</text>
            <text x="14" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">FR2 (mmWave 24–52 GHz):</tspan> Multi-Gbps, jarak</text>
            <text x="22" y="88" font-family="system-ui, sans-serif" font-size="11" fill="#334155">pendek (10–100 m), butuh jutaan pico-cells</text>
            <text x="14" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#334155">• <tspan font-weight="700">Massive MIMO &amp; Beamforming:</tspan> Antena</text>
            <text x="22" y="128" font-family="system-ui, sans-serif" font-size="11" fill="#334155">direksional terarah ke tiap pengguna</text>
        </g>

        <!-- Pillar 1: eMBB -->
        <g transform="translate(302, 40)">
            <rect width="192" height="146" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
            <text x="96" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">1. eMBB</text>
            <text x="96" y="44" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#2563eb" text-anchor="middle">Enhanced Mobile Broadband</text>
            <text x="96" y="78" font-size="24" text-anchor="middle">🎥 🚀</text>
            <text x="96" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">10× Bitrate (hingga 10+ Gbps)</text>
            <text x="96" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Streaming 4K/8K, AR/VR, Cloud</text>
        </g>

        <!-- Pillar 2: URLLC -->
        <g transform="translate(506, 40)">
            <rect width="192" height="146" rx="10" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
            <text x="96" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">2. URLLC</text>
            <text x="96" y="44" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">Ultra-Reliable Low Latency</text>
            <text x="96" y="78" font-size="24" text-anchor="middle">🚗 🏥</text>
            <text x="96" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Latensi &lt;1 ms, keandalan 99.999%</text>
            <text x="96" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Mobil otonom, bedah jarak jauh</text>
        </g>

        <!-- Pillar 3: mMTC -->
        <g transform="translate(710, 40)">
            <rect width="184" height="146" rx="10" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
            <text x="92" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">3. mMTC</text>
            <text x="92" y="44" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#16a34a" text-anchor="middle">Massive Machine-Type</text>
            <text x="92" y="78" font-size="24" text-anchor="middle">🏙️ 📡</text>
            <text x="92" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">100× kepadatan (1 juta/km²)</text>
            <text x="92" y="124" font-family="system-ui, sans-serif" font-size="11" fill="#334155" text-anchor="middle">Smart City &amp; jutaan sensor IoT</text>
        </g>
    </g>
</svg>