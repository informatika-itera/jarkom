<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/>
        </marker>
        <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#475569"/>
        </marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="44" rx="10" fill="#0f172a"/>
    <text x="480" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">TANTANGAN MEDIUM RADIO &amp; KURVA TRADE-OFF SNR vs BER</text>

    <!-- LEFT: 3 Radio Challenges -->
    <g transform="translate(24, 76)">
        <rect width="430" height="440" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
        <text x="215" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">3 Fenomena Pelemahan Sinyal Radio</text>

        <!-- 1. Path Loss -->
        <g transform="translate(18, 48)">
            <rect width="394" height="114" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
            <rect x="12" y="10" width="150" height="22" rx="6" fill="#dbeafe"/>
            <text x="87" y="25" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">1. Attenuation / Path Loss</text>
            <!-- TX -> decreasing waves -> RX -->
            <text x="36" y="75" font-size="24" text-anchor="middle">📡</text>
            <path d="M 65 65 Q 85 45 105 65 T 145 65" fill="none" stroke="#2563eb" stroke-width="4"/>
            <path d="M 145 65 Q 165 55 185 65 T 225 65" fill="none" stroke="#60a5fa" stroke-width="2.5"/>
            <path d="M 225 65 Q 245 61 265 65 T 305 65" fill="none" stroke="#93c5fd" stroke-width="1.5"/>
            <text x="335" y="74" font-size="22" text-anchor="middle">📱</text>
            <text x="197" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e3a8a" text-anchor="middle">Free Space Path Loss ∝ (f · d)² — melemah sesuai jarak &amp; frekuensi</text>
        </g>

        <!-- 2. Multipath Propagation -->
        <g transform="translate(18, 174)">
            <rect width="394" height="120" rx="10" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
            <rect x="12" y="10" width="166" height="22" rx="6" fill="#ffedd5"/>
            <text x="95" y="25" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#9a3412" text-anchor="middle">2. Multipath Propagation</text>
            <!-- Building / Wall -->
            <rect x="165" y="22" width="70" height="20" rx="3" fill="#64748b"/>
            <text x="200" y="36" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">Gedung</text>
            <text x="42" y="84" font-size="22" text-anchor="middle">📡</text>
            <text x="348" y="84" font-size="22" text-anchor="middle">🚗</text>
            <!-- Direct LOS -->
            <line x1="65" y1="75" x2="320" y2="75" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
            <text x="195" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">Line of Sight (LOS)</text>
            <!-- Reflected -->
            <polyline points="62,65 190,44 322,70" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrO)"/>
            <polyline points="62,88 190,104 322,82" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrO)"/>
            <text x="197" y="114" font-family="system-ui, sans-serif" font-size="10.5" fill="#7c2d12" text-anchor="middle">Pantulan tiba di waktu berbeda → pembatalan fase / distorsi</text>
        </g>

        <!-- 3. Noise & Interference -->
        <g transform="translate(18, 306)">
            <rect width="394" height="114" rx="10" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
            <rect x="12" y="10" width="166" height="22" rx="6" fill="#fee2e2"/>
            <text x="95" y="25" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#991b1b" text-anchor="middle">3. Interference &amp; Noise</text>
            <text x="58" y="74" font-size="20" text-anchor="middle">📻</text>
            <text x="197" y="74" font-size="20" text-anchor="middle">⚡</text>
            <text x="336" y="74" font-size="20" text-anchor="middle">📡</text>
            <text x="128" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">2.4 GHz</text>
            <text x="266" y="64" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626" text-anchor="middle">AP Tetangga</text>
            <text x="197" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">Microwave, motor listrik &amp; pita frekuensi bersama menurunkan SNR</text>
        </g>
    </g>

    <!-- RIGHT: SNR vs BER Curve (Kurose Ch 7 Fig) -->
    <g transform="translate(476, 76)">
        <rect width="460" height="440" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
        <text x="230" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e3a8a" text-anchor="middle">Kurva Trade-off SNR (dB) vs Bit Error Rate (BER)</text>

        <!-- Plot Axes -->
        <g transform="translate(70, 56)">
            <!-- Grid lines -->
            <line x1="0" y1="0" x2="360" y2="0" stroke="#e2e8f0" stroke-width="1"/>
            <line x1="0" y1="45" x2="360" y2="45" stroke="#e2e8f0" stroke-width="1"/>
            <line x1="0" y1="90" x2="360" y2="90" stroke="#e2e8f0" stroke-width="1"/>
            <line x1="0" y1="135" x2="360" y2="135" stroke="#e2e8f0" stroke-width="1"/>
            <line x1="0" y1="180" x2="360" y2="180" stroke="#e2e8f0" stroke-width="1"/>
            <line x1="0" y1="225" x2="360" y2="225" stroke="#e2e8f0" stroke-width="1"/>
            <line x1="0" y1="270" x2="360" y2="270" stroke="#e2e8f0" stroke-width="1"/>

            <!-- Y Axis -->
            <line x1="0" y1="0" x2="0" y2="275" stroke="#334155" stroke-width="2.5"/>
            <text x="-10" y="5" font-family="monospace" font-size="11" fill="#334155" text-anchor="end">10⁻¹</text>
            <text x="-10" y="50" font-family="monospace" font-size="11" fill="#334155" text-anchor="end">10⁻²</text>
            <text x="-10" y="95" font-family="monospace" font-size="11" fill="#334155" text-anchor="end">10⁻³</text>
            <text x="-10" y="140" font-family="monospace" font-size="11" fill="#334155" text-anchor="end">10⁻⁴</text>
            <text x="-10" y="185" font-family="monospace" font-size="11" fill="#334155" text-anchor="end">10⁻⁵</text>
            <text x="-10" y="230" font-family="monospace" font-size="11" fill="#334155" text-anchor="end">10⁻⁶</text>
            <text x="-10" y="275" font-family="monospace" font-size="11" fill="#334155" text-anchor="end">10⁻⁷</text>
            <text x="-46" y="140" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle" transform="rotate(-90 -46 140)">Bit Error Rate (BER)</text>

            <!-- X Axis -->
            <line x1="0" y1="275" x2="360" y2="275" stroke="#334155" stroke-width="2.5"/>
            <text x="65" y="294" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle">10 dB</text>
            <text x="155" y="294" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle">20 dB</text>
            <text x="245" y="294" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle">30 dB</text>
            <text x="335" y="294" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle">40 dB</text>
            <text x="180" y="314" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle">Signal-to-Noise Ratio — SNR (dB) → Lebih Baik</text>

            <!-- Curves -->
            <!-- BPSK (1 Mbps): drops sharply between 6-14 dB -->
            <path d="M 15 15 Q 55 30 85 130 T 115 268" fill="none" stroke="#16a34a" stroke-width="3.5"/>
            <rect x="16" y="195" width="95" height="22" rx="4" fill="#dcfce7" stroke="#16a34a"/>
            <text x="63" y="210" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#166534" text-anchor="middle">BPSK (1 Mbps)</text>

            <!-- QAM16 (4 Mbps): drops between 15-24 dB -->
            <path d="M 95 10 Q 155 45 182 145 T 215 268" fill="none" stroke="#2563eb" stroke-width="3.5"/>
            <rect x="135" y="102" width="102" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
            <text x="186" y="117" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#1e40af" text-anchor="middle">QAM16 (4 Mbps)</text>

            <!-- QAM256 (8 Mbps): drops between 25-36 dB -->
            <path d="M 190 8 Q 260 55 295 160 T 340 268" fill="none" stroke="#dc2626" stroke-width="3.5"/>
            <rect x="242" y="38" width="110" height="22" rx="4" fill="#fee2e2" stroke="#dc2626"/>
            <text x="297" y="53" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#991b1b" text-anchor="middle">QAM256 (8 Mbps)</text>
        </g>

        <!-- Insight Box -->
        <rect x="20" y="382" width="420" height="44" rx="8" fill="#f0fdf4" stroke="#86efac"/>
        <text x="230" y="401" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#166534" text-anchor="middle">Adaptasi Fisik Dinamis (Rate Adaptation):</text>
        <text x="230" y="418" font-family="system-ui, sans-serif" font-size="10.5" fill="#14532d" text-anchor="middle">SNR tinggi: QAM256 (cepat) | SNR rendah: turun ke BPSK (BER aman)</text>
    </g>
</svg>