<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- LEFT: CACHE POISONING ATTACK -->
    <g transform="translate(35, 30)">
        <rect width="430" height="480" rx="14" fill="#fff" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)"/>
        <rect x="30" y="16" width="370" height="38" rx="8" fill="#fef2f2" stroke="#ef4444"/>
        <text x="215" y="41" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#991b1b" text-anchor="middle">DNS Cache Poisoning Attack</text>

        <!-- Attacker -->
        <g transform="translate(30, 85)">
            <rect width="110" height="75" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
            <text x="55" y="36" font-size="26" text-anchor="middle">🥷</text>
            <text x="55" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">Attacker</text>
        </g>

        <!-- Local DNS Cache -->
        <g transform="translate(260, 85)">
            <rect width="135" height="90" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
            <text x="67" y="34" font-size="24" text-anchor="middle">🗄️</text>
            <text x="67" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#991b1b" text-anchor="middle">Local DNS Cache</text>
            <rect x="10" y="65" width="115" height="18" rx="3" fill="#fee2e2"/>
            <text x="67" y="78" font-family="monospace" font-size="10" font-weight="800" fill="#dc2626" text-anchor="middle">bank = FAKE IP ⚠️</text>
        </g>

        <!-- Spoofed Injection Arrow -->
        <path d="M 140 120 L 260 120" stroke="#dc2626" stroke-width="3" stroke-dasharray="4,2" marker-end="url(#arrR)"/>
        <text x="200" y="112" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#dc2626" text-anchor="middle">Inject Fake IP</text>

        <!-- Victim Client -->
        <g transform="translate(150, 260)">
            <rect width="130" height="75" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
            <text x="65" y="36" font-size="26" text-anchor="middle">💻</text>
            <text x="65" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">Victim Client</text>
        </g>

        <!-- Arrow from Cache to Client -->
        <path d="M 320 175 L 250 260" stroke="#dc2626" stroke-width="3" marker-end="url(#arrR)"/>
        <text x="310" y="225" font-family="monospace" font-size="11" font-weight="800" fill="#dc2626">Kirim Fake IP</text>

        <!-- Verdict Banner -->
        <rect x="30" y="390" width="370" height="55" rx="8" fill="#fee2e2" stroke="#ef4444"/>
        <text x="215" y="414" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">BAHAYA: Klien Diarahkan ke Web Phishing</text>
        <text x="215" y="433" font-family="system-ui, sans-serif" font-size="11" fill="#7f1d1d" text-anchor="middle">User login &amp; password dicuri tanpa disadari.</text>
    </g>

    <!-- RIGHT: DNSSEC DEFENSE -->
    <g transform="translate(495, 30)">
        <rect width="430" height="480" rx="14" fill="#fff" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
        <rect x="30" y="16" width="370" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
        <text x="215" y="41" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#166534" text-anchor="middle">Solusi: DNSSEC (Validasi Kriptografi)</text>

        <!-- Authoritative with Key -->
        <g transform="translate(30, 85)">
            <rect width="130" height="85" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
            <text x="65" y="36" font-size="26" text-anchor="middle">🏢</text>
            <text x="65" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#166534" text-anchor="middle">Authoritative</text>
            <rect x="10" y="64" width="110" height="16" rx="3" fill="#dcfce7"/>
            <text x="65" y="76" font-family="monospace" font-size="9.5" font-weight="700" fill="#15803d" text-anchor="middle">Private Key Sign</text>
        </g>

        <!-- Resolver with Shield -->
        <g transform="translate(260, 85)">
            <rect width="135" height="90" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
            <text x="67" y="34" font-size="24" text-anchor="middle">🛡️</text>
            <text x="67" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#166534" text-anchor="middle">Validating Resolver</text>
            <rect x="10" y="65" width="115" height="18" rx="3" fill="#dcfce7"/>
            <text x="67" y="78" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#15803d" text-anchor="middle">Tanda Tangan Valid ✓</text>
        </g>

        <!-- Signed RRSET -->
        <path d="M 160 125 L 260 125" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
        <text x="210" y="117" font-family="monospace" font-size="10.5" font-weight="800" fill="#166534" text-anchor="middle">RRSIG Valid</text>

        <!-- Protected Client -->
        <g transform="translate(150, 260)">
            <rect width="130" height="75" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
            <text x="65" y="36" font-size="26" text-anchor="middle">💻</text>
            <text x="65" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">Protected Client</text>
        </g>

        <!-- Safe Arrow -->
        <path d="M 320 175 L 250 260" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
        <text x="310" y="225" font-family="monospace" font-size="11" font-weight="800" fill="#166534">IP Asli Terverifikasi</text>

        <!-- Verdict Banner -->
        <rect x="30" y="390" width="370" height="55" rx="8" fill="#dcfce7" stroke="#16a34a"/>
        <text x="215" y="414" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">AMAN: Data Palsu Ditolak Otomatis</text>
        <text x="215" y="433" font-family="system-ui, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Integritas &amp; keaslian rekaman DNS terjamin 100%.</text>
    </g>
</svg>