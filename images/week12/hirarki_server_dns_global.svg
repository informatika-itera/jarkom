<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <text x="480" y="42" font-family="system-ui, sans-serif" font-size="19" font-weight="800" fill="#0f172a" text-anchor="middle">HIERARKI GLOBAL SERVER DNS (INVERTED TREE)</text>

    <!-- Branches -->
    <g stroke="#94a3b8" stroke-width="2.5" fill="none">
        <path d="M 480 115 L 480 145 L 200 145 L 200 170"/>
        <path d="M 480 115 L 480 170"/>
        <path d="M 480 145 L 760 145 L 760 170"/>

        <path d="M 200 235 L 200 265 L 120 265 L 120 290"/>
        <path d="M 200 235 L 200 265 L 280 265 L 280 290"/>

        <path d="M 480 235 L 480 265 L 400 265 L 400 290"/>
        <path d="M 480 235 L 480 265 L 560 265 L 560 290"/>

        <path d="M 760 235 L 760 265 L 680 265 L 680 290"/>
        <path d="M 760 235 L 760 265 L 840 265 L 840 290"/>
    </g>

    <!-- LEVEL 1: ROOT -->
    <g transform="translate(330, 60)">
        <rect width="300" height="55" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)"/>
        <text x="150" y="27" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#92400e" text-anchor="middle">ROOT DNS SERVERS (.)</text>
        <text x="150" y="46" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#b45309" text-anchor="middle">13 Anycast Clusters Dunia (A s.d. M)</text>
    </g>

    <!-- LEVEL 2: TLDs -->
    <g transform="translate(100, 170)">
        <rect width="200" height="65" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="100" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">TLD .com / .net</text>
        <text x="100" y="49" font-family="system-ui, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Generic TLD (Verisign)</text>
    </g>
    <g transform="translate(380, 170)">
        <rect width="200" height="65" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="100" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">ccTLD .id</text>
        <text x="100" y="49" font-family="system-ui, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Country-Code (PANDI)</text>
    </g>
    <g transform="translate(660, 170)">
        <rect width="200" height="65" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="100" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">TLD .edu / .org</text>
        <text x="100" y="49" font-family="system-ui, sans-serif" font-size="12" fill="#2563eb" text-anchor="middle">Pendidikan &amp; Organisasi</text>
    </g>

