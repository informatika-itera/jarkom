        <text x="75" y="26" font-family="monospace" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">amazon.com</text>
        <text x="75" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#166534" text-anchor="middle">Authoritative</text>
    </g>
    <g transform="translate(365, 290)">
        <rect width="150" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="75" y="26" font-family="monospace" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">itera.ac.id</text>
        <text x="75" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#166534" text-anchor="middle">Authoritative</text>
    </g>
    <g transform="translate(525, 290)">
        <rect width="150" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="75" y="26" font-family="monospace" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">kominfo.go.id</text>
        <text x="75" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#166534" text-anchor="middle">Authoritative</text>
    </g>
    <g transform="translate(685, 290)">
        <rect width="130" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="65" y="26" font-family="monospace" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">mit.edu</text>
        <text x="65" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#166534" text-anchor="middle">Authoritative</text>
    </g>
    <g transform="translate(825, 290)">
        <rect width="110" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="55" y="26" font-family="monospace" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">ieee.org</text>
        <text x="55" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#166534" text-anchor="middle">Authoritative</text>
    </g>

    <!-- LEVEL 4: LOCAL RESOLVER -->
    <g transform="translate(180, 410)">
        <rect width="600" height="85" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
        <text x="150" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#6b21a8">🏢 Local DNS Resolver</text>
        <text x="150" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#7e22ce">(ISP / LAN Kampus) — Cache lokal &amp; perantara query</text>

        <circle cx="70" cy="42" r="28" fill="#dbeafe"/>
        <text x="70" y="50" font-size="24" text-anchor="middle">💻</text>
        <text x="70" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">Client</text>
