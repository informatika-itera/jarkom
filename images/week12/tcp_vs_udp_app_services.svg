<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="800" height="500" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <text x="400" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">KOMPARASI LAYANAN: TCP VS UDP UNTUK APLIKASI</text>

    <!-- LEFT: TCP -->
    <g transform="translate(50, 80)">
        <rect width="330" height="380" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <rect x="25" y="20" width="280" height="40" rx="8" fill="#2563eb"/>
        <text x="165" y="46" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">TCP (Transmission Control)</text>

        <!-- Feature List -->
        <g transform="translate(25, 80)">
            <rect width="280" height="50" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
            <text x="15" y="25" font-size="16">🤝</text>
            <text x="42" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af">Connection-Oriented</text>
            <text x="42" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">3-Way Handshake sebelum kirim data</text>

            <rect y="60" width="280" height="50" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
            <text x="15" y="85" font-size="16">🛡️</text>
            <text x="42" y="84" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af">Reliable Data Transfer</text>
            <text x="42" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Retransmisi paket hilang, urut &amp; utuh</text>

            <rect y="120" width="280" height="50" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
            <text x="15" y="145" font-size="16">🚦</text>
            <text x="42" y="144" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af">Flow &amp; Congestion Control</text>
            <text x="42" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Cegah buffer overflow &amp; overload network</text>

            <rect y="180" width="280" height="50" rx="6" fill="#ffffff" stroke="#bfdbfe"/>
            <text x="15" y="205" font-size="16">📂</text>
            <text x="42" y="204" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af">Aplikasi: Web, File, Email</text>
            <text x="42" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">HTTP/HTTPS, FTP, SMTP, IMAP</text>
        </g>
    </g>

    <!-- RIGHT: UDP -->
    <g transform="translate(420, 80)">
        <rect width="330" height="380" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
        <rect x="25" y="20" width="280" height="40" rx="8" fill="#16a34a"/>
        <text x="165" y="46" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#ffffff" text-anchor="middle">UDP (User Datagram Protocol)</text>

        <!-- Feature List -->
        <g transform="translate(25, 80)">
            <rect width="280" height="50" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
            <text x="15" y="25" font-size="16">⚡</text>
            <text x="42" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534">Connectionless</text>
            <text x="42" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Tanpa handshake, langsung kirim (0-RTT)</text>

            <rect y="60" width="280" height="50" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
            <text x="15" y="85" font-size="16">🎯</text>
            <text x="42" y="84" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534">Unreliable (Best Effort)</text>
            <text x="42" y="100" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Tidak ada retransmisi, toleran drop</text>

            <rect y="120" width="280" height="50" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
            <text x="15" y="145" font-size="16">🚀</text>
            <text x="42" y="144" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534">Lightweight &amp; Zero Delay Control</text>
            <text x="42" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Kirim secepat mungkin tanpa throttle</text>

            <rect y="180" width="280" height="50" rx="6" fill="#ffffff" stroke="#bbf7d0"/>
            <text x="15" y="205" font-size="16">🎮</text>
            <text x="42" y="204" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534">Aplikasi: Real-Time &amp; Kueri Ringan</text>
            <text x="42" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">DNS, VoIP, Live Video, Game Online</text>
        </g>
    </g>
</svg>