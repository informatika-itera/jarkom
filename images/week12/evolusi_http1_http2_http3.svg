<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- LANE 1: HTTP/1.1 -->
    <g transform="translate(40, 25)">
        <rect width="880" height="140" rx="12" fill="#fff" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)"/>
        <text x="30" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#991b1b">HTTP/1.1 (TCP):</text>
        <text x="175" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#dc2626">Sequential Pipeline &amp; HOL Blocking</text>

        <!-- Pipeline -->
        <g transform="translate(30, 50)">
            <rect width="820" height="65" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
            <rect x="20" y="12" width="230" height="40" rx="6" fill="#ef4444"/>
            <text x="135" y="37" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">❌ Objek 1 (Drop / Macet)</text>

            <rect x="270" y="12" width="210" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4,2"/>
            <text x="375" y="37" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Objek 2 (Tertahan antrean)</text>

            <rect x="500" y="12" width="210" height="40" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-dasharray="4,2"/>
            <text x="605" y="37" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle">Objek 3 (Tertahan antrean)</text>
        </g>
    </g>

    <!-- LANE 2: HTTP/2 -->
    <g transform="translate(40, 195)">
        <rect width="880" height="150" rx="12" fill="#fff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
        <text x="30" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e40af">HTTP/2 (Single TCP):</text>
        <text x="210" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Binary Framing &amp; Multiplexing</text>

        <!-- Pipeline -->
        <g transform="translate(30, 50)">
            <rect width="820" height="75" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
            <!-- Interleaved frames -->
            <rect x="20" y="17" width="115" height="40" rx="4" fill="#2563eb"/>
            <text x="77" y="42" font-family="monospace" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Frame 1A</text>

            <rect x="155" y="17" width="115" height="40" rx="4" fill="#16a34a"/>
            <text x="212" y="42" font-family="monospace" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Frame 2A</text>

            <rect x="290" y="17" width="115" height="40" rx="4" fill="#f59e0b"/>
            <text x="347" y="42" font-family="monospace" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Frame 3A</text>

            <rect x="425" y="17" width="115" height="40" rx="4" fill="#2563eb"/>
            <text x="482" y="42" font-family="monospace" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Frame 1B</text>

            <rect x="560" y="17" width="115" height="40" rx="4" fill="#16a34a"/>
            <text x="617" y="42" font-family="monospace" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Frame 2B</text>

            <rect x="695" y="17" width="105" height="40" rx="4" fill="#f59e0b"/>
            <text x="747" y="42" font-family="monospace" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Frame 3B</text>
        </g>
    </g>

    <!-- LANE 3: HTTP/3 -->
    <g transform="translate(40, 370)">
        <rect width="880" height="150" rx="12" fill="#fff" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
        <text x="30" y="32" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#166534">HTTP/3 (QUIC / UDP):</text>
        <text x="230" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#15803d">Zero Transport HOL Blocking (Independent Streams)</text>

        <!-- Streams -->
        <g transform="translate(30, 48)">
            <rect x="0" y="0" width="820" height="24" rx="4" fill="#fee2e2" stroke="#ef4444"/>
            <text x="15" y="17" font-family="monospace" font-size="11.5" font-weight="700" fill="#b91c1c">Stream 1 (Drop di sini):</text>
            <text x="320" y="17" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#dc2626">Hanya Stream 1 yang retransmit!</text>

            <rect x="0" y="30" width="820" height="24" rx="4" fill="#dcfce7" stroke="#16a34a"/>
            <text x="15" y="47" font-family="monospace" font-size="11.5" font-weight="700" fill="#15803d">Stream 2 (CSS):</text>
            <text x="320" y="47" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#166534">✅ Tetap mengalir lancar tanpa terganggu</text>

            <rect x="0" y="60" width="820" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b"/>
            <text x="15" y="77" font-family="monospace" font-size="11.5" font-weight="700" fill="#b45309">Stream 3 (JS):</text>
            <text x="320" y="77" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">✅ Tetap mengalir lancar tanpa terganggu</text>
        </g>
    </g>
</svg>