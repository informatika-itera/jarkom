<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <text x="480" y="45" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f172a" text-anchor="middle">ALUR E-MAIL: PUSH (SMTP) VS PULL (POP3 / IMAP)</text>

    <!-- 1. Sender Agent -->
    <g transform="translate(40, 100)">
        <rect width="180" height="340" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="90" y="55" font-size="40" text-anchor="middle">👤</text>
        <text x="90" y="95" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e40af" text-anchor="middle">Sender Agent</text>
        <text x="90" y="120" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Alice</text>

        <rect x="20" y="170" width="140" height="60" rx="8" fill="#dbeafe"/>
        <text x="90" y="195" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">PUSH</text>
        <text x="90" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#1d4ed8" text-anchor="middle">Kirim ke server</text>
    </g>

    <!-- Arrow 1: SMTP -->
    <g transform="translate(220, 230)">
        <line x1="0" y1="0" x2="60" y2="0" stroke="#2563eb" stroke-width="5" marker-end="url(#arrB)"/>
        <rect x="-5" y="-30" width="70" height="24" rx="4" fill="#2563eb"/>
        <text x="30" y="-14" font-family="monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">SMTP</text>
    </g>

    <!-- 2. Sender Server -->
    <g transform="translate(280, 100)">
        <rect width="180" height="340" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
        <text x="90" y="55" font-size="40" text-anchor="middle">🏢</text>
        <text x="90" y="95" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#166534" text-anchor="middle">Sender Server</text>
        <text x="90" y="120" font-family="monospace" font-size="11.5" fill="#15803d" text-anchor="middle">mail.source.org</text>

        <!-- Queue -->
        <rect x="20" y="160" width="140" height="80" rx="8" fill="#dcfce7" stroke="#16a34a"/>
        <text x="90" y="190" font-size="22" text-anchor="middle">📬</text>
        <text x="90" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#166534" text-anchor="middle">Message Queue</text>
    </g>

    <!-- Arrow 2: Inter-server SMTP -->
    <g transform="translate(460, 230)">
        <line x1="0" y1="0" x2="80" y2="0" stroke="#2563eb" stroke-width="5" marker-end="url(#arrB)"/>
        <rect x="0" y="-30" width="80" height="24" rx="4" fill="#2563eb"/>
        <text x="40" y="-14" font-family="monospace" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">SMTP (25)</text>
    </g>

    <!-- 3. Receiver Server -->
    <g transform="translate(540, 100)">
        <rect width="180" height="340" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
        <text x="90" y="55" font-size="40" text-anchor="middle">🏢</text>
        <text x="90" y="95" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#166534" text-anchor="middle">Receiver Server</text>
        <text x="90" y="120" font-family="monospace" font-size="11.5" fill="#15803d" text-anchor="middle">mail.target.edu</text>

        <!-- Mailbox -->
        <rect x="20" y="160" width="140" height="80" rx="8" fill="#faf5ff" stroke="#a855f7"/>
        <text x="90" y="190" font-size="22" text-anchor="middle">📥</text>
        <text x="90" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#6b21a8" text-anchor="middle">User Mailbox</text>
    </g>

    <!-- Arrow 3: Pull Protocol -->
    <g transform="translate(720, 230)">
        <line x1="0" y1="0" x2="60" y2="0" stroke="#16a34a" stroke-width="5" marker-end="url(#arrG)"/>
        <rect x="-5" y="-30" width="70" height="24" rx="4" fill="#16a34a"/>
        <text x="30" y="-14" font-family="monospace" font-size="10.5" font-weight="700" fill="#fff" text-anchor="middle">IMAP/POP</text>
    </g>

    <!-- 4. Receiver Agent -->
    <g transform="translate(780, 100)">
        <rect width="140" height="340" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="70" y="55" font-size="40" text-anchor="middle">👤</text>
        <text x="70" y="95" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e40af" text-anchor="middle">Receiver</text>
        <text x="70" y="120" font-family="system-ui, sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Bob</text>

        <rect x="15" y="170" width="110" height="60" rx="8" fill="#dcfce7"/>
        <text x="70" y="195" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">PULL</text>
        <text x="70" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#14532d" text-anchor="middle">Tarik saat online</text>
    </g>

    <!-- FOOTER PILL -->
    <rect x="230" y="475" width="500" height="36" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="480" y="498" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155" text-anchor="middle">SMTP = Protokol Kirim (Push) | POP3 / IMAP / Webmail = Protokol Ambil (Pull)</text>
</svg>