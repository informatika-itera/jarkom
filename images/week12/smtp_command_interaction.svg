<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="800" height="500" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <text x="400" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">INTERAKSI PROTOKOL SMTP: HANDSHAKE &amp; TRANSFER</text>

    <!-- Timelines -->
    <line x1="140" y1="70" x2="140" y2="440" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="660" y1="70" x2="660" y2="440" stroke="#0f172a" stroke-width="2.5"/>
    <text x="140" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">Client (Sender)</text>
    <text x="660" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">Server (Receiver)</text>

    <!-- Phase 1: Handshake -->
    <line x1="660" y1="95" x2="140" y2="120" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
    <text x="400" y="105" font-family="monospace" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">220 mail.target.edu ESMTP Ready</text>

    <line x1="140" y1="135" x2="660" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
    <text x="400" y="145" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">HELO mail.source.org</text>

    <line x1="660" y1="175" x2="140" y2="200" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
    <text x="400" y="185" font-family="monospace" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">250 Hello mail.source.org</text>

    <!-- Phase 2: Mail Transfer -->
    <line x1="140" y1="215" x2="660" y2="240" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
    <text x="400" y="225" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">MAIL FROM: &lt;alice@source.org&gt;</text>

    <line x1="660" y1="250" x2="140" y2="275" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
    <text x="400" y="260" font-family="monospace" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">250 2.1.0 Sender OK</text>

    <line x1="140" y1="285" x2="660" y2="310" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
    <text x="400" y="295" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">RCPT TO: &lt;bob@target.edu&gt;</text>

    <line x1="660" y1="320" x2="140" y2="345" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
    <text x="400" y="330" font-family="monospace" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">250 2.1.5 Recipient OK</text>

    <line x1="140" y1="355" x2="660" y2="380" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
    <text x="400" y="365" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">DATA (Pesan Teks ASCII diakhiri titik '.')</text>

    <line x1="660" y1="390" x2="140" y2="415" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
    <text x="400" y="400" font-family="monospace" font-size="12" font-weight="700" fill="#166534" text-anchor="middle">250 2.0.0 Message queued for delivery</text>

    <!-- Phase 3: Quit -->
    <line x1="140" y1="425" x2="660" y2="445" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
    <text x="400" y="433" font-family="monospace" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">QUIT &rarr; 221 Bye</text>
</svg>