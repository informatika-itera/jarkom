<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- LEFT PANEL: NON-PERSISTENT -->
    <g transform="translate(35, 30)">
        <rect width="430" height="480" rx="14" fill="#fff" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)"/>
        <rect x="30" y="16" width="370" height="36" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
        <text x="215" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#991b1b" text-anchor="middle">Non-Persistent (HTTP/1.0)</text>

        <!-- Timelines -->
        <line x1="80" y1="75" x2="80" y2="400" stroke="#0f172a" stroke-width="2.5"/>
        <line x1="330" y1="75" x2="330" y2="400" stroke="#0f172a" stroke-width="2.5"/>
        <text x="80" y="70" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">Client</text>
        <text x="330" y="70" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">Server</text>

        <!-- Object 1 Handshake -->
        <line x1="80" y1="95" x2="330" y2="120" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
        <text x="205" y="103" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">TCP SYN</text>
        <line x1="330" y1="120" x2="80" y2="145" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
        <text x="205" y="140" font-family="monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">TCP SYN-ACK</text>
        <text x="350" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#9333ea">1 RTT</text>

        <!-- Object 1 Request/Response -->
        <line x1="80" y1="160" x2="330" y2="185" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
        <text x="205" y="168" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">GET /page.html</text>
        <line x1="330" y1="185" x2="80" y2="210" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
        <text x="205" y="205" font-family="monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">200 OK + File</text>
        <text x="350" y="190" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#9333ea">1 RTT</text>

        <!-- TCP Closed Badge -->
        <rect x="120" y="224" width="170" height="24" rx="4" fill="#fee2e2" stroke="#f87171"/>
        <text x="205" y="240" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#dc2626" text-anchor="middle">✕ TCP Connection Closed</text>

        <!-- Object 2 Handshake & Request -->
        <g transform="translate(0, 40)">
            <line x1="80" y1="225" x2="330" y2="250" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrB)"/>
            <line x1="330" y1="250" x2="80" y2="275" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrG)"/>
            <text x="205" y="255" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">Repeat TCP SYN (1 RTT)</text>

            <line x1="80" y1="290" x2="330" y2="315" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
            <text x="205" y="298" font-family="monospace" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">GET /image.png</text>
            <line x1="330" y1="315" x2="80" y2="340" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
            <text x="205" y="335" font-family="monospace" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">200 OK + File (1 RTT)</text>
        </g>

        <!-- Total Box -->
        <rect x="35" y="420" width="360" height="42" rx="8" fill="#dc2626"/>
        <text x="215" y="446" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">TOTAL: 4 × RTT (2 RTT per Objek)</text>
    </g>

    <!-- RIGHT PANEL: PERSISTENT -->
    <g transform="translate(495, 30)">
        <rect width="430" height="480" rx="14" fill="#fff" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
        <rect x="30" y="16" width="370" height="36" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="215" y="40" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#166534" text-anchor="middle">Persistent (HTTP/1.1)</text>

        <!-- Timelines -->
        <line x1="80" y1="75" x2="80" y2="400" stroke="#0f172a" stroke-width="2.5"/>
        <line x1="330" y1="75" x2="330" y2="400" stroke="#0f172a" stroke-width="2.5"/>
        <text x="80" y="70" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">Client</text>
        <text x="330" y="70" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#475569" text-anchor="middle">Server</text>

        <!-- Single Handshake -->
        <line x1="80" y1="95" x2="330" y2="120" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
        <text x="205" y="103" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">TCP SYN (Cukup 1×)</text>
        <line x1="330" y1="120" x2="80" y2="145" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
        <text x="205" y="140" font-family="monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">TCP SYN-ACK</text>
        <text x="350" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#9333ea">1 RTT</text>

        <!-- Base HTML -->
        <line x1="80" y1="160" x2="330" y2="185" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
        <text x="205" y="168" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">GET /page.html</text>
        <line x1="330" y1="185" x2="80" y2="210" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
        <text x="205" y="205" font-family="monospace" font-size="12" font-weight="700" fill="#16a34a" text-anchor="middle">200 OK + File</text>
        <text x="350" y="190" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#9333ea">1 RTT</text>

        <!-- TCP Open Banner -->
        <rect x="100" y="224" width="210" height="24" rx="4" fill="#dcfce7" stroke="#16a34a"/>
        <text x="205" y="240" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#15803d" text-anchor="middle">🟢 TCP Connection Remains OPEN</text>

        <!-- Subsequent Objects directly flow -->
        <g transform="translate(0, 35)">
            <line x1="80" y1="230" x2="330" y2="255" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
            <text x="205" y="238" font-family="monospace" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">GET /image.png</text>
            <line x1="330" y1="255" x2="80" y2="280" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
            <text x="205" y="275" font-family="monospace" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">200 OK + File</text>
            <text x="350" y="260" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#16a34a">1 RTT</text>

            <line x1="80" y1="295" x2="330" y2="320" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
            <text x="205" y="303" font-family="monospace" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle">GET /style.css</text>
            <line x1="330" y1="320" x2="80" y2="345" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
            <text x="205" y="340" font-family="monospace" font-size="11" font-weight="700" fill="#16a34a" text-anchor="middle">200 OK + File</text>
            <text x="350" y="325" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#16a34a">1 RTT</text>
        </g>

        <!-- Total Box -->
        <rect x="35" y="420" width="360" height="42" rx="8" fill="#16a34a"/>
        <text x="215" y="446" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">TOTAL: Cuma 1 × RTT per Objek Baru</text>
    </g>
</svg>