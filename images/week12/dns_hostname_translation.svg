<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="800" height="500" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <text x="400" y="45" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">TRANSLASI DNS: HUMAN NAME KE BINARY IP</text>

    <!-- Left Box: Human Domain Name -->
    <g transform="translate(60, 130)">
        <rect width="260" height="230" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="130" y="55" font-size="40" text-anchor="middle">👤</text>
        <text x="130" y="95" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#1e40af" text-anchor="middle">Human Hostname</text>
        <rect x="25" y="125" width="210" height="42" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="130" y="152" font-family="monospace" font-size="15" font-weight="800" fill="#1d4ed8" text-anchor="middle">www.example.com</text>
        <text x="130" y="195" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Mudah diingat manusia</text>
    </g>

    <!-- Middle: DNS Blackbox Engine -->
    <g transform="translate(345, 180)">
        <circle cx="55" cy="65" r="50" fill="#1e293b" filter="url(#shadow)"/>
        <text x="55" y="60" font-size="28" text-anchor="middle">⚙️</text>
        <text x="55" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">DNS Engine</text>

        <!-- Arrows -->
        <path d="M -25 65 L -5 65" stroke="#2563eb" stroke-width="4" marker-end="url(#arrB)"/>
        <path d="M 115 65 L 135 65" stroke="#16a34a" stroke-width="4" marker-end="url(#arrG)"/>
    </g>

    <!-- Right Box: Binary Network IP -->
    <g transform="translate(480, 130)">
        <rect width="260" height="230" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
        <text x="130" y="55" font-size="40" text-anchor="middle">🌐</text>
        <text x="130" y="95" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#166534" text-anchor="middle">Router / Network IP</text>
        <rect x="25" y="125" width="210" height="42" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
        <text x="130" y="152" font-family="monospace" font-size="15" font-weight="800" fill="#15803d" text-anchor="middle">103.111.201.21</text>
        <text x="130" y="195" font-family="system-ui, sans-serif" font-size="12" fill="#64748b" text-anchor="middle">32-bit Biner untuk Routing</text>
    </g>

    <!-- Bottom summary -->
    <rect x="150" y="420" width="500" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="400" y="442" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">Aplikasi memanggil gethostbyname() → Resolver mengembalikan IP</text>
</svg>