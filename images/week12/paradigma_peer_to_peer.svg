<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- HEADER TITLE -->
    <rect x="320" y="24" width="320" height="42" rx="21" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="480" y="51" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#92400e" text-anchor="middle">🌐 PEER-TO-PEER (P2P) MESH</text>

    <!-- MESH CONNECTIONS -->
    <g stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4">
        <line x1="480" y1="130" x2="220" y2="230"/>
        <line x1="480" y1="130" x2="740" y2="230"/>
        <line x1="220" y1="230" x2="330" y2="430"/>
        <line x1="740" y1="230" x2="630" y2="430"/>
        <line x1="330" y1="430" x2="630" y2="430"/>
        <line x1="220" y1="230" x2="630" y2="430"/>
        <line x1="740" y1="230" x2="330" y2="430"/>
    </g>

    <!-- ACTIVE CHUNK TRANSFERS (ARROWS) -->
    <g stroke="#16a34a" stroke-width="4">
        <line x1="430" y1="150" x2="280" y2="210" marker-end="url(#arrG)"/>
        <line x1="260" y1="260" x2="320" y2="380" marker-end="url(#arrG)"/>
        <line x1="580" y1="430" x2="390" y2="430" marker-end="url(#arrG)"/>
    </g>
    <g stroke="#2563eb" stroke-width="4">
        <line x1="530" y1="150" x2="680" y2="210" marker-end="url(#arrB)"/>
        <line x1="700" y1="270" x2="640" y2="380" marker-end="url(#arrB)"/>
        <line x1="380" y1="410" x2="570" y2="410" marker-end="url(#arrB)"/>
    </g>

    <!-- CENTER NO-SERVER BADGE -->
    <g transform="translate(390, 240)">
        <ellipse cx="90" cy="40" rx="90" ry="46" fill="#fef2f2" stroke="#f87171" stroke-width="2"/>
        <text x="90" y="32" font-size="24" text-anchor="middle">❌</text>
        <text x="90" y="54" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#dc2626" text-anchor="middle">No Central Server</text>
    </g>

    <!-- PEERS -->
    <!-- Peer 1 (Top) -->
    <g transform="translate(415, 80)">
        <rect width="130" height="85" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="65" y="35" font-size="28" text-anchor="middle">💻</text>
        <text x="65" y="65" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af" text-anchor="middle">Peer A</text>
    </g>
    <!-- Peer 2 (Left) -->
    <g transform="translate(150, 190)">
        <rect width="130" height="85" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="65" y="35" font-size="28" text-anchor="middle">💻</text>
        <text x="65" y="65" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af" text-anchor="middle">Peer B</text>
    </g>
    <!-- Peer 3 (Right) -->
    <g transform="translate(680, 190)">
        <rect width="130" height="85" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="65" y="35" font-size="28" text-anchor="middle">💻</text>
        <text x="65" y="65" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af" text-anchor="middle">Peer C</text>
    </g>
    <!-- Peer 4 (Bottom Left) -->
    <g transform="translate(260, 390)">
        <rect width="130" height="85" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="65" y="35" font-size="28" text-anchor="middle">💻</text>
        <text x="65" y="65" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af" text-anchor="middle">Peer D</text>
    </g>
    <!-- Peer 5 (Bottom Right) -->
    <g transform="translate(570, 390)">
        <rect width="130" height="85" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="65" y="35" font-size="28" text-anchor="middle">💻</text>
        <text x="65" y="65" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#1e40af" text-anchor="middle">Peer E</text>
    </g>

    <!-- FOOTER PILL -->
    <rect x="280" y="495" width="400" height="32" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="480" y="516" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">⚡ Self-Scalability: Peers upload and download chunks directly</text>
</svg>