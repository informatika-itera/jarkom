<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- CLIENTS (LEFT) -->
    <g transform="translate(60, 60)">
        <rect width="220" height="420" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <text x="110" y="48" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#1e40af" text-anchor="middle">CLIENTS</text>
        <text x="110" y="74" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#3b82f6" text-anchor="middle">Dynamic IP</text>

        <!-- Devices -->
        <g transform="translate(25, 100)">
            <rect width="170" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
            <text x="35" y="46" font-size="28">🖥️</text>
            <text x="75" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Desktop</text>
        </g>
        <g transform="translate(25, 185)">
            <rect width="170" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
            <text x="35" y="46" font-size="28">💻</text>
            <text x="75" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Laptop</text>
        </g>
        <g transform="translate(25, 270)">
            <rect width="170" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
            <text x="35" y="46" font-size="28">📱</text>
            <text x="75" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Mobile</text>
        </g>

        <!-- No direct client link indicator -->
        <rect x="25" y="360" width="170" height="36" rx="8" fill="#fee2e2" stroke="#f87171"/>
        <text x="110" y="383" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">✕ No Client-to-Client</text>
    </g>

    <!-- CENTER INTERNET & FLOW -->
    <g transform="translate(320, 100)">
        <ellipse cx="160" cy="170" rx="130" ry="85" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
        <text x="160" y="160" font-size="38" text-anchor="middle">☁️</text>
        <text x="160" y="195" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#334155" text-anchor="middle">INTERNET</text>

        <!-- Request Arrow (Top) -->
        <path d="M -20 100 L 340 100" stroke="#2563eb" stroke-width="6" marker-end="url(#arrB)"/>
        <rect x="75" y="60" width="170" height="34" rx="17" fill="#2563eb"/>
        <text x="160" y="83" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Request ➔</text>

        <!-- Response Arrow (Bottom) -->
        <path d="M 340 240 L -20 240" stroke="#16a34a" stroke-width="6" marker-end="url(#arrG)"/>
        <rect x="75" y="248" width="170" height="34" rx="17" fill="#16a34a"/>
        <text x="160" y="271" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">⬅ Response</text>
    </g>

    <!-- SERVER (RIGHT) -->
    <g transform="translate(680, 60)">
        <rect width="220" height="420" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
        <text x="110" y="48" font-family="system-ui, sans-serif" font-size="24" font-weight="800" fill="#166534" text-anchor="middle">SERVER</text>
        <text x="110" y="74" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#15803d" text-anchor="middle">Permanent Static IP</text>

        <!-- Server Rack -->
        <g transform="translate(30, 110)">
            <rect width="160" height="230" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2"/>
            <rect x="15" y="20" width="130" height="40" rx="4" fill="#1e293b"/>
            <circle cx="32" cy="40" r="5" fill="#10b981"/>
            <circle cx="48" cy="40" r="5" fill="#38bdf8"/>
            <rect x="70" y="36" width="60" height="8" rx="2" fill="#475569"/>

            <rect x="15" y="75" width="130" height="40" rx="4" fill="#1e293b"/>
            <circle cx="32" cy="95" r="5" fill="#10b981"/>
            <circle cx="48" cy="95" r="5" fill="#f59e0b"/>
            <rect x="70" y="91" width="60" height="8" rx="2" fill="#475569"/>

            <rect x="15" y="130" width="130" height="40" rx="4" fill="#1e293b"/>
            <circle cx="32" cy="150" r="5" fill="#10b981"/>
            <circle cx="48" cy="150" r="5" fill="#10b981"/>
            <rect x="70" y="146" width="60" height="8" rx="2" fill="#475569"/>

            <rect x="15" y="180" width="130" height="35" rx="4" fill="#1e293b"/>
            <circle cx="32" cy="198" r="5" fill="#38bdf8"/>
            <circle cx="48" cy="198" r="5" fill="#38bdf8"/>
            <rect x="70" y="194" width="60" height="8" rx="2" fill="#475569"/>
        </g>

        <rect x="25" y="360" width="170" height="36" rx="8" fill="#dcfce7" stroke="#86efac"/>
        <text x="110" y="383" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#166534" text-anchor="middle">⚡ Always-On Host</text>
    </g>
</svg>