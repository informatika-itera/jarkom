<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

    <!-- LEFT: ITERATED QUERY -->
    <g transform="translate(30, 30)">
        <rect width="435" height="480" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#cardShadow)"/>
        <text x="217" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#166534" text-anchor="middle">Iterated Query (Standar Internet)</text>
        <text x="217" y="55" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">Local DNS yang aktif mencari</text>

        <!-- Entities -->
        <g transform="translate(20, 80)">
            <!-- Client -->
            <rect x="0" y="0" width="80" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
            <text x="40" y="30" font-size="20" text-anchor="middle">💻</text>

            <!-- Local DNS -->
            <rect x="0" y="160" width="95" height="70" rx="6" fill="#fdf4ff" stroke="#a855f7" stroke-width="2"/>
            <text x="47" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#7e22ce" text-anchor="middle">Local DNS</text>
            <text x="47" y="50" font-family="system-ui, sans-serif" font-size="9" fill="#6b21a8" text-anchor="middle">Pencari Aktif</text>

            <!-- Root, TLD, Auth on right -->
            <rect x="260" y="0" width="130" height="45" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
            <text x="325" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400e" text-anchor="middle">Root DNS</text>

            <rect x="260" y="120" width="130" height="45" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
            <text x="325" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1e40af" text-anchor="middle">TLD .edu</text>

            <rect x="260" y="240" width="130" height="45" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
            <text x="325" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Authoritative</text>

            <!-- Arrows -->
            <!-- 1 & 8 -->
            <line x1="30" y1="50" x2="30" y2="160" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
            <text x="20" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#2563eb">1</text>
            <line x1="50" y1="160" x2="50" y2="50" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
            <text x="60" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#16a34a">8</text>

            <!-- 2 & 3 (Root) -->
            <line x1="95" y1="170" x2="260" y2="35" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
            <text x="160" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#2563eb">2</text>
            <line x1="260" y1="42" x2="95" y2="177" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrO)"/>
            <text x="180" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f59e0b">3</text>

            <!-- 4 & 5 (TLD) -->
            <line x1="95" y1="190" x2="260" y2="135" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
            <text x="160" y="155" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#2563eb">4</text>
            <line x1="260" y1="145" x2="95" y2="200" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrO)"/>
            <text x="180" y="185" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#f59e0b">5</text>

            <!-- 6 & 7 (Auth) -->
            <line x1="95" y1="215" x2="260" y2="250" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
            <text x="160" y="225" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#2563eb">6</text>
            <line x1="260" y1="265" x2="95" y2="230" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
            <text x="180" y="260" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#16a34a">7</text>
        </g>

        <rect x="25" y="420" width="385" height="36" rx="6" fill="#ffffff" stroke="#86efac"/>
        <text x="217" y="443" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#15803d" text-anchor="middle">✅ Server Akar tetap ringan (hanya merujuk ke TLD)</text>
    </g>

    <!-- RIGHT: RECURSIVE QUERY -->
    <g transform="translate(495, 30)">
        <rect width="435" height="480" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="2" filter="url(#cardShadow)"/>
        <text x="217" y="35" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#991b1b" text-anchor="middle">Recursive Query</text>
        <text x="217" y="55" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Beban Menumpuk di Server Puncak</text>

        <!-- Entities -->
        <g transform="translate(20, 80)">
            <rect x="0" y="0" width="80" height="50" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
            <text x="40" y="30" font-size="20" text-anchor="middle">💻</text>

            <rect x="0" y="100" width="80" height="50" rx="6" fill="#fdf4ff" stroke="#a855f7"/>
            <text x="40" y="30" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7e22ce" text-anchor="middle">Local DNS</text>

            <!-- Cascading servers -->
            <rect x="0" y="200" width="120" height="60" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
            <text x="60" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#dc2626" text-anchor="middle">Root DNS</text>
            <text x="60" y="47" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#991b1b" text-anchor="middle">Beban Puncak!</text>

            <rect x="250" y="100" width="130" height="50" rx="6" fill="#fee2e2" stroke="#f87171"/>
            <text x="315" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">TLD .edu</text>

            <rect x="250" y="200" width="130" height="50" rx="6" fill="#f0fdf4" stroke="#16a34a"/>
            <text x="315" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">Authoritative</text>

            <!-- Cascading Chained Arrows -->
            <line x1="30" y1="50" x2="30" y2="100" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
            <text x="18" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#2563eb">1</text>
            <line x1="50" y1="100" x2="50" y2="50" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
            <text x="62" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#16a34a">8</text>

            <line x1="30" y1="150" x2="30" y2="200" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
            <text x="18" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#2563eb">2</text>
            <line x1="50" y1="200" x2="50" y2="150" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
            <text x="62" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#16a34a">7</text>

            <!-- Chained Root to TLD -->
            <line x1="120" y1="215" x2="250" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
            <text x="195" y="165" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#2563eb">3</text>
            <line x1="250" y1="145" x2="120" y2="225" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
            <text x="195" y="200" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#16a34a">6</text>

            <!-- TLD to Auth -->
            <line x1="300" y1="150" x2="300" y2="200" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
            <text x="288" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#2563eb">4</text>
            <line x1="330" y1="200" x2="330" y2="150" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
            <text x="342" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#16a34a">5</text>
        </g>

        <rect x="25" y="420" width="385" height="36" rx="6" fill="#ffffff" stroke="#fca5a5"/>
        <text x="217" y="443" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#dc2626" text-anchor="middle">⚠️ Ditolak server internet: Terlalu membebani server akar</text>
    </g>
</svg>