<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="800" height="500" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <text x="400" y="40" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">FORMAT RESOURCE RECORD (RR) PADA DATABASE DNS</text>
    <text x="400" y="65" font-family="monospace" font-size="14" font-weight="800" fill="#2563eb" text-anchor="middle">(Name, Value, Type, TTL)</text>

    <!-- 4 Types Grid -->
    <!-- Type A -->
    <g transform="translate(50, 95)">
        <rect width="330" height="155" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
        <rect x="15" y="15" width="80" height="26" rx="4" fill="#2563eb"/>
        <text x="55" y="33" font-family="monospace" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Type A</text>
        <text x="110" y="33" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af">Hostname → IPv4</text>
        <rect x="15" y="55" width="300" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="25" y="81" font-family="monospace" font-size="11" fill="#334155">('example.com', '103.111.201.21')</text>
        <text x="15" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Translasi nama domain ke IP host server</text>
    </g>

    <!-- Type NS -->
    <g transform="translate(420, 95)">
        <rect width="330" height="155" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
        <rect x="15" y="15" width="80" height="26" rx="4" fill="#16a34a"/>
        <text x="55" y="33" font-family="monospace" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Type NS</text>
        <text x="110" y="33" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534">Domain → Name Server</text>
        <rect x="15" y="55" width="300" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="25" y="81" font-family="monospace" font-size="11" fill="#334155">('example.com', 'dns1.example.com')</text>
        <text x="15" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Menunjuk server DNS otoritatif untuk domain</text>
    </g>

    <!-- Type CNAME -->
    <g transform="translate(50, 275)">
        <rect width="330" height="155" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
        <rect x="15" y="15" width="105" height="26" rx="4" fill="#f59e0b"/>
        <text x="67" y="33" font-family="monospace" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Type CNAME</text>
        <text x="135" y="33" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#92400e">Alias → Canonical Name</text>
        <rect x="15" y="55" width="300" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="25" y="81" font-family="monospace" font-size="11" fill="#334155">('relay1.example.com', 'example.com')</text>
        <text x="15" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Menetapkan nama alias ke nama resmi server</text>
    </g>

    <!-- Type MX -->
    <g transform="translate(420, 275)">
        <rect width="330" height="155" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2" filter="url(#shadow)"/>
        <rect x="15" y="15" width="80" height="26" rx="4" fill="#a855f7"/>
        <text x="55" y="33" font-family="monospace" font-size="12" font-weight="800" fill="#fff" text-anchor="middle">Type MX</text>
        <text x="110" y="33" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#6b21a8">Domain → Mail Server</text>
        <rect x="15" y="55" width="300" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="25" y="81" font-family="monospace" font-size="11" fill="#334155">('example.com', 'mail.example.com')</text>
        <text x="15" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Mengarahkan rute pengiriman email ke server SMTP</text>
    </g>

    <!-- TTL pill -->
    <rect x="250" y="450" width="300" height="30" rx="15" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="400" y="470" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">TTL (Time to Live) = Durasi validitas cache</text>
</svg>