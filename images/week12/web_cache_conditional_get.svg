<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- SECTION 1: CACHE HIT (TOP) -->
    <g transform="translate(40, 30)">
        <rect width="880" height="210" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
        <rect x="20" y="15" width="180" height="28" rx="6" fill="#16a34a"/>
        <text x="110" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">⚡ SKENARIO 1: CACHE HIT</text>

        <!-- Client -->
        <g transform="translate(60, 65)">
            <rect width="120" height="110" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
            <text x="60" y="45" font-size="32" text-anchor="middle">💻</text>
            <text x="60" y="75" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">Client</text>
        </g>

        <!-- Proxy Cache -->
        <g transform="translate(380, 65)">
            <rect width="160" height="110" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="2.5"/>
            <text x="80" y="45" font-size="32" text-anchor="middle">🗄️</text>
            <text x="80" y="72" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#15803d" text-anchor="middle">Web Proxy Cache</text>
            <text x="80" y="92" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#166534" text-anchor="middle">[Objek Tersedia]</text>
        </g>

        <!-- Origin Server (Greyed out) -->
        <g transform="translate(700, 65)">
            <rect width="130" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
            <text x="65" y="45" font-size="32" text-anchor="middle">☁️</text>
            <text x="65" y="72" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle">Origin Server</text>
            <text x="65" y="92" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">(Tidak Dilibatkan)</text>
        </g>

        <!-- Arrows -->
        <path d="M 180 100 L 380 100" stroke="#2563eb" stroke-width="4" marker-end="url(#arrB)"/>
        <text x="280" y="90" font-family="monospace" font-size="12" font-weight="700" fill="#2563eb" text-anchor="middle">GET /logo.png</text>

        <path d="M 380 140 L 180 140" stroke="#16a34a" stroke-width="4" marker-end="url(#arrG)"/>
        <text x="280" y="162" font-family="monospace" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">200 OK (Instan &lt; 10ms)</text>
    </g>

    <!-- SECTION 2: CONDITIONAL GET (BOTTOM) -->
    <g transform="translate(40, 270)">
        <rect width="880" height="235" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
        <rect x="20" y="15" width="240" height="28" rx="6" fill="#2563eb"/>
        <text x="140" y="34" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">🔍 SKENARIO 2: CONDITIONAL GET</text>

        <!-- Proxy Cache (Center Left) -->
        <g transform="translate(180, 75)">
            <rect width="160" height="120" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
            <text x="80" y="45" font-size="32" text-anchor="middle">🗄️</text>
            <text x="80" y="74" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">Web Proxy Cache</text>
            <text x="80" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Validasi Objek Lama</text>
        </g>

        <!-- Origin Server (Right) -->
        <g transform="translate(620, 75)">
            <rect width="160" height="120" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
            <text x="80" y="45" font-size="32" text-anchor="middle">🏢</text>
            <text x="80" y="74" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">Origin Server</text>
            <text x="80" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#15803d" text-anchor="middle">Cek Timestamp</text>
        </g>

        <!-- Request Arrow -->
        <path d="M 340 115 L 620 115" stroke="#2563eb" stroke-width="4" marker-end="url(#arrB)"/>
        <rect x="360" y="85" width="240" height="25" rx="5" fill="#2563eb"/>
        <text x="480" y="102" font-family="monospace" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">GET /logo.png + If-Modified-Since</text>

        <!-- Response Arrow -->
        <path d="M 620 160 L 340 160" stroke="#16a34a" stroke-width="4" marker-end="url(#arrG)"/>
        <rect x="360" y="168" width="240" height="25" rx="5" fill="#16a34a"/>
        <text x="480" y="185" font-family="monospace" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">HTTP 304 Not Modified</text>
    </g>
</svg>