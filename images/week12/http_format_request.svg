<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="800" height="500" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <text x="400" y="42" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#0f172a" text-anchor="middle">STRUKTUR PESAN HTTP REQUEST (RFC 7230)</text>

    <!-- SECTION 1: REQUEST LINE -->
    <g transform="translate(50, 70)">
        <rect width="700" height="65" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
        <rect x="15" y="15" width="130" height="35" rx="6" fill="#2563eb"/>
        <text x="80" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Request Line</text>

        <g transform="translate(160, 18)">
            <rect width="120" height="30" rx="4" fill="#ffffff" stroke="#3b82f6"/>
            <text x="60" y="20" font-family="monospace" font-size="12" font-weight="800" fill="#2563eb" text-anchor="middle">Method (GET)</text>
            
            <rect x="130" width="210" height="30" rx="4" fill="#ffffff" stroke="#059669"/>
            <text x="235" y="20" font-family="monospace" font-size="12" font-weight="800" fill="#059669" text-anchor="middle">URL (/index.html)</text>

            <rect x="350" width="120" height="30" rx="4" fill="#ffffff" stroke="#d97706"/>
            <text x="410" y="20" font-family="monospace" font-size="12" font-weight="800" fill="#d97706" text-anchor="middle">HTTP/1.1</text>

            <rect x="480" width="45" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
            <text x="502" y="20" font-family="monospace" font-size="11" font-weight="700" fill="#64748b" text-anchor="middle">
</text>
        </g>
    </g>

    <!-- SECTION 2: HEADER LINES -->
    <g transform="translate(50, 150)">
        <rect width="700" height="155" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
        <rect x="15" y="15" width="130" height="35" rx="6" fill="#475569"/>
        <text x="80" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Header Lines</text>

        <!-- Header items -->
        <g transform="translate(160, 15)">
            <rect width="515" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
            <text x="15" y="23" font-family="monospace" font-size="11.5" fill="#0f172a"><tspan font-weight="700" fill="#2563eb">Host:</tspan> www.example.com <tspan fill="#94a3b8">
</tspan></text>

            <rect y="42" width="515" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
            <text x="15" y="65" font-family="monospace" font-size="11.5" fill="#0f172a"><tspan font-weight="700" fill="#2563eb">User-Agent:</tspan> Mozilla/5.0 (Windows NT 10.0) <tspan fill="#94a3b8">
</tspan></text>

            <rect y="84" width="515" height="36" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
            <text x="15" y="107" font-family="monospace" font-size="11.5" fill="#0f172a"><tspan font-weight="700" fill="#2563eb">Accept-Language:</tspan> id, en-US;q=0.7 <tspan fill="#94a3b8">
</tspan></text>
        </g>
    </g>

    <!-- SECTION 3: BLANK LINE -->
    <g transform="translate(50, 320)">
        <rect width="700" height="42" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
        <text x="350" y="26" font-family="monospace" font-size="13" font-weight="800" fill="#dc2626" text-anchor="middle">
 (CRLF: Baris Kosong Pemisah Mutlak Headers &amp; Body)</text>
    </g>

    <!-- SECTION 4: ENTITY BODY -->
    <g transform="translate(50, 380)">
        <rect width="700" height="85" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)"/>
        <rect x="15" y="15" width="130" height="35" rx="6" fill="#d97706"/>
        <text x="80" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">Entity Body</text>

        <text x="165" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#92400e">Kosong pada metode GET.</text>
        <text x="165" y="58" font-family="system-ui, sans-serif" font-size="12" fill="#b45309">Berisi data form / JSON payload pada metode POST, PUT.</text>
    </g>
</svg>