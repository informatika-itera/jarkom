<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

    <!-- ACTIVE MODE (LEFT) -->
    <g transform="translate(40, 30)">
        <rect width="420" height="480" rx="14" fill="#fff" stroke="#fca5a5" stroke-width="2" filter="url(#shadow)"/>
        <rect x="30" y="16" width="360" height="38" rx="8" fill="#fef2f2" stroke="#ef4444"/>
        <text x="210" y="41" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#991b1b" text-anchor="middle">Active Mode (PORT)</text>

        <!-- Client & Firewall & Server -->
        <text x="70" y="95" font-size="30" text-anchor="middle">💻</text>
        <text x="70" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>

        <!-- Firewall Wall -->
        <rect x="150" y="80" width="18" height="260" rx="4" fill="#f87171" stroke="#dc2626"/>
        <text x="159" y="215" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" transform="rotate(-90, 159, 215)" text-anchor="middle">FIREWALL</text>

        <text x="350" y="95" font-size="30" text-anchor="middle">🏢</text>
        <text x="350" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Server</text>

        <!-- Step 1: PORT -->
        <path d="M 70 145 L 350 145" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
        <text x="210" y="138" font-family="monospace" font-size="11.5" font-weight="700" fill="#2563eb" text-anchor="middle">PORT 1045</text>

        <!-- Step 2: Server to Client (BLOCKED!) -->
        <path d="M 350 225 L 175 225" stroke="#dc2626" stroke-width="4" marker-end="url(#arrR)"/>
        <circle cx="159" cy="225" r="15" fill="#dc2626"/>
        <text x="159" y="230" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">✕</text>

        <text x="260" y="212" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">Inbound Connection</text>
        <text x="260" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#b91c1c" text-anchor="middle">BLOCKED!</text>

        <!-- Verdict Banner -->
        <rect x="30" y="380" width="360" height="65" rx="8" fill="#fee2e2" stroke="#ef4444"/>
        <text x="210" y="410" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#991b1b" text-anchor="middle">GAGAL: Firewall Tolak Koneksi Masuk</text>
        <text x="210" y="430" font-family="system-ui, sans-serif" font-size="11.5" fill="#7f1d1d" text-anchor="middle">Tidak cocok untuk jaringan Wi-Fi modern.</text>
    </g>

    <!-- PASSIVE MODE (RIGHT) -->
    <g transform="translate(500, 30)">
        <rect width="420" height="480" rx="14" fill="#fff" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
        <rect x="30" y="16" width="360" height="38" rx="8" fill="#f0fdf4" stroke="#16a34a"/>
        <text x="210" y="41" font-family="system-ui, sans-serif" font-size="17" font-weight="800" fill="#166534" text-anchor="middle">Passive Mode (PASV)</text>

        <!-- Client & Firewall & Server -->
        <text x="70" y="95" font-size="30" text-anchor="middle">💻</text>
        <text x="70" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Client</text>

        <!-- Firewall Wall -->
        <rect x="150" y="80" width="18" height="260" rx="4" fill="#86efac" stroke="#16a34a"/>
        <text x="159" y="215" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#166534" transform="rotate(-90, 159, 215)" text-anchor="middle">FIREWALL</text>

        <text x="350" y="95" font-size="30" text-anchor="middle">🏢</text>
        <text x="350" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Server</text>

        <!-- Step 1: PASV -->
        <path d="M 70 145 L 350 145" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
        <text x="210" y="138" font-family="monospace" font-size="11.5" font-weight="700" fill="#2563eb" text-anchor="middle">PASV &rarr; Buka Port P</text>

        <!-- Step 2: Client to Server (ALLOWED!) -->
        <path d="M 70 225 L 350 225" stroke="#16a34a" stroke-width="4" marker-end="url(#arrG)"/>
        <circle cx="159" cy="225" r="15" fill="#16a34a"/>
        <text x="159" y="230" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">✓</text>

        <text x="260" y="212" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#16a34a" text-anchor="middle">Outbound Connection</text>
        <text x="260" y="250" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#15803d" text-anchor="middle">ALLOWED!</text>

        <!-- Verdict Banner -->
        <rect x="30" y="380" width="360" height="65" rx="8" fill="#dcfce7" stroke="#16a34a"/>
        <text x="210" y="410" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">SUKSES: Firewall Izinkan Koneksi Keluar</text>
        <text x="210" y="430" font-family="system-ui, sans-serif" font-size="11.5" fill="#14532d" text-anchor="middle">Standar koneksi seluruh software FTP masa kini.</text>
    </g>
</svg>