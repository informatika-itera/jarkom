<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="800" height="500" rx="16" fill="#ffffff" stroke="#86efac" stroke-width="2"/>

    <!-- TITLE -->
    <rect x="200" y="20" width="400" height="40" rx="20" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="400" y="45" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#166534" text-anchor="middle">✅ Iterated Query (Standar Internet)</text>

    <!-- ENTITIES -->
    <!-- Client -->
    <g transform="translate(40, 100)">
        <rect width="110" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
        <text x="55" y="38" font-size="28" text-anchor="middle">💻</text>
        <text x="55" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">Client</text>
    </g>

    <!-- Local DNS (Center) -->
    <g transform="translate(40, 260)">
        <rect width="130" height="110" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5" filter="url(#shadow)"/>
        <text x="65" y="35" font-size="28" text-anchor="middle">🏢</text>
        <text x="65" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#6b21a8" text-anchor="middle">Local DNS</text>
        <text x="65" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle">[Pencari Aktif]</text>
    </g>

    <!-- Target Servers on Right -->
    <!-- Root -->
    <g transform="translate(540, 90)">
        <rect width="200" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
        <text x="100" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#92400e" text-anchor="middle">Root DNS (.)</text>
        <text x="100" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#b45309" text-anchor="middle">Rujuk ke TLD</text>
    </g>

    <!-- TLD -->
    <g transform="translate(540, 210)">
        <rect width="200" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
        <text x="100" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e40af" text-anchor="middle">TLD .edu</text>
        <text x="100" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#2563eb" text-anchor="middle">Rujuk ke Authoritative</text>
    </g>

    <!-- Authoritative -->
    <g transform="translate(540, 330)">
        <rect width="200" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="100" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#166534" text-anchor="middle">Authoritative nyu.edu</text>
        <text x="100" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle">Punya IP Asli!</text>
    </g>

    <!-- ARROWS -->
    <!-- 1 & 8: Client <-> Local -->
    <line x1="85" y1="180" x2="85" y2="260" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
    <text x="70" y="225" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#2563eb">1</text>
    <line x1="105" y1="260" x2="105" y2="180" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
    <text x="115" y="225" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#16a34a">8</text>

    <!-- 2 & 3: Local <-> Root -->
    <line x1="170" y1="280" x2="540" y2="125" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
    <text x="340" y="190" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#2563eb">2</text>
    <line x1="540" y1="140" x2="170" y2="295" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrO)"/>
    <text x="360" y="225" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f59e0b">3</text>

    <!-- 4 & 5: Local <-> TLD -->
    <line x1="170" y1="310" x2="540" y2="235" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
    <text x="340" y="265" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#2563eb">4</text>
    <line x1="540" y1="250" x2="170" y2="325" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrO)"/>
    <text x="360" y="298" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#f59e0b">5</text>

    <!-- 6 & 7: Local <-> Auth -->
    <line x1="170" y1="340" x2="540" y2="355" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
    <text x="340" y="340" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#2563eb">6</text>
    <line x1="540" y1="370" x2="170" y2="355" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
    <text x="360" y="375" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#16a34a">7</text>

    <!-- FOOTER -->
    <rect x="80" y="440" width="640" height="34" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="400" y="462" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">💡 Local DNS yang melakukan seluruh pencarian aktif. Server Akar tetap ringan!</text>
</svg>