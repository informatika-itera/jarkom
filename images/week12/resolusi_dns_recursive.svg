<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
    
    <defs>
        <marker id="arrB" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
            <path d="M0,0 L0,6 L8,3 z" fill="#9333ea"/>
        </marker>
        <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
            <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="800" height="500" rx="16" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>

    <!-- TITLE -->
    <rect x="200" y="20" width="400" height="40" rx="20" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="400" y="45" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#991b1b" text-anchor="middle">⚠️ Recursive Query (Beban Berat di Server Puncak)</text>

    <!-- ENTITIES -->
    <!-- Client -->
    <g transform="translate(40, 100)">
        <rect width="110" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
        <text x="55" y="38" font-size="28" text-anchor="middle">💻</text>
        <text x="55" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">Client</text>
    </g>

    <!-- Local DNS -->
    <g transform="translate(40, 260)">
        <rect width="120" height="90" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
        <text x="60" y="35" font-size="26" text-anchor="middle">🏢</text>
        <text x="60" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#6b21a8" text-anchor="middle">Local DNS</text>
    </g>

    <!-- Root DNS (Under heavy load) -->
    <g transform="translate(240, 240)">
        <rect width="140" height="110" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2.5" filter="url(#shadow)"/>
        <text x="70" y="35" font-size="26" text-anchor="middle">🔥</text>
        <text x="70" y="65" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#dc2626" text-anchor="middle">Root DNS</text>
        <text x="70" y="85" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">Beban Rantai!</text>
    </g>

    <!-- TLD -->
    <g transform="translate(440, 250)">
        <rect width="130" height="90" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
        <text x="65" y="35" font-size="26" text-anchor="middle">🏢</text>
        <text x="65" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">TLD .edu</text>
    </g>

    <!-- Authoritative -->
    <g transform="translate(620, 250)">
        <rect width="140" height="90" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="70" y="35" font-size="26" text-anchor="middle">🏢</text>
        <text x="70" y="65" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">Authoritative</text>
    </g>

    <!-- CHAINED ARROWS -->
    <!-- 1 & 8: Client <-> Local -->
    <line x1="85" y1="180" x2="85" y2="260" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
    <text x="70" y="225" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#2563eb">1</text>
    <line x1="105" y1="260" x2="105" y2="180" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
    <text x="115" y="225" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#16a34a">8</text>

    <!-- 2 & 7: Local <-> Root -->
    <line x1="160" y1="285" x2="240" y2="285" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
    <text x="200" y="275" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#2563eb">2</text>
    <line x1="240" y1="315" x2="160" y2="315" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
    <text x="200" y="335" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#16a34a">7</text>

    <!-- 3 & 6: Root <-> TLD -->
    <line x1="380" y1="285" x2="440" y2="285" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
    <text x="410" y="275" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#2563eb">3</text>
    <line x1="440" y1="315" x2="380" y2="315" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
    <text x="410" y="335" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#16a34a">6</text>

    <!-- 4 & 5: TLD <-> Auth -->
    <line x1="570" y1="285" x2="620" y2="285" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>
    <text x="595" y="275" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#2563eb">4</text>
    <line x1="620" y1="315" x2="570" y2="315" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>
    <text x="595" y="335" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#16a34a">5</text>

    <!-- FOOTER -->
    <rect x="80" y="440" width="640" height="34" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="400" y="462" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#dc2626" text-anchor="middle">❌ Ditolak di Internet: Setiap level server harus menanggung antrean kueri berantai!</text>
</svg>