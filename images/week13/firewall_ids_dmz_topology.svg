<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/>
        </marker>
        <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#475569"/>
        </marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="44" rx="10" fill="#0f172a"/>
    <text x="480" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">ARSITEKTUR PERTAHANAN PERIMETER: FIREWALL, IDS/IPS &amp; ZONA DMZ</text>

    <!-- TOP: 3-ZONE NETWORK TOPOLOGY -->
    <g transform="translate(24, 74)">
        <rect width="912" height="236" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.6" filter="url(#sh)"/>
        <text x="456" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#1e3a8a" text-anchor="middle">Topologi Tiga Zona Keamanan (Defense-in-Depth + Demilitarized Zone)</text>

        <!-- Zone 1: Internet -->
        <rect x="20" y="46" width="142" height="170" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
        <text x="91" y="72" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#991b1b" text-anchor="middle">Internet Publik</text>
        <text x="91" y="90" font-family="system-ui, sans-serif" font-size="10.5" fill="#dc2626" text-anchor="middle">(Untrusted Zone)</text>
        <rect x="34" y="108" width="114" height="44" rx="6" fill="#ffffff" stroke="#fca5a5"/>
        <text x="91" y="127" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Pengguna HTTPS Sah</text>
        <text x="91" y="143" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">+ Penyerang / Bot</text>
        <text x="91" y="182" font-family="monospace" font-size="9.5" fill="#7f1d1d" text-anchor="middle">Any IP -&gt; Filter Ketat</text>

        <line x1="162" y1="130" x2="196" y2="130" stroke="#dc2626" stroke-width="3" marker-end="url(#arrR)"/>

        <!-- External Stateful Firewall -->
        <rect x="202" y="46" width="124" height="170" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
        <text x="264" y="72" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#9a3412" text-anchor="middle">External Firewall</text>
        <text x="264" y="90" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ea580c" text-anchor="middle">(Stateful + SYN Proxy)</text>
        <rect x="212" y="104" width="104" height="96" rx="6" fill="#ffffff" stroke="#fdba74"/>
        <text x="264" y="122" font-family="monospace" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">ALLOW 443 -&gt; DMZ</text>
        <text x="264" y="140" font-family="monospace" font-size="9.5" font-weight="700" fill="#166534" text-anchor="middle">ALLOW 53  -&gt; DMZ</text>
        <text x="264" y="158" font-family="monospace" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">DENY ALL  -&gt; LAN</text>
        <text x="264" y="176" font-family="monospace" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">DENY 22/23 IN</text>

        <line x1="326" y1="130" x2="360" y2="130" stroke="#2563eb" stroke-width="3" marker-end="url(#arrB)"/>

        <!-- Zone 2: DMZ -->
        <rect x="366" y="46" width="188" height="170" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
        <text x="460" y="70" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">ZONA DMZ (Semi-Trusted)</text>
        <text x="460" y="86" font-family="monospace" font-size="10" fill="#2563eb" text-anchor="middle">172.16.10.0/24</text>
        <rect x="382" y="98" width="156" height="32" rx="6" fill="#ffffff" stroke="#93c5fd"/>
        <text x="460" y="118" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Web Server (HTTPS :443)</text>
        <rect x="382" y="136" width="156" height="32" rx="6" fill="#ffffff" stroke="#93c5fd"/>
        <text x="460" y="156" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Mail &amp; DNS Public Server</text>
        <text x="460" y="196" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#1d4ed8" text-anchor="middle">Kompromi terisolasi dari LAN inti</text>

        <line x1="554" y1="130" x2="588" y2="130" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrP)"/>

        <!-- Internal Firewall + IPS (DPI) -->
        <rect x="594" y="46" width="136" height="170" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
        <text x="662" y="72" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#5b21b6" text-anchor="middle">Internal FW + IPS</text>
        <text x="662" y="90" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle">(Deep Packet Insp.)</text>
        <rect x="604" y="104" width="116" height="96" rx="6" fill="#ffffff" stroke="#c4b5fd"/>
        <text x="662" y="122" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#5b21b6" text-anchor="middle">Inspeksi Payload L7</text>
        <text x="662" y="140" font-family="system-ui, sans-serif" font-size="9.5" fill="#dc2626" text-anchor="middle">Blokir SQLi / XSS</text>
        <text x="662" y="158" font-family="system-ui, sans-serif" font-size="9.5" fill="#dc2626" text-anchor="middle">Blokir Malware / C2</text>
        <text x="662" y="176" font-family="monospace" font-size="9.5" fill="#166534" text-anchor="middle">ONLY DMZ-&gt;DB 5432</text>

        <line x1="730" y1="130" x2="758" y2="130" stroke="#16a34a" stroke-width="3" marker-end="url(#arrG)"/>

        <!-- Zone 3: Internal LAN -->
        <rect x="764" y="46" width="130" height="170" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="829" y="70" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#166534" text-anchor="middle">Internal LAN</text>
        <text x="829" y="86" font-family="system-ui, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">(Trusted Zone)</text>
        <rect x="774" y="100" width="110" height="44" rx="6" fill="#ffffff" stroke="#86efac"/>
        <text x="829" y="119" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">Database Kritis</text>
        <text x="829" y="135" font-family="monospace" font-size="9.5" fill="#15803d" text-anchor="middle">10.10.20.0/24</text>
        <rect x="774" y="152" width="110" height="44" rx="6" fill="#ffffff" stroke="#86efac"/>
        <text x="829" y="171" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#14532d" text-anchor="middle">Host Staff/Dosen</text>
        <text x="829" y="187" font-family="system-ui, sans-serif" font-size="9.5" fill="#16a34a" text-anchor="middle">Akses Outbound VPN</text>
    </g>

    <!-- BOTTOM: STATELESS vs STATEFUL vs IDS/IPS COMPARISON CARDS -->
    <g transform="translate(24, 324)">
        <!-- Card 1: Stateless -->
        <rect x="0" y="0" width="292" height="196" rx="12" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.6" filter="url(#sh)"/>
        <rect x="14" y="12" width="264" height="26" rx="6" fill="#d97706"/>
        <text x="146" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Stateless Packet Filter (ACL)</text>
        <text x="20" y="60" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#92400e">• Cek 5-Tuple Header L3/L4 Saja:</text>
        <text x="28" y="78" font-family="monospace" font-size="10" fill="#475569">SrcIP, DstIP, Proto, Port, ACK bit</text>
        <text x="20" y="102" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#166534">• Keunggulan:</text>
        <text x="28" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Wire-speed (hardware TCAM router).</text>
        <text x="20" y="144" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">• Kelemahan Kritis:</text>
        <text x="28" y="162" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Buta konteks sesi; loloskan paket ACK</text>
        <text x="28" y="177" font-family="system-ui, sans-serif" font-size="10" fill="#334155">palsu (ACK port scanning).</text>

        <!-- Card 2: Stateful -->
        <rect x="310" y="0" width="292" height="196" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6" filter="url(#sh)"/>
        <rect x="324" y="12" width="264" height="26" rx="6" fill="#2563eb"/>
        <text x="456" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Stateful Inspection Firewall</text>
        <text x="330" y="60" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1e40af">• Catat State Koneksi TCP:</text>
        <text x="338" y="78" font-family="monospace" font-size="10" fill="#475569">[LAN:51234 &lt;-&gt; Web:443 | ESTAB]</text>
        <text x="330" y="102" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#166534">• Keunggulan:</text>
        <text x="338" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Otomatis tolak paket ACK nyasar tanpa</text>
        <text x="338" y="135" font-family="system-ui, sans-serif" font-size="10" fill="#334155">proses 3-Way Handshake yang sah.</text>
        <text x="330" y="158" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#d97706">• Batasan:</text>
        <text x="338" y="176" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Belum membaca payload berbahaya L7.</text>

        <!-- Card 3: IDS/IPS -->
        <rect x="620" y="0" width="292" height="196" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6" filter="url(#sh)"/>
        <rect x="634" y="12" width="264" height="26" rx="6" fill="#7c3aed"/>
        <text x="766" y="29" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">IDS vs IPS (Deep Packet Inspection)</text>
        <text x="640" y="60" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#5b21b6">• Inspeksi Payload L7 (Signature/ML):</text>
        <text x="648" y="78" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Deteksi worm, buffer overflow, SQLi.</text>
        <text x="640" y="102" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0284c7">• IDS (Detection — Pasif Out-of-Band):</text>
        <text x="648" y="120" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Via Port Mirror/SPAN; picu alert SIEM.</text>
        <text x="640" y="144" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#7c3aed">• IPS (Prevention — Aktif Inline):</text>
        <text x="648" y="162" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Langsung DROP paket atau RESET TCP</text>
        <text x="648" y="177" font-family="system-ui, sans-serif" font-size="10" fill="#334155">jika pola serangan terdeteksi.</text>
    </g>
</svg>
