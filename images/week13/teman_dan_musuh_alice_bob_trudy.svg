<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="aliceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="bobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="trudyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef2f2"/>
      <stop offset="100%" stop-color="#fee2e2"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>

    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title-main { font-weight: 800; font-size: 15.5px; fill: #ffffff; letter-spacing: 0.3px; }
      .title-sub { font-weight: 500; font-size: 11px; fill: #94a3b8; }
      .box-title { font-weight: 800; font-size: 13.5px; }
      .box-role { font-weight: 700; font-size: 10px; }
      .item-bold { font-weight: 700; font-size: 9.5px; fill: #1e293b; }
      .desc-text { font-weight: 500; font-size: 9px; fill: #475569; }
      .badge-text { font-weight: 700; font-size: 9.5px; text-anchor: middle; fill: #ffffff; }
      .threat-title { font-weight: 800; font-size: 10.5px; fill: #991b1b; }
      .threat-desc { font-weight: 500; font-size: 9.2px; fill: #7f1d1d; }
      @keyframes dashAnim { to { stroke-dashoffset: -20; } }
      .channel-dash { stroke-dasharray: 6, 4; animation: dashAnim 1.2s linear infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="540" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(30, 14)">
    <rect width="900" height="48" rx="8" fill="url(#headerGrad)" filter="url(#cardShadow)"/>
    <!-- Users and Alert Icon -->
    <g transform="translate(18, 11)">
      <circle cx="10" cy="13" r="6" fill="#10b981"/>
      <circle cx="28" cy="13" r="6" fill="#3b82f6"/>
      <path d="M19 2 L26 14 H12 Z" fill="#ef4444"/>
      <circle cx="19" cy="11" r="1" fill="#fff"/>
      <rect x="18.2" y="6" width="1.6" height="3" fill="#fff"/>
    </g>
    <text x="56" y="21" class="title-main">MODEL KEAMANAN KOMUNIKASI: ALICE, BOB, &amp; TRUDY</text>
    <text x="56" y="36" class="title-sub">Peran Entitas, Saluran Transmisi Terbuka, dan 4 Vektor Ancaman Intruder (Kurose &amp; Ross)</text>
    <!-- Right Badge -->
    <rect x="765" y="11" width="118" height="26" rx="13" fill="#374151" stroke="#4b5563" stroke-width="1"/>
    <circle cx="780" cy="24" r="4.5" fill="#f87171"/>
    <text x="792" y="28" font-size="10.5" font-weight="700" fill="#f3f4f6">Threat Model</text>
  </g>

  <!-- ==================== MIDDLE SECTION: ALICE, CHANNEL, TRUDY, BOB ==================== -->

  <!-- 1. ALICE (SENDER) -->
  <g transform="translate(30, 72)">
    <rect width="180" height="268" rx="10" fill="url(#aliceGrad)" stroke="#86efac" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Avatar -->
    <circle cx="90" cy="40" r="22" fill="#16a34a"/>
    <circle cx="90" cy="35" r="8" fill="#ffffff"/>
    <path d="M76 52 C76 45 104 45 104 52" fill="#ffffff"/>
    
    <!-- Title and Role -->
    <text x="90" y="80" class="box-title" fill="#14532d" text-anchor="middle">Alice</text>
    <rect x="35" y="87" width="110" height="18" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="0.8"/>
    <text x="90" y="100" class="box-role" fill="#15803d" text-anchor="middle">Sender (Pengirim Sah)</text>

    <!-- Properties List - PROPERLY SEPARATED GROUPS -->
    <g transform="translate(14, 114)">
      <!-- Item 1: Karakteristik -->
      <g transform="translate(0, 0)">
        <rect width="152" height="48" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
        <text x="8" y="16" class="item-bold">Karakteristik Transmisi:</text>
        <text x="8" y="31" class="desc-text">• Mengirim Plaintext (m)</text>
        <text x="8" y="42" class="desc-text">• Melalui saluran publik</text>
      </g>

      <!-- Item 2: Kebutuhan Keamanan -->
      <g transform="translate(0, 56)">
        <rect width="152" height="48" rx="5" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
        <text x="8" y="16" class="item-bold">Kebutuhan Keamanan:</text>
        <text x="8" y="31" class="desc-text">• Kerahasiaan (Confidentiality)</text>
        <text x="8" y="42" class="desc-text">• Integritas Pesan</text>
      </g>
    </g>

    <!-- Pill Status -->
    <rect x="25" y="232" width="130" height="20" rx="4" fill="#16a34a"/>
    <text x="90" y="246" class="badge-text">Entitas Sah (Legitimate)</text>
  </g>

  <!-- 2. UNSECURED CHANNEL AND TRUDY (CENTER) -->
  <g transform="translate(225, 72)">
    <rect width="510" height="268" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Top Channel Pipeline -->
    <rect x="15" y="10" width="480" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="255" y="22" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">
      SALURAN TRANSMISI PUBLIK (INTERNET / JARINGAN NIRKABEL)
    </text>
    <!-- Transmission Line Alice -> Bob -->
    <line x1="25" y1="31" x2="485" y2="31" stroke="#059669" stroke-width="2.5" class="channel-dash"/>
    <!-- Packet moving -->
    <rect x="195" y="23" width="120" height="15" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
    <text x="255" y="34" font-size="8.5" font-weight="800" fill="#15803d" text-anchor="middle">Paket Data: Plaintext m</text>

    <!-- TRUDY INTRUDER BOX -->
    <g transform="translate(15, 52)">
      <rect width="480" height="162" rx="8" fill="url(#trudyGrad)" stroke="#fca5a5" stroke-width="1.5"/>
      
      <!-- Threat Header -->
      <g transform="translate(14, 10)">
        <circle cx="16" cy="16" r="16" fill="#dc2626"/>
        <!-- Mask / Intruder Icon -->
        <path d="M8 14 C8 10 24 10 24 14 C24 19 8 19 8 14 Z" fill="#ffffff"/>
        <circle cx="12" cy="14" r="1.5" fill="#dc2626"/>
        <circle cx="20" cy="14" r="1.5" fill="#dc2626"/>
        <text x="40" y="15" class="box-title" fill="#991b1b">Trudy (The Intruder / Adversary)</text>
        <text x="40" y="28" font-size="9.5" font-weight="600" fill="#b91c1c">Penyusup yang Mencegat, Memanipulasi, dan Memalsukan Paket</text>
      </g>

      <!-- 4 Threat Vectors Grid (2x2) -->
      <!-- 1. Eavesdrop -->
      <g transform="translate(12, 46)">
        <rect width="222" height="49" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
        <circle cx="18" cy="19" r="10" fill="#fee2e2"/>
        <text x="18" y="23" font-size="11" text-anchor="middle">👁️</text>
        <text x="34" y="17" class="threat-title">1. Eavesdrop / Sniffing</text>
        <text x="34" y="30" class="threat-desc">Menyadap dan membaca isi data rahasia</text>
        <text x="34" y="42" font-size="8.8" font-weight="700" fill="#dc2626">Dampak: Pelanggaran Kerahasiaan</text>
      </g>

      <!-- 2. Modification -->
      <g transform="translate(246, 46)">
        <rect width="222" height="49" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
        <circle cx="18" cy="19" r="10" fill="#fee2e2"/>
        <text x="18" y="23" font-size="11" text-anchor="middle">✏️</text>
        <text x="34" y="17" class="threat-title">2. Modification / Tampering</text>
        <text x="34" y="30" class="threat-desc">Mengubah atau merusak muatan isi pesan</text>
        <text x="34" y="42" font-size="8.8" font-weight="700" fill="#dc2626">Dampak: Kerusakan Integritas Data</text>
      </g>

      <!-- 3. Impersonation -->
      <g transform="translate(12, 101)">
        <rect width="222" height="49" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
        <circle cx="18" cy="19" r="10" fill="#fee2e2"/>
        <text x="18" y="23" font-size="11" text-anchor="middle">🎭</text>
        <text x="34" y="17" class="threat-title">3. Impersonation / Spoofing</text>
        <text x="34" y="30" class="threat-desc">Memalsukan IP sumber (IP Spoofing)</text>
        <text x="34" y="42" font-size="8.8" font-weight="700" fill="#dc2626">Dampak: Pemalsuan Identitas Pengirim</text>
      </g>

      <!-- 4. Hijacking -->
      <g transform="translate(246, 101)">
        <rect width="222" height="49" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1"/>
        <circle cx="18" cy="19" r="10" fill="#fee2e2"/>
        <text x="18" y="23" font-size="11" text-anchor="middle">⚡</text>
        <text x="34" y="17" class="threat-title">4. Hijacking / Man-in-the-Middle</text>
        <text x="34" y="30" class="threat-desc">Membajak sesi aktif dan menyuntik paket</text>
        <text x="34" y="42" font-size="8.8" font-weight="700" fill="#dc2626">Dampak: Pengambilalihan Komunikasi</text>
      </g>
    </g>

    <!-- Threat Manifestations Pill -->
    <g transform="translate(15, 226)">
      <rect width="480" height="28" rx="6" fill="#fff1f2" stroke="#fda4af" stroke-width="1"/>
      <text x="12" y="18" font-size="9.5" font-weight="800" fill="#9f1239">Posisi Nyata Trudy di Jaringan:</text>
      <text x="175" y="18" font-size="9" font-weight="600" fill="#be123c">
        • Rogue Router   • WiFi Sniffer (Promiscuous)   • Rogue DNS Server
      </text>
    </g>
  </g>

  <!-- 3. BOB (RECEIVER) -->
  <g transform="translate(750, 72)">
    <rect width="180" height="268" rx="10" fill="url(#bobGrad)" stroke="#93c5fd" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Avatar -->
    <circle cx="90" cy="40" r="22" fill="#2563eb"/>
    <circle cx="90" cy="35" r="8" fill="#ffffff"/>
    <path d="M76 52 C76 45 104 45 104 52" fill="#ffffff"/>
    
    <!-- Title and Role -->
    <text x="90" y="80" class="box-title" fill="#1e3a8a" text-anchor="middle">Bob</text>
    <rect x="35" y="87" width="110" height="18" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="0.8"/>
    <text x="90" y="100" class="box-role" fill="#1d4ed8" text-anchor="middle">Receiver (Penerima Sah)</text>

    <!-- Properties List - PROPERLY SEPARATED GROUPS -->
    <g transform="translate(14, 114)">
      <!-- Item 1: Tugas Penerima -->
      <g transform="translate(0, 0)">
        <rect width="152" height="48" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="8" y="16" class="item-bold">Tugas Penerima:</text>
        <text x="8" y="31" class="desc-text">• Membaca &amp; Memproses Pesan</text>
        <text x="8" y="42" class="desc-text">• Verifikasi integritas data</text>
      </g>

      <!-- Item 2: Kebutuhan Validasi -->
      <g transform="translate(0, 56)">
        <rect width="152" height="48" rx="5" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
        <text x="8" y="16" class="item-bold">Kebutuhan Validasi:</text>
        <text x="8" y="31" class="desc-text">• Bukti Otentikasi Pengirim</text>
        <text x="8" y="42" class="desc-text">• Menolak impersonasi Trudy</text>
      </g>
    </g>

    <!-- Pill Status -->
    <rect x="25" y="232" width="130" height="20" rx="4" fill="#2563eb"/>
    <text x="90" y="246" class="badge-text">Entitas Sah (Legitimate)</text>
  </g>

  <!-- ==================== BOTTOM BAR: SECURITY OBJECTIVES ==================== -->
  <g transform="translate(30, 356)">
    <rect width="900" height="168" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#cardShadow)"/>
    
    <text x="18" y="20" font-size="11" font-weight="800" fill="#334155" letter-spacing="0.3px">
      SOLUSI KEAMANAN: BAGAIMANA ALICE &amp; BOB MEMPERTAHANKAN KOMUNIKASI DARI TRUDY?
    </text>

    <!-- 3 Defense Solution Cards -->
    <!-- Solution 1: Confidentiality -->
    <g transform="translate(18, 30)">
      <rect width="276" height="122" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
      <rect x="10" y="9" width="84" height="19" rx="4" fill="#dcfce7"/>
      <text x="52" y="22.5" font-size="9.5" font-weight="800" fill="#15803d" text-anchor="middle">Kerahasiaan</text>
      <text x="100" y="23" font-size="11" font-weight="800" fill="#166534">Enkripsi (Encryption)</text>
      
      <text x="10" y="47" font-size="10" font-weight="700" fill="#1e293b">• Solusi:</text>
      <text x="56" y="47" font-size="9.5" font-weight="500" fill="#475569">Enkripsi Simetris (AES) / Asimetris</text>
      
      <text x="10" y="67" font-size="10" font-weight="700" fill="#1e293b">• Mitigasi:</text>
      <text x="64" y="67" font-size="9.5" font-weight="500" fill="#475569">Mencegah aksi <tspan font-weight="700" fill="#dc2626">Eavesdrop / Sniffing</tspan></text>
      
      <text x="10" y="87" font-size="9.5" font-weight="500" fill="#64748b">• Hasil:</text>
      <text x="50" y="87" font-size="9.5" font-weight="600" fill="#047857">Trudy hanya menyadap Ciphertext acak</text>
      
      <text x="10" y="107" font-size="9" font-weight="600" fill="#15803d">✔ Tujuan: Kerahasiaan (Confidentiality)</text>
    </g>

    <!-- Solution 2: Integrity and Authenticity -->
    <g transform="translate(312, 30)">
      <rect width="276" height="122" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
      <rect x="10" y="9" width="94" height="19" rx="4" fill="#dbeafe"/>
      <text x="57" y="22.5" font-size="9.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Integritas Data</text>
      <text x="110" y="23" font-size="11" font-weight="800" fill="#1e40af">Hash &amp; Digital Sign</text>
      
      <text x="10" y="47" font-size="10" font-weight="700" fill="#1e293b">• Solusi:</text>
      <text x="56" y="47" font-size="9.5" font-weight="500" fill="#475569">Fungsi Hash SHA-256 + Kunci Privat</text>
      
      <text x="10" y="67" font-size="10" font-weight="700" fill="#1e293b">• Mitigasi:</text>
      <text x="64" y="67" font-size="9.5" font-weight="500" fill="#475569">Mencegah aksi <tspan font-weight="700" fill="#dc2626">Tampering / Modifikasi</tspan></text>
      
      <text x="10" y="87" font-size="9.5" font-weight="500" fill="#64748b">• Hasil:</text>
      <text x="50" y="87" font-size="9.5" font-weight="600" fill="#1d4ed8">Perubahan 1 bit otomatis tertolak</text>
      
      <text x="10" y="107" font-size="9" font-weight="600" fill="#1e40af">✔ Tujuan: Keutuhan Data (Message Integrity)</text>
    </g>

    <!-- Solution 3: Authentication and Anti-Replay -->
    <g transform="translate(606, 30)">
      <rect width="276" height="122" rx="8" fill="#ffffff" stroke="#c084fc" stroke-width="1.2"/>
      <rect x="10" y="9" width="88" height="19" rx="4" fill="#f3e8ff"/>
      <text x="54" y="22.5" font-size="9.5" font-weight="800" fill="#6b21a8" text-anchor="middle">Otentikasi</text>
      <text x="104" y="23" font-size="11" font-weight="800" fill="#581c87">Nonce (R) &amp; CA Trust</text>
      
      <text x="10" y="47" font-size="10" font-weight="700" fill="#1e293b">• Solusi:</text>
      <text x="56" y="47" font-size="9.5" font-weight="500" fill="#475569">Tantangan Nonce acak + Sertifikat X.509</text>
      
      <text x="10" y="67" font-size="10" font-weight="700" fill="#1e293b">• Mitigasi:</text>
      <text x="64" y="67" font-size="9.5" font-weight="500" fill="#475569">Mencegah <tspan font-weight="700" fill="#dc2626">Spoofing &amp; Replay Attack</tspan></text>
      
      <text x="10" y="87" font-size="9.5" font-weight="500" fill="#64748b">• Hasil:</text>
      <text x="50" y="87" font-size="9.5" font-weight="600" fill="#6d28d9">Identitas pengirim terverifikasi valid</text>
      
      <text x="10" y="107" font-size="9" font-weight="600" fill="#6b21a8">✔ Tujuan: Keaslian (Authentication)</text>
    </g>
  </g>
</svg>