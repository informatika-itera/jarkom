<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#16a34a"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrP" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .title-text { font-weight: 800; font-size: 16px; fill: #ffffff; letter-spacing: 0.3px; }
      .subtitle-text { font-weight: 500; font-size: 11.5px; fill: #94a3b8; }
      .card-title { font-weight: 800; font-size: 13.5px; }
      .card-subtitle { font-weight: 600; font-size: 10.5px; }
      .badge-text { font-weight: 700; font-size: 9.5px; text-anchor: middle; }
      .item-bold { font-weight: 700; font-size: 10.5px; fill: #1e293b; }
      .item-sub { font-weight: 500; font-size: 10px; fill: #64748b; }
      .pill-text { font-weight: 700; font-size: 9.5px; text-anchor: middle; fill: #ffffff; }
      @keyframes dashMove { to { stroke-dashoffset: -20; } }
      .flow-dash { stroke-dasharray: 5, 5; animation: dashMove 1.2s linear infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="560" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- ==================== HEADER BAR ==================== -->
  <g transform="translate(30, 16)">
    <rect width="900" height="52" rx="10" fill="url(#headerGrad)" filter="url(#boxShadow)"/>
    <!-- Shield Icon -->
    <g transform="translate(18, 10)">
      <path d="M16 2 L4 7 V16 C4 24 9 31 16 33 C23 31 28 24 28 16 V7 Z" fill="#10b981" opacity="0.3"/>
      <path d="M16 4 L6 8.5 V16 C6 22.5 10.5 28.5 16 30.5 C21.5 28.5 26 22.5 26 16 V8.5 Z" fill="#059669"/>
      <path d="M13 15 V13 C13 11.3 14.3 10 16 10 C17.7 10 19 11.3 19 13 V15" fill="none" stroke="#fff" stroke-width="1.8"/>
      <rect x="12" y="15" width="8" height="7" rx="1.5" fill="#fff"/>
    </g>
    <text x="58" y="24" class="title-text">ARSITEKTUR KEAMANAN JARINGAN (NETWORK SECURITY OVERVIEW)</text>
    <text x="58" y="41" class="subtitle-text">4 Pilar Pertahanan Komprehensif: Kriptografi, Integritas, Perimeter, &amp; Protocol Stack</text>
    <!-- Right Status Badge -->
    <rect x="765" y="13" width="118" height="26" rx="13" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1"/>
    <circle cx="780" cy="26" r="4.5" fill="#38bdf8"/>
    <text x="792" y="30" font-size="10.5" font-weight="700" fill="#e0f2fe">CIA + Defense</text>
  </g>

  <!-- ==================== QUADRANT 1: KRIPTOGRAFI ==================== -->
  <g transform="translate(30, 80)">
    <rect width="435" height="186" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#boxShadow)"/>
    
    <rect x="14" y="12" width="28" height="28" rx="6" fill="#059669"/>
    <!-- Key icon -->
    <circle cx="23" cy="21" r="4" fill="none" stroke="#fff" stroke-width="1.8"/>
    <path d="M26 24 L33 31 M31 29 L33 27" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    
    <text x="50" y="23" class="card-title" fill="#065f46">1. Prinsip Kriptografi (Beyond Secrecy)</text>
    <text x="50" y="37" class="card-subtitle" fill="#047857">Transformasi Ciphertext &amp; Manajemen Kunci</text>

    <!-- Symmetric Box -->
    <g transform="translate(14, 46)">
      <rect width="407" height="49" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <rect x="8" y="7" width="94" height="17" rx="3" fill="#dcfce7"/>
      <text x="55" y="19" class="badge-text" fill="#166534">Kunci Simetris (Kₛ)</text>
      <text x="110" y="19" class="item-bold">Bob &amp; Alice berbagi 1 kunci yang sama</text>
      <text x="10" y="38" class="item-sub">• <tspan font-weight="700" fill="#1e293b">AES-256 / DES:</tspan> Enkripsi massal berkecepatan tinggi (c = Kₛ(m))</text>
    </g>

    <!-- Asymmetric Box -->
    <g transform="translate(14, 101)">
      <rect width="407" height="49" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
      <rect x="8" y="7" width="102" height="17" rx="3" fill="#dcfce7"/>
      <text x="59" y="19" class="badge-text" fill="#166534">Kunci Asimetris (K⁺/K⁻)</text>
      <text x="118" y="19" class="item-bold">Kunci Publik (K⁺) &amp; Kunci Privat (K⁻)</text>
      <text x="10" y="38" class="item-sub">• <tspan font-weight="700" fill="#1e293b">RSA / ECC:</tspan> Solusi distribusi kunci aman &amp; negosiasi awal</text>
    </g>

    <rect x="14" y="158" width="135" height="18" rx="4" fill="#059669"/>
    <text x="81.5" y="170.5" class="pill-text">Pilar: Confidentiality</text>
  </g>

  <!-- ==================== QUADRANT 2: AUTENTIKASI DAN INTEGRITAS ==================== -->
  <g transform="translate(495, 80)">
    <rect width="435" height="186" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#boxShadow)"/>
    
    <rect x="14" y="12" width="28" height="28" rx="6" fill="#2563eb"/>
    <!-- Check Seal icon -->
    <circle cx="28" cy="26" r="7" fill="none" stroke="#fff" stroke-width="1.8"/>
    <path d="M24 26 L27 29 L32 23" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="50" y="23" class="card-title" fill="#1e40af">2. Otentikasi &amp; Integritas Pesan</text>
    <text x="50" y="37" class="card-subtitle" fill="#1d4ed8">Verifikasi Keaslian Pengirim &amp; Keutuhan Data</text>

    <!-- Nonce Box -->
    <g transform="translate(14, 46)">
      <rect width="407" height="32" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <rect x="6" y="6" width="68" height="20" rx="3" fill="#dbeafe"/>
      <text x="40" y="20" class="badge-text" fill="#1e40af">Nonce (R)</text>
      <text x="82" y="19.5" class="item-bold">Mencegah Playback / Replay Attack per sesi</text>
    </g>

    <!-- Hash Box -->
    <g transform="translate(14, 84)">
      <rect width="407" height="32" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <rect x="6" y="6" width="76" height="20" rx="3" fill="#dbeafe"/>
      <text x="44" y="20" class="badge-text" fill="#1e40af">Hash H(m)</text>
      <text x="90" y="19.5" class="item-bold">SHA-256 + K⁻: Menjamin integritas pesan 100%</text>
    </g>

    <!-- CA Box -->
    <g transform="translate(14, 122)">
      <rect width="407" height="28" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1"/>
      <rect x="6" y="4" width="76" height="20" rx="3" fill="#dbeafe"/>
      <text x="44" y="18" class="badge-text" fill="#1e40af">Otoritas CA</text>
      <text x="90" y="17.5" class="item-bold">Sertifikat X.509: Penangkal serangan MITM</text>
    </g>

    <rect x="14" y="158" width="165" height="18" rx="4" fill="#2563eb"/>
    <text x="96.5" y="170.5" class="pill-text">Pilar: Integrity &amp; Authenticity</text>
  </g>

  <!-- ==================== QUADRANT 3: OPERASIONAL FIREWALL DAN IDS ==================== -->
  <g transform="translate(30, 278)">
    <rect width="435" height="186" rx="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5" filter="url(#boxShadow)"/>
    
    <rect x="14" y="12" width="28" height="28" rx="6" fill="#d97706"/>
    <!-- Brick Wall icon -->
    <rect x="20" y="19" width="16" height="14" rx="1.5" fill="none" stroke="#fff" stroke-width="1.8"/>
    <line x1="20" y1="26" x2="36" y2="26" stroke="#fff" stroke-width="1.4"/>
    <line x1="28" y1="19" x2="28" y2="26" stroke="#fff" stroke-width="1.4"/>
    <line x1="24" y1="26" x2="24" y2="33" stroke="#fff" stroke-width="1.4"/>
    <line x1="32" y1="26" x2="32" y2="33" stroke="#fff" stroke-width="1.4"/>
    
    <text x="50" y="23" class="card-title" fill="#92400e">3. Keamanan Operasional: Firewall &amp; IDS</text>
    <text x="50" y="37" class="card-subtitle" fill="#b45309">Isolasi Perimeter Jaringan &amp; Analisis Trafik</text>

    <!-- Stateless Box -->
    <g transform="translate(14, 46)">
      <rect width="407" height="32" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <rect x="6" y="6" width="68" height="20" rx="3" fill="#fef3c7"/>
      <text x="40" y="20" class="badge-text" fill="#92400e">Stateless</text>
      <text x="82" y="19.5" class="item-bold">Filter ACL cepat berbasis Header IP &amp; Port</text>
    </g>

    <!-- Stateful Box -->
    <g transform="translate(14, 84)">
      <rect width="407" height="32" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <rect x="6" y="6" width="68" height="20" rx="3" fill="#fef3c7"/>
      <text x="40" y="20" class="badge-text" fill="#92400e">Stateful</text>
      <text x="82" y="19.5" class="item-bold">Melacak memori status koneksi TCP/UDP aktif</text>
    </g>

    <!-- IDS Box -->
    <g transform="translate(14, 122)">
      <rect width="407" height="28" rx="6" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
      <rect x="6" y="4" width="68" height="20" rx="3" fill="#fef3c7"/>
      <text x="40" y="18" class="badge-text" fill="#92400e">IDS / IPS</text>
      <text x="82" y="17.5" class="item-bold">Inspeksi Payload: Deteksi malware &amp; SQL Injection</text>
    </g>

    <rect x="14" y="158" width="170" height="18" rx="4" fill="#d97706"/>
    <text x="99" y="170.5" class="pill-text">Pilar: Perimeter &amp; Access Control</text>
  </g>

  <!-- ==================== QUADRANT 4: PROTOCOL STACK DEFENSE ==================== -->
  <g transform="translate(495, 278)">
    <rect width="435" height="186" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5" filter="url(#boxShadow)"/>
    
    <rect x="14" y="12" width="28" height="28" rx="6" fill="#7c3aed"/>
    <!-- Stack icon -->
    <path d="M21 21 L28 24 L35 21 M21 25 L28 28 L35 25 M21 29 L28 32 L35 29" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
    
    <text x="50" y="23" class="card-title" fill="#5b21b6">4. Proteksi Berlapis (Protocol Stack)</text>
    <text x="50" y="37" class="card-subtitle" fill="#6d28d9">Defense-in-Depth dari Lapisan Fisik hingga Aplikasi</text>

    <!-- 4 Layers List -->
    <g transform="translate(14, 46)">
      <!-- App -->
      <rect width="407" height="24" rx="5" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
      <rect x="5" y="4" width="65" height="16" rx="3" fill="#f3e8ff"/>
      <text x="37.5" y="15.5" class="badge-text" fill="#6b21a8">Aplikasi</text>
      <text x="78" y="16" class="item-bold">PGP, S/MIME, SSH, DNSSEC (End-to-End)</text>

      <!-- Transport -->
      <g transform="translate(0, 26)">
        <rect width="407" height="24" rx="5" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
        <rect x="5" y="4" width="65" height="16" rx="3" fill="#f3e8ff"/>
        <text x="37.5" y="15.5" class="badge-text" fill="#6b21a8">Transpor</text>
        <text x="78" y="16" class="item-bold">TLS 1.3 / HTTPS 443 (Negosiasi 1-RTT &amp; AES)</text>
      </g>

      <!-- Network -->
      <g transform="translate(0, 52)">
        <rect width="407" height="24" rx="5" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
        <rect x="5" y="4" width="65" height="16" rx="3" fill="#f3e8ff"/>
        <text x="37.5" y="15.5" class="badge-text" fill="#6b21a8">Jaringan</text>
        <text x="78" y="16" class="item-bold">IPsec VPN (ESP Enkripsi, Tunnel Mode, IKE)</text>
      </g>

      <!-- Link -->
      <g transform="translate(0, 78)">
        <rect width="407" height="24" rx="5" fill="#ffffff" stroke="#e9d5ff" stroke-width="1"/>
        <rect x="5" y="4" width="65" height="16" rx="3" fill="#f3e8ff"/>
        <text x="37.5" y="15.5" class="badge-text" fill="#6b21a8">Link/WiFi</text>
        <text x="78" y="16" class="item-bold">WPA3 Enterprise (802.11 SAE Mutual Handshake)</text>
      </g>
    </g>

    <rect x="14" y="158" width="160" height="18" rx="4" fill="#7c3aed"/>
    <text x="94" y="170.5" class="pill-text">Pilar: Defense-in-Depth</text>
  </g>

  <!-- ==================== BOTTOM FLOW PIPELINE ==================== -->
  <g transform="translate(30, 476)">
    <rect width="900" height="68" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" filter="url(#boxShadow)"/>
    
    <text x="14" y="18" font-size="10.5" font-weight="800" fill="#475569" letter-spacing="0.3px">ALUR INTEGRASI 4 PILAR DALAM MENGAMANKAN TRANSMISI TRAFIK:</text>

    <!-- Node 1: Alice (Sender) -->
    <g transform="translate(14, 26)">
      <rect width="130" height="34" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="8" fill="#16a34a"/>
      <!-- User glyph -->
      <circle cx="20" cy="14" r="3" fill="#fff"/>
      <path d="M15 22 C15 19 25 19 25 22" fill="#fff"/>
      <text x="36" y="16" font-size="11" font-weight="800" fill="#14532d">Alice</text>
      <text x="36" y="27" font-size="8.5" font-weight="600" fill="#166534">Enkripsi &amp; TTD</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M148 43 L178 43" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/>

    <!-- Node 2: Secure Pipeline -->
    <g transform="translate(186, 26)">
      <rect width="215" height="34" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2"/>
      <line x1="10" y1="17" x2="205" y2="17" stroke="#3b82f6" stroke-width="1.6" class="flow-dash"/>
      <rect x="25" y="8" width="165" height="18" rx="3" fill="#ffffff" stroke="#93c5fd"/>
      <text x="107.5" y="20.5" font-size="9.5" font-weight="800" fill="#1d4ed8" text-anchor="middle">Kanal TLS 1.3 / IPsec Tunnel</text>
    </g>

    <!-- Trudy Intruder Blocked -->
    <g transform="translate(293, 1)">
      <rect x="-10" y="0" width="84" height="18" rx="3" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
      <text x="32" y="12.5" font-size="9" font-weight="800" fill="#b91c1c" text-anchor="middle">Trudy: ❌ DROP</text>
      <line x1="32" y1="18" x2="32" y2="26" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="2,2"/>
    </g>

    <!-- Arrow 2 -->
    <path d="M405 43 L435 43" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>

    <!-- Node 3: Perimeter Firewall and IDS -->
    <g transform="translate(443, 26)">
      <rect width="245" height="34" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
      <text x="16" y="15" font-size="10.5" font-weight="800" fill="#92400e">Perimeter Institusi</text>
      <text x="16" y="27" font-size="9" font-weight="600" fill="#b45309">Firewall Stateful + IDS/IPS (DPI Payload)</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M692 43 L722 43" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>

    <!-- Node 4: Bob (Receiver) -->
    <g transform="translate(730, 26)">
      <rect width="156" height="34" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="8" fill="#7c3aed"/>
      <!-- User glyph -->
      <circle cx="20" cy="14" r="3" fill="#fff"/>
      <path d="M15 22 C15 19 25 19 25 22" fill="#fff"/>
      <text x="36" y="16" font-size="11" font-weight="800" fill="#581c87">Bob</text>
      <text x="36" y="27" font-size="8.5" font-weight="600" fill="#6b21a8">Verifikasi &amp; Dekripsi</text>
    </g>
  </g>
</svg>