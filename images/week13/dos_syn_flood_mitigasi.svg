<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/>
        </marker>
        <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#475569"/>
        </marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="44" rx="10" fill="#0f172a"/>
    <text x="480" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">SERANGAN DoS (TCP SYN FLOOD) vs MITIGASI PREVENTIF (SYN COOKIES)</text>

    <!-- LEFT: SYN FLOOD ATTACK -->
    <g transform="translate(24, 76)">
        <rect width="448" height="442" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8" filter="url(#sh)"/>
        <rect x="16" y="12" width="416" height="28" rx="7" fill="#dc2626"/>
        <text x="224" y="30" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">1. Skenario Serangan: TCP SYN Flooding (Tanpa Proteksi)</text>

        <!-- Attacker Bots -->
        <rect x="20" y="56" width="142" height="104" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.5"/>
        <text x="91" y="78" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#991b1b" text-anchor="middle">Trudy / Botnet</text>
        <text x="91" y="96" font-family="monospace" font-size="10" fill="#dc2626" text-anchor="middle">Spoofed Src IP!</text>
        <text x="91" y="114" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">Kirim ribuan SYN</text>
        <text x="91" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">TIDAK pernah balas</text>
        <text x="91" y="146" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">segmen ACK ke-3!</text>

        <!-- Legitimate Client -->
        <rect x="20" y="176" width="142" height="72" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
        <text x="91" y="198" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#166534" text-anchor="middle">Klien Sah (Alice)</text>
        <text x="91" y="217" font-family="system-ui, sans-serif" font-size="10" fill="#15803d" text-anchor="middle">Ingin akses Web</text>
        <text x="91" y="234" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">DITOLAK (Drop!)</text>

        <!-- Arrows to Server -->
        <line x1="162" y1="84" x2="246" y2="96" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrR)"/>
        <line x1="162" y1="112" x2="246" y2="112" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrR)"/>
        <line x1="162" y1="140" x2="246" y2="128" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrR)"/>
        <text x="204" y="76" font-family="monospace" font-size="10" font-weight="800" fill="#b91c1c" text-anchor="middle">10.000+ SYN/s</text>

        <line x1="162" y1="212" x2="246" y2="212" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrR)"/>
        <text x="204" y="204" font-family="monospace" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">SYN Sah</text>

        <!-- Victim Server & Backlog Queue -->
        <rect x="252" y="56" width="176" height="202" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
        <text x="340" y="78" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#991b1b" text-anchor="middle">Web Server Korban</text>
        <text x="340" y="96" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">SYN Backlog Queue (RAM)</text>

        <rect x="264" y="108" width="152" height="22" rx="4" fill="#fee2e2" stroke="#ef4444"/>
        <text x="340" y="123" font-family="monospace" font-size="9.5" fill="#991b1b" text-anchor="middle">Slot 1: 1.2.3.4 [SYN_RCVD]</text>
        <rect x="264" y="134" width="152" height="22" rx="4" fill="#fee2e2" stroke="#ef4444"/>
        <text x="340" y="149" font-family="monospace" font-size="9.5" fill="#991b1b" text-anchor="middle">Slot 2: 9.8.7.6 [SYN_RCVD]</text>
        <rect x="264" y="160" width="152" height="22" rx="4" fill="#fee2e2" stroke="#ef4444"/>
        <text x="340" y="175" font-family="monospace" font-size="9.5" fill="#991b1b" text-anchor="middle">... [HALF-OPEN PENUH!]</text>
        <rect x="264" y="186" width="152" height="24" rx="4" fill="#dc2626"/>
        <text x="340" y="202" font-family="monospace" font-size="9.5" font-weight="800" fill="#ffffff" text-anchor="middle">Slot 1024/1024: OVERFLOW</text>
        <text x="340" y="232" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626" text-anchor="middle">SYN-ACK nyasar ke IP palsu!</text>
        <text x="340" y="248" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Memori habis -&gt; Server Lumpuh</text>

        <!-- Impact Summary -->
        <rect x="20" y="274" width="408" height="150" rx="8" fill="#ffffff" stroke="#fca5a5"/>
        <text x="34" y="296" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#991b1b">Mengapa SYN Flood Efektif?</text>
        <text x="34" y="318" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">1. Server mengalokasikan memori TCB sejak paket SYN pertama datang.</text>
        <text x="34" y="338" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">2. IP sumber palsu membuat balasan SYN-ACK tak pernah kembali.</text>
        <text x="34" y="358" font-family="system-ui, sans-serif" font-size="10.5" fill="#334155">3. Timeout default (60–180 detik) menahan slot tetap terkunci.</text>
        <text x="34" y="382" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">Dampak: Ketersediaan (Availability) tumbang meski CPU &amp; BW rendah.</text>
        <text x="34" y="404" font-family="system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Varian skala besar memakai ribuan host terinfeksi -&gt; DDoS Botnet.</text>
    </g>

    <!-- RIGHT: PREVENTIVE MECHANISMS -->
    <g transform="translate(488, 76)">
        <rect width="448" height="442" rx="12" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.8" filter="url(#sh)"/>
        <rect x="16" y="12" width="416" height="28" rx="7" fill="#059669"/>
        <text x="224" y="30" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">2. Mekanisme Preventif: SYN Cookies &amp; Rate-Limiting</text>

        <!-- Step 1: SYN Cookies Diagram -->
        <rect x="20" y="54" width="408" height="198" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
        <text x="34" y="76" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#065f46">Solusi Inti Kernel: TCP SYN Cookies (Tanpa Alokasi RAM)</text>

        <rect x="32" y="90" width="384" height="36" rx="6" fill="#f0fdf4" stroke="#86efac"/>
        <text x="42" y="112" font-family="system-ui, sans-serif" font-size="10" fill="#14532d"><tspan font-weight="800">1. Terima SYN:</tspan> Abaikan Backlog! Langsung hitung Hash Cookie:</text>

        <rect x="32" y="132" width="384" height="34" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
        <text x="224" y="153" font-family="monospace" font-size="10.5" font-weight="800" fill="#1e40af" text-anchor="middle">ISN_srv = Hash(SrcIP, DstIP, Port, Secret, t)</text>

        <rect x="32" y="172" width="384" height="34" rx="6" fill="#f0fdf4" stroke="#86efac"/>
        <text x="42" y="193" font-family="system-ui, sans-serif" font-size="10" fill="#14532d"><tspan font-weight="800">2. Kirim SYN-ACK:</tspan> Sisipkan ISN_srv &amp; LUPAKAN state memori!</text>

        <rect x="32" y="212" width="384" height="30" rx="6" fill="#dcfce7" stroke="#16a34a"/>
        <text x="42" y="231" font-family="system-ui, sans-serif" font-size="10" fill="#14532d"><tspan font-weight="800">3. Validasi ACK:</tspan> Cek (ack - 1) == Hash(...) -&gt; Baru buat socket!</text>

        <!-- Additional Defenses -->
        <rect x="20" y="266" width="408" height="158" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
        <text x="34" y="288" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#065f46">Pertahanan Berlapis Tambahan terhadap DoS / DDoS:</text>

        <rect x="34" y="300" width="380" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="42" y="321" font-family="system-ui, sans-serif" font-size="10" fill="#1e293b"><tspan font-weight="800" fill="#2563eb">• Rate-Limiting / SYN Proxy:</tspan> Batasi laju SYN &amp; drop flood.</text>

        <rect x="34" y="340" width="380" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="42" y="361" font-family="system-ui, sans-serif" font-size="10" fill="#1e293b"><tspan font-weight="800" fill="#7c3aed">• Ingress Filtering (BCP 38):</tspan> ISP blok IP sumber palsu.</text>

        <rect x="34" y="380" width="380" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
        <text x="42" y="401" font-family="system-ui, sans-serif" font-size="10" fill="#1e293b"><tspan font-weight="800" fill="#059669">• Anycast CDN &amp; Scrubbing:</tspan> Sebar beban DDoS lintas POP.</text>
    </g>
</svg>
