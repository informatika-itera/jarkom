<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/>
        </marker>
        <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#475569"/>
        </marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="44" rx="10" fill="#0f172a"/>
    <text x="480" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">INTEGRITAS PESAN (SHA-256), DIGITAL SIGNATURE &amp; PKI CA</text>

    <!-- LEFT: HASH AVALANCHE EFFECT -->
    <g transform="translate(24, 76)">
        <rect width="290" height="442" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.6" filter="url(#sh)"/>
        <rect x="14" y="12" width="262" height="28" rx="7" fill="#059669"/>
        <text x="145" y="30" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">1. Fungsi Hash &amp; Avalanche</text>

        <rect x="16" y="54" width="258" height="72" rx="8" fill="#ffffff" stroke="#34d399"/>
        <text x="28" y="74" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#065f46">Input 1 (Asli):</text>
        <text x="28" y="92" font-family="monospace" font-size="10.5" fill="#0f172a">"Transfer Rp 1.000.000"</text>
        <text x="28" y="112" font-family="monospace" font-size="10.5" font-weight="700" fill="#059669">SHA-256: 7b4e92a1...c48f (256b)</text>

        <rect x="16" y="140" width="258" height="76" rx="8" fill="#fef2f2" stroke="#f87171"/>
        <text x="28" y="160" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#991b1b">Input 2 (Ubah 1 Karakter):</text>
        <text x="28" y="178" font-family="monospace" font-size="10.5" fill="#0f172a">"Transfer Rp 1.000.00<tspan fill="#dc2626" font-weight="800">1</tspan>"</text>
        <text x="28" y="198" font-family="monospace" font-size="10.5" font-weight="700" fill="#dc2626">SHA-256: d91c03ff...10a2 (Berubah &gt;50%!)</text>

        <rect x="16" y="232" width="258" height="192" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="28" y="254" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e293b">3 Sifat Wajib Hash H(m):</text>
        <text x="28" y="278" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#059669">• Fixed Length Output</text>
        <text x="36" y="294" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Dokumen 1 KB atau 10 GB selalu</text>
        <text x="36" y="308" font-family="system-ui, sans-serif" font-size="10" fill="#475569">menghasilkan tepat 256 bit (SHA-256).</text>
        <text x="28" y="332" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#059669">• One-Way (Pre-image)</text>
        <text x="36" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Mustahil membalik digest h menjadi m.</text>
        <text x="28" y="372" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#059669">• Collision Resistance</text>
        <text x="36" y="388" font-family="system-ui, sans-serif" font-size="10" fill="#475569">Sulit cari m1 != m2 dg H(m1) = H(m2).</text>
        <text x="36" y="408" font-family="system-ui, sans-serif" font-size="10" font-style="italic" fill="#64748b">Digunakan dalam TLS, Git, &amp; Signature.</text>
    </g>

    <!-- MIDDLE: DIGITAL SIGNATURE SIGN & VERIFY -->
    <g transform="translate(330, 76)">
        <rect width="316" height="442" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6" filter="url(#sh)"/>
        <rect x="14" y="12" width="288" height="28" rx="7" fill="#2563eb"/>
        <text x="158" y="30" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">2. Digital Signature (Sign &amp; Verify)</text>

        <!-- Sign by Bob -->
        <rect x="16" y="54" width="284" height="162" rx="8" fill="#ffffff" stroke="#3b82f6"/>
        <text x="28" y="74" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#1e40af">A. Penandatanganan oleh Bob</text>
        <rect x="28" y="84" width="110" height="34" rx="6" fill="#dbeafe"/>
        <text x="83" y="105" font-family="monospace" font-size="10.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">Pesan m</text>
        <line x1="138" y1="101" x2="168" y2="101" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
        <rect x="174" y="84" width="114" height="34" rx="6" fill="#d1fae5"/>
        <text x="231" y="105" font-family="monospace" font-size="10.5" font-weight="700" fill="#065f46" text-anchor="middle">h = H(m)</text>

        <line x1="231" y1="118" x2="231" y2="140" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrP)"/>
        <rect x="28" y="144" width="260" height="58" rx="6" fill="#f3e8ff" stroke="#a855f7"/>
        <text x="158" y="164" font-family="monospace" font-size="11.5" font-weight="800" fill="#6b21a8" text-anchor="middle">Sign: s = Kb-(H(m))</text>
        <text x="158" y="182" font-family="system-ui, sans-serif" font-size="10" fill="#581c87" text-anchor="middle">Kirim paket (m, s) ke Alice</text>
        <text x="158" y="196" font-family="system-ui, sans-serif" font-size="9.5" fill="#7c3aed" text-anchor="middle">Pakai Kunci Privat Bob (Non-repudiation)</text>

        <!-- Arrow Down -->
        <line x1="158" y1="216" x2="158" y2="242" stroke="#475569" stroke-width="2.5" marker-end="url(#arrS)"/>

        <!-- Verify by Alice -->
        <rect x="16" y="246" width="284" height="178" rx="8" fill="#ffffff" stroke="#16a34a"/>
        <text x="28" y="266" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#166534">B. Verifikasi Integritas oleh Alice</text>

        <rect x="28" y="278" width="122" height="52" rx="6" fill="#f0fdf4" stroke="#4ade80"/>
        <text x="89" y="298" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#166534" text-anchor="middle">Hitung Ulang Hash</text>
        <text x="89" y="317" font-family="monospace" font-size="11" font-weight="800" fill="#14532d" text-anchor="middle">h1 = H(m)</text>

        <rect x="166" y="278" width="122" height="52" rx="6" fill="#eff6ff" stroke="#60a5fa"/>
        <text x="227" y="298" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1e40af" text-anchor="middle">Dekripsi Signature</text>
        <text x="227" y="317" font-family="monospace" font-size="11" font-weight="800" fill="#1e3a8a" text-anchor="middle">h2 = Kb+(s)</text>

        <rect x="28" y="346" width="260" height="64" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
        <text x="158" y="368" font-family="monospace" font-size="12" font-weight="800" fill="#14532d" text-anchor="middle">Apakah h1 == h2 ?</text>
        <text x="158" y="387" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">YA -&gt; Asli dari Bob &amp; Pesan Utuh</text>
        <text x="158" y="402" font-family="system-ui, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle">TIDAK -&gt; Pesan dimodifikasi / palsu!</text>
    </g>

    <!-- RIGHT: CA & X.509 CHAIN OF TRUST -->
    <g transform="translate(662, 76)">
        <rect width="274" height="442" rx="12" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.6" filter="url(#sh)"/>
        <rect x="14" y="12" width="246" height="28" rx="7" fill="#7c3aed"/>
        <text x="137" y="30" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">3. PKI &amp; Sertifikat CA (X.509)</text>

        <!-- Root CA -->
        <rect x="20" y="54" width="234" height="82" rx="8" fill="#4c1d95" stroke="#7c3aed"/>
        <text x="137" y="76" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">Root CA (Tertanam di OS/Browser)</text>
        <text x="137" y="96" font-family="system-ui, sans-serif" font-size="10.5" fill="#e9d5ff" text-anchor="middle">DigiCert / Let's Encrypt / Sectigo</text>
        <text x="137" y="116" font-family="monospace" font-size="10.5" fill="#fde047" text-anchor="middle">Kunci Publik CA (Kca+) dipercaya</text>

        <line x1="137" y1="136" x2="137" y2="168" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrP)"/>

        <!-- Server Certificate -->
        <rect x="20" y="172" width="234" height="128" rx="8" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/>
        <text x="137" y="194" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#6b21a8" text-anchor="middle">Sertifikat Digital Bob (.crt)</text>
        <text x="32" y="216" font-family="monospace" font-size="10.5" fill="#334155">Subject: www.itera.ac.id</text>
        <text x="32" y="234" font-family="monospace" font-size="10.5" fill="#334155">PubKey : Kb+ (RSA / ECDSA)</text>
        <text x="32" y="252" font-family="monospace" font-size="10.5" fill="#334155">Valid  : 2026–2027</text>
        <rect x="30" y="264" width="214" height="24" rx="5" fill="#f3e8ff"/>
        <text x="137" y="280" font-family="monospace" font-size="10" font-weight="700" fill="#6b21a8" text-anchor="middle">CA Sig = Kca-(H(Cert))</text>

        <line x1="137" y1="300" x2="137" y2="332" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>

        <!-- Anti-MITM Defense -->
        <rect x="20" y="336" width="234" height="88" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
        <text x="137" y="357" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#065f46" text-anchor="middle">Menggagalkan MITM Trudy:</text>
        <text x="32" y="376" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Browser uji Kca+(CA Sig) vs Hash.</text>
        <text x="32" y="393" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Trudy tidak punya Kca-, sertifikat</text>
        <text x="39" y="409" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#dc2626">palsu ditolak (ERR_CERT_INVALID)!</text>
    </g>
</svg>
