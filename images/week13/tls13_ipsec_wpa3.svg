<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/>
        </marker>
        <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#475569"/>
        </marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="44" rx="10" fill="#0f172a"/>
    <text x="480" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">KEAMANAN MULTI-LAYER: TLS 1.3 (L4/L7), IPsec VPN (L3) &amp; WPA3 (L2)</text>

    <!-- COLUMN 1: TLS 1.3 1-RTT -->
    <g transform="translate(24, 76)">
        <rect width="292" height="442" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6" filter="url(#sh)"/>
        <rect x="14" y="12" width="264" height="28" rx="7" fill="#1d4ed8"/>
        <text x="146" y="30" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">Layer 4/7: TLS 1.3 (HTTPS 1-RTT)</text>

        <!-- Client / Server Lifelines -->
        <rect x="24" y="54" width="84" height="30" rx="6" fill="#ffffff" stroke="#2563eb"/>
        <text x="66" y="73" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">Browser</text>
        <rect x="184" y="54" width="84" height="30" rx="6" fill="#ffffff" stroke="#2563eb"/>
        <text x="226" y="73" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#1e40af" text-anchor="middle">Web Server</text>

        <line x1="66" y1="84" x2="66" y2="338" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,3"/>
        <line x1="226" y1="84" x2="226" y2="338" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4,3"/>

        <!-- Step 1: TCP + ClientHello -->
        <line x1="72" y1="108" x2="218" y2="128" stroke="#475569" stroke-width="2" marker-end="url(#arrS)"/>
        <text x="146" y="106" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">1. TCP SYN + SYN-ACK + ACK</text>

        <line x1="72" y1="148" x2="218" y2="174" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrB)"/>
        <text x="146" y="144" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#1e40af" text-anchor="middle">2. ClientHello + KeyShare (ECDHE)</text>

        <!-- Step 2: ServerHello + Cert + Finished -->
        <line x1="218" y1="198" x2="74" y2="236" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrG)"/>
        <text x="146" y="196" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#166534" text-anchor="middle">3. ServerHello + KeyShare</text>
        <text x="146" y="210" font-family="system-ui, sans-serif" font-size="9.5" fill="#15803d" text-anchor="middle">+ {Cert X.509, Sign, Finished}</text>

        <!-- Step 3: Encrypted App Data -->
        <line x1="72" y1="264" x2="218" y2="290" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrP)"/>
        <text x="146" y="260" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#6b21a8" text-anchor="middle">4. Finished + HTTP Request</text>

        <rect x="20" y="302" width="252" height="36" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
        <text x="146" y="324" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e3a8a" text-anchor="middle">DATA TERENKRIPSI AES-GCM (1-RTT!)</text>

        <rect x="16" y="352" width="260" height="74" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
        <text x="28" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e40af">Keunggulan TLS 1.3 (RFC 8446):</text>
        <text x="28" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Mandatory Forward Secrecy (ECDHE)</text>
        <text x="28" y="406" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• 1-RTT Handshake (+ opsi 0-RTT)</text>
        <text x="28" y="421" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Hapus cipher lemah (RC4, MD5, SHA-1)</text>
    </g>

    <!-- COLUMN 2: IPSEC VPN TUNNEL MODE -->
    <g transform="translate(334, 76)">
        <rect width="292" height="442" rx="12" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.6" filter="url(#sh)"/>
        <rect x="14" y="12" width="264" height="28" rx="7" fill="#7c3aed"/>
        <text x="146" y="30" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">Layer 3: IPsec VPN (Tunnel + ESP)</text>

        <!-- Site-to-Site Topology -->
        <rect x="20" y="54" width="110" height="68" rx="8" fill="#ffffff" stroke="#8b5cf6"/>
        <text x="75" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#5b21b6" text-anchor="middle">Gateway A</text>
        <text x="75" y="94" font-family="monospace" font-size="9.5" fill="#475569" text-anchor="middle">LAN: 10.1.0.0/16</text>
        <text x="75" y="110" font-family="monospace" font-size="9.5" fill="#7c3aed" text-anchor="middle">WAN: 200.1.1.1</text>

        <rect x="162" y="54" width="110" height="68" rx="8" fill="#ffffff" stroke="#8b5cf6"/>
        <text x="217" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#5b21b6" text-anchor="middle">Gateway B</text>
        <text x="217" y="94" font-family="monospace" font-size="9.5" fill="#475569" text-anchor="middle">LAN: 10.2.0.0/16</text>
        <text x="217" y="110" font-family="monospace" font-size="9.5" fill="#7c3aed" text-anchor="middle">WAN: 193.2.2.2</text>

        <rect x="44" y="136" width="204" height="26" rx="13" fill="#6d28d9"/>
        <text x="146" y="153" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">IPsec ESP Encrypted Tunnel (SA/IKEv2)</text>

        <!-- Packet Structure -->
        <rect x="16" y="176" width="260" height="162" rx="8" fill="#ffffff" stroke="#a78bfa"/>
        <text x="146" y="196" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#5b21b6" text-anchor="middle">Struktur Paket IPsec Tunnel Mode</text>

        <rect x="24" y="210" width="244" height="28" rx="4" fill="#e2e8f0" stroke="#64748b"/>
        <text x="146" y="228" font-family="monospace" font-size="10" font-weight="700" fill="#1e293b" text-anchor="middle">New Outer IP (200.1.1.1 -&gt; 193.2.2.2)</text>

        <rect x="24" y="242" width="244" height="62" rx="4" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
        <text x="146" y="259" font-family="monospace" font-size="10" font-weight="800" fill="#6b21a8" text-anchor="middle">ESP Header (SPI + Seq#)</text>
        <rect x="34" y="266" width="224" height="30" rx="4" fill="#dcfce7" stroke="#16a34a"/>
        <text x="146" y="285" font-family="monospace" font-size="9.5" font-weight="700" fill="#14532d" text-anchor="middle">[Enkripsi: Orig IP | TCP | App Data]</text>

        <rect x="24" y="308" width="244" height="22" rx="4" fill="#fce7f3" stroke="#db2777"/>
        <text x="146" y="323" font-family="monospace" font-size="9.5" font-weight="700" fill="#9d174d" text-anchor="middle">ESP Trailer + ESP Auth MAC (HMAC)</text>

        <rect x="16" y="352" width="260" height="74" rx="8" fill="#ffffff" stroke="#d8b4fe"/>
        <text x="28" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#6b21a8">Komponen Inti IPsec:</text>
        <text x="28" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• ESP: Enkripsi + Otentikasi Datagram</text>
        <text x="28" y="406" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• IKEv2: Tukar kunci otomatis (SA/SPI)</text>
        <text x="28" y="421" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Transparan terhadap aplikasi host</text>
    </g>

    <!-- COLUMN 3: WIRELESS 802.11 / WPA3 -->
    <g transform="translate(644, 76)">
        <rect width="292" height="442" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.6" filter="url(#sh)"/>
        <rect x="14" y="12" width="264" height="28" rx="7" fill="#ea580c"/>
        <text x="146" y="30" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800" fill="#ffffff" text-anchor="middle">Layer 2: Wi-Fi 802.11 &amp; WPA3-SAE</text>

        <!-- Legacy WEP vs WPA2 vs WPA3 -->
        <rect x="16" y="54" width="260" height="58" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="28" y="74" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#991b1b">WEP (1997) — USANG &amp; RENTAN</text>
        <text x="28" y="92" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">RC4 + IV 24-bit cepat berulang; kunci</text>
        <text x="28" y="105" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d">bisa diretas dalam &lt; 60 detik!</text>

        <rect x="16" y="122" width="260" height="64" rx="8" fill="#fffbeb" stroke="#fcd34d"/>
        <text x="28" y="142" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#92400e">WPA2-PSK (2004) — AES-CCMP</text>
        <text x="28" y="160" font-family="system-ui, sans-serif" font-size="10" fill="#78350f">Enkripsi AES kuat, tapi 4-Way Handshake</text>
        <text x="28" y="174" font-family="system-ui, sans-serif" font-size="10" fill="#78350f">masih rentan offline dictionary attack.</text>

        <rect x="16" y="198" width="260" height="140" rx="8" fill="#ecfdf5" stroke="#16a34a" stroke-width="1.8"/>
        <text x="28" y="220" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#166534">WPA3-SAE (Dragonfly Protocol)</text>
        <text x="28" y="240" font-family="system-ui, sans-serif" font-size="10.5" fill="#14532d">1. Zero-Knowledge Handshake (SAE):</text>
        <text x="36" y="256" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Kebal offline brute-force dictionary!</text>
        <text x="28" y="276" font-family="system-ui, sans-serif" font-size="10.5" fill="#14532d">2. Forward Secrecy (ECDH per sesi):</text>
        <text x="36" y="292" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Password bocor tak buka rekaman lama.</text>
        <text x="28" y="312" font-family="system-ui, sans-serif" font-size="10.5" fill="#14532d">3. Enhanced Open (OWE) &amp; 192-bit</text>
        <text x="36" y="328" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Enkripsi otomatis pada Wi-Fi publik.</text>

        <rect x="16" y="352" width="260" height="74" rx="8" fill="#ffffff" stroke="#fdba74"/>
        <text x="28" y="372" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#9a3412">Cakupan Proteksi Link Layer:</text>
        <text x="28" y="390" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Hanya lindungi link udara Host ↔ AP</text>
        <text x="28" y="406" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Butuh TLS / IPsec untuk E2E aman</text>
        <text x="28" y="421" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Otentikasi Enterprise: 802.1X+RADIUS</text>
    </g>
</svg>
