<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
    
    <defs>
        <marker id="arrB" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#2563eb"/>
        </marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#16a34a"/>
        </marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#dc2626"/>
        </marker>
        <marker id="arrO" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#d97706"/>
        </marker>
        <marker id="arrP" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#7c3aed"/>
        </marker>
        <marker id="arrS" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto">
            <path d="M0,0 L0,7 L8,3.5 z" fill="#475569"/>
        </marker>
        <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
            <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
        </filter>
    </defs>

    <rect width="960" height="540" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="20" y="16" width="920" height="44" rx="10" fill="#0f172a"/>
    <text x="480" y="44" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">MODE OPERASI BLOCK CIPHER AES: ECB (RENTAN) vs CBC &amp; GCM (AMAN)</text>

    <!-- COLUMN 1: ECB MODE -->
    <g transform="translate(24, 76)">
        <rect width="292" height="442" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.8" filter="url(#sh)"/>
        <rect x="14" y="12" width="264" height="28" rx="7" fill="#dc2626"/>
        <text x="146" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">1. Mode ECB (JANGAN DIPAKAI!)</text>

        <!-- Block 1 & Block 2 identical -->
        <rect x="26" y="54" width="106" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
        <text x="79" y="72" font-family="monospace" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Blok P1</text>
        <text x="79" y="87" font-family="monospace" font-size="10" fill="#2563eb" text-anchor="middle">"DATA_SAMA"</text>

        <rect x="160" y="54" width="106" height="40" rx="6" fill="#ffffff" stroke="#94a3b8"/>
        <text x="213" y="72" font-family="monospace" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Blok P2</text>
        <text x="213" y="87" font-family="monospace" font-size="10" fill="#2563eb" text-anchor="middle">"DATA_SAMA"</text>

        <line x1="79" y1="94" x2="79" y2="124" stroke="#475569" stroke-width="2" marker-end="url(#arrS)"/>
        <line x1="213" y1="94" x2="213" y2="124" stroke="#475569" stroke-width="2" marker-end="url(#arrS)"/>

        <rect x="26" y="128" width="106" height="42" rx="6" fill="#fee2e2" stroke="#ef4444"/>
        <text x="79" y="147" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">AES Encrypt</text>
        <text x="79" y="162" font-family="monospace" font-size="9.5" fill="#7f1d1d" text-anchor="middle">(Kunci K)</text>

        <rect x="160" y="128" width="106" height="42" rx="6" fill="#fee2e2" stroke="#ef4444"/>
        <text x="213" y="147" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#991b1b" text-anchor="middle">AES Encrypt</text>
        <text x="213" y="162" font-family="monospace" font-size="9.5" fill="#7f1d1d" text-anchor="middle">(Kunci K)</text>

        <line x1="79" y1="170" x2="79" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>
        <line x1="213" y1="170" x2="213" y2="200" stroke="#dc2626" stroke-width="2" marker-end="url(#arrR)"/>

        <rect x="26" y="204" width="106" height="42" rx="6" fill="#dc2626"/>
        <text x="79" y="223" font-family="monospace" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">Cipher C1</text>
        <text x="79" y="239" font-family="monospace" font-size="10" fill="#fef08a" text-anchor="middle">9F 4A 8B ...</text>

        <rect x="160" y="204" width="106" height="42" rx="6" fill="#dc2626"/>
        <text x="213" y="223" font-family="monospace" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">Cipher C2</text>
        <text x="213" y="239" font-family="monospace" font-size="10" fill="#fef08a" text-anchor="middle">9F 4A 8B ...</text>

        <!-- Pattern Leak Illustration -->
        <rect x="18" y="264" width="256" height="160" rx="8" fill="#ffffff" stroke="#fca5a5"/>
        <text x="146" y="286" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#991b1b" text-anchor="middle">Kelemahan Fatal: C1 == C2 !!</text>
        <!-- Mini grid demonstrating pattern -->
        <rect x="40" y="300" width="90" height="44" rx="4" fill="#f1f5f9" stroke="#64748b"/>
        <rect x="65" y="308" width="40" height="28" rx="3" fill="#0f172a"/>
        <text x="85" y="360" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569" text-anchor="middle">Plaintext Pola</text>

        <text x="146" y="326" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#dc2626" text-anchor="middle">-&gt;</text>

        <rect x="162" y="300" width="90" height="44" rx="4" fill="#cbd5e1" stroke="#dc2626"/>
        <rect x="187" y="308" width="40" height="28" rx="3" fill="#7f1d1d"/>
        <text x="207" y="360" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#dc2626" text-anchor="middle">Pola Masih Terlihat!</text>

        <text x="146" y="388" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">Trudy langsung tahu blok mana yang</text>
        <text x="146" y="405" font-family="system-ui, sans-serif" font-size="10" fill="#7f1d1d" text-anchor="middle">berisi data berulang / gambar sama.</text>
    </g>

    <!-- COLUMN 2: CBC MODE -->
    <g transform="translate(334, 76)">
        <rect width="292" height="442" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.8" filter="url(#sh)"/>
        <rect x="14" y="12" width="264" height="28" rx="7" fill="#2563eb"/>
        <text x="146" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">2. Mode CBC (IV + Rantai XOR)</text>

        <!-- IV Box -->
        <rect x="20" y="54" width="60" height="36" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
        <text x="50" y="76" font-family="monospace" font-size="10.5" font-weight="800" fill="#92400e" text-anchor="middle">IV Acak</text>

        <!-- Block P1 & P2 -->
        <rect x="92" y="54" width="84" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
        <text x="134" y="76" font-family="monospace" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Blok P1</text>

        <rect x="192" y="54" width="84" height="36" rx="6" fill="#ffffff" stroke="#94a3b8"/>
        <text x="234" y="76" font-family="monospace" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Blok P2 (=P1)</text>

        <!-- XOR 1 & XOR 2 -->
        <line x1="50" y1="90" x2="116" y2="124" stroke="#d97706" stroke-width="2" marker-end="url(#arrO)"/>
        <line x1="134" y1="90" x2="134" y2="114" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
        <circle cx="134" cy="128" r="13" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
        <text x="134" y="133" font-family="monospace" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">+</text>

        <line x1="234" y1="90" x2="234" y2="114" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
        <circle cx="234" cy="128" r="13" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
        <text x="234" y="133" font-family="monospace" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">+</text>

        <!-- Encrypt boxes -->
        <line x1="134" y1="141" x2="134" y2="164" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>
        <line x1="234" y1="141" x2="234" y2="164" stroke="#2563eb" stroke-width="2" marker-end="url(#arrB)"/>

        <rect x="92" y="168" width="84" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/>
        <text x="134" y="191" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#1e40af" text-anchor="middle">AES (K)</text>

        <rect x="192" y="168" width="84" height="38" rx="6" fill="#dbeafe" stroke="#2563eb"/>
        <text x="234" y="191" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#1e40af" text-anchor="middle">AES (K)</text>

        <line x1="134" y1="206" x2="134" y2="232" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/>
        <line x1="234" y1="206" x2="234" y2="232" stroke="#16a34a" stroke-width="2" marker-end="url(#arrG)"/>

        <!-- Chaining feedback line from C1 to XOR 2 -->
        <path d="M 134 218 L 182 218 L 182 128 L 218 128" fill="none" stroke="#7c3aed" stroke-width="2.2" marker-end="url(#arrP)"/>

        <!-- Output Ciphertexts -->
        <rect x="92" y="236" width="84" height="42" rx="6" fill="#1d4ed8"/>
        <text x="134" y="255" font-family="monospace" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">Cipher C1</text>
        <text x="134" y="270" font-family="monospace" font-size="9.5" fill="#fde047" text-anchor="middle">3A 71 C0 ...</text>

        <rect x="192" y="236" width="84" height="42" rx="6" fill="#0f766e"/>
        <text x="234" y="255" font-family="monospace" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">Cipher C2</text>
        <text x="234" y="270" font-family="monospace" font-size="9.5" fill="#a7f3d0" text-anchor="middle">E4 19 02 ...</text>

        <rect x="18" y="294" width="256" height="130" rx="8" fill="#ffffff" stroke="#93c5fd"/>
        <text x="30" y="316" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#1e40af">Mengapa CBC Aman (C1 != C2)?</text>
        <text x="30" y="336" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• P1 di-XOR dulu dengan IV acak.</text>
        <text x="30" y="354" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• P2 di-XOR dulu dengan C1.</text>
        <text x="30" y="372" font-family="system-ui, sans-serif" font-size="10" fill="#334155">• Pesan sama diulang 2x tetap keluar</text>
        <text x="37" y="388" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#1d4ed8">hasil acak total (kebal analisa pola).</text>
        <text x="30" y="408" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#64748b">Catatan: butuh HMAC terpisah untuk integritas.</text>
    </g>

    <!-- COLUMN 3: AES-GCM (AEAD MODERN) -->
    <g transform="translate(644, 76)">
        <rect width="292" height="442" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.8" filter="url(#sh)"/>
        <rect x="14" y="12" width="264" height="28" rx="7" fill="#059669"/>
        <text x="146" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">3. AES-GCM (Standar TLS 1.3 AEAD)</text>

        <rect x="20" y="54" width="252" height="62" rx="8" fill="#ffffff" stroke="#34d399"/>
        <text x="146" y="74" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#065f46" text-anchor="middle">Input: Kunci K + Nonce/IV + Plaintext</text>
        <text x="146" y="93" font-family="system-ui, sans-serif" font-size="10" fill="#334155" text-anchor="middle">Gunakan Counter (CTR) paralel di tiap blok</text>
        <text x="146" y="108" font-family="system-ui, sans-serif" font-size="10" fill="#059669" text-anchor="middle">+ Galois Field GHASH sekaligus!</text>

        <line x1="146" y1="116" x2="146" y2="146" stroke="#059669" stroke-width="2.5" marker-end="url(#arrG)"/>

        <rect x="20" y="150" width="252" height="92" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
        <text x="146" y="172" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#14532d" text-anchor="middle">Authenticated Encryption (AEAD)</text>
        <rect x="34" y="186" width="106" height="42" rx="6" fill="#047857"/>
        <text x="87" y="205" font-family="monospace" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">Ciphertext</text>
        <text x="87" y="220" font-family="system-ui, sans-serif" font-size="9.5" fill="#d1fae5" text-anchor="middle">(Kerahasiaan)</text>

        <rect x="152" y="186" width="106" height="42" rx="6" fill="#7c3aed"/>
        <text x="205" y="205" font-family="monospace" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">Auth Tag</text>
        <text x="205" y="220" font-family="system-ui, sans-serif" font-size="9.5" fill="#ede9fe" text-anchor="middle">(Integritas MAC)</text>

        <rect x="18" y="260" width="256" height="164" rx="8" fill="#ffffff" stroke="#86efac"/>
        <text x="30" y="282" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#065f46">Mengapa AES-GCM Jadi Standar Kini?</text>
        <text x="30" y="304" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">1. Enkripsi + Integritas Sekaligus:</text>
        <text x="38" y="320" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Bila Trudy ubah 1 bit, Auth Tag langsung</text>
        <text x="38" y="335" font-family="system-ui, sans-serif" font-size="10" fill="#334155">gagal diverifikasi sebelum dekripsi.</text>
        <text x="30" y="357" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#047857">2. Super Cepat (Paralel &amp; Hardware):</text>
        <text x="38" y="373" font-family="system-ui, sans-serif" font-size="10" fill="#334155">Semua blok diproses paralel memakai</text>
        <text x="38" y="388" font-family="system-ui, sans-serif" font-size="10" fill="#334155">instruksi CPU AES-NI (multi-Gbps).</text>
        <text x="30" y="408" font-family="system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#64748b">Wajib dipakai pada TLS 1.3 &amp; IPsec modern.</text>
    </g>
</svg>
