<!DOCTYPE html>
<html>
<head>
<style>
  body { margin:0; background:#222; color:white; font-family:sans-serif; height:100vh; display:flex; justify-content:center; align-items:center; overflow:hidden;}
  .container { position:relative; width: 600px; height:400px; border:2px dashed #444; border-radius:10px; background:#111;}
  .layer-text { position:absolute; left:20px; font-weight:bold; color:#888; font-size:1.2em;}
  .l7 { top:30px; } .l4 { top:130px; } .l3 { top:230px; } .l2 { top:330px; }
  
  .data { position:absolute; left:200px; top:30px; width:120px; height:40px; background:#f48fb1; color:black; display:flex; align-items:center; justify-content:center; font-weight:bold; border-radius:5px; z-index:10; animation: data-drop 5s infinite linear;}
  .tcp-box { position:absolute; left:150px; top:130px; width:170px; height:50px; background:rgba(144, 202, 249, 0.2); border:2px solid #90caf9; color:#90caf9; display:flex; align-items:center; padding-left:10px; box-sizing:border-box; border-radius:5px; z-index:9; animation: tcp-appear 5s infinite linear; opacity:0;}
  .ip-box { position:absolute; left:100px; top:230px; width:220px; height:60px; background:rgba(128, 203, 196, 0.2); border:2px solid #80cbc4; color:#80cbc4; display:flex; align-items:center; padding-left:10px; box-sizing:border-box; border-radius:5px; z-index:8; animation: ip-appear 5s infinite linear; opacity:0;}
  .mac-box { position:absolute; left:50px; top:330px; width:330px; height:70px; background:rgba(230, 238, 156, 0.2); border:2px solid #e6ee9c; color:#e6ee9c; display:flex; align-items:center; padding-left:10px; box-sizing:border-box; border-radius:5px; z-index:7; animation: mac-appear 5s infinite linear; opacity:0;}
  
  .fcs { position:absolute; right:10px; top:15px;}

  @keyframes data-drop {
    0% { top:30px; opacity:1; }
    15% { top:30px; opacity:1; }
    20% { top:135px; opacity:1; }
    35% { top:135px; opacity:1; }
    40% { top:240px; opacity:1; }
    55% { top:240px; opacity:1; }
    60% { top:345px; opacity:1; }
    75% { top:345px; opacity:1; left:200px; }
    85% { top:345px; opacity:0; left:600px; }
    100% { top:345px; opacity:0; left:600px; }
  }
  @keyframes tcp-appear {
    0% { opacity:0; }
    19% { opacity:0; }
    20% { opacity:1; }
    75% { opacity:1; transform:translateX(0); }
    85% { opacity:0; transform:translateX(400px); }
    100% { opacity:0; }
  }
  @keyframes ip-appear {
    0% { opacity:0; }
    39% { opacity:0; }
    40% { opacity:1; }
    75% { opacity:1; transform:translateX(0); }
    85% { opacity:0; transform:translateX(400px); }
    100% { opacity:0; }
  }
  @keyframes mac-appear {
    0% { opacity:0; }
    59% { opacity:0; }
    60% { opacity:1; }
    75% { opacity:1; transform:translateX(0); }
    85% { opacity:0; transform:translateX(400px); }
    100% { opacity:0; }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="layer-text l7">Layer 7-5<br>Data</div>
    <div class="layer-text l4">Layer 4<br>Segment</div>
    <div class="layer-text l3">Layer 3<br>Packet</div>
    <div class="layer-text l2">Layer 2<br>Frame</div>

    <div class="data">DATA</div>
    <div class="tcp-box">TCP Hdr</div>
    <div class="ip-box">IP Hdr</div>
    <div class="mac-box">MAC Hdr <span class="fcs">FCS</span></div>
  </div>
</body>
</html>
