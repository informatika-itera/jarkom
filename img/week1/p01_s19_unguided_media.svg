<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ea580c"/>
    </marker>
    <marker id="arrGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <clipPath id="spaceClip">
      <rect x="42" y="354" width="716" height="212" rx="10"/>
    </clipPath>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="600" rx="16" fill="#f8fafc"/>

  <!-- TOP PANEL: Terrestrial Radio -->
  <rect x="24" y="18" width="752" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="24" y="18" width="752" height="44" rx="14" fill="#eff6ff"/>
  <rect x="24" y="46" width="752" height="16" fill="#eff6ff"/>
  <line x1="24" y1="62" x2="776" y2="62" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="44" y="46" font-size="18" font-weight="800" fill="#1d4ed8">1. Radio Terestrial (Wi-Fi, Seluler 4G/5G, Microwave)</text>

  <!-- Transmitter Tower -->
  <g transform="translate(88, 108)">
    <polygon points="0,10 16,120 -16,120" fill="none" stroke="#1e3a8a" stroke-width="3" stroke-linejoin="round"/>
    <line x1="-8" y1="60" x2="8" y2="60" stroke="#1e3a8a" stroke-width="2.5"/>
    <line x1="-12" y1="90" x2="12" y2="90" stroke="#1e3a8a" stroke-width="2.5"/>
    <line x1="-8" y1="60" x2="12" y2="90" stroke="#64748b" stroke-width="1.5"/>
    <line x1="8" y1="60" x2="-12" y2="90" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="0" cy="4" r="7" fill="#2563eb"/>
    <path d="M 12,-4 A 16,16 0 0,1 12,14" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 20,-10 A 26,26 0 0,1 20,20" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <text x="88" y="252" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Menara / AP</text>

  <!-- Direct Signal Path -->
  <path d="M 118,112 Q 368,72 622,138" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrBlue)"/>
  <rect x="242" y="70" width="166" height="24" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="325" y="86" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1e40af">Jalur Sinyal Langsung</text>

  <!-- Weather / Interference Cloud -->
  <g transform="translate(505, 102)">
    <path d="M -34,12 A 16,16 0 0,1 -20,-12 A 20,20 0 0,1 18,-10 A 14,14 0 0,1 32,12 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
    <polyline points="-6,14 -14,26 -4,26 -10,38" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="12,14 6,25 14,25 8,36" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="444" y="144" width="132" height="24" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="510" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Interferensi &amp; Cuaca</text>

  <!-- Physical Wall / Reflector -->
  <rect x="274" y="186" width="66" height="44" rx="4" fill="#fca5a5" stroke="#dc2626" stroke-width="2"/>
  <line x1="274" y1="201" x2="340" y2="201" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="274" y1="216" x2="340" y2="216" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="307" y1="186" x2="307" y2="201" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="291" y1="201" x2="291" y2="216" stroke="#dc2626" stroke-width="1.5"/>
  <line x1="323" y1="201" x2="323" y2="216" stroke="#dc2626" stroke-width="1.5"/>
  <text x="307" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Halangan / Pemantul</text>

  <!-- Multipath Bounced Path (reflects cleanly off top of obstacle) -->
  <polyline points="118,128 307,185 622,174" fill="none" stroke="#ea580c" stroke-width="2.8" stroke-dasharray="7,4" marker-end="url(#arrOrange)"/>
  <rect x="404" y="206" width="154" height="24" rx="12" fill="#ffedd5" stroke="#fdba74" stroke-width="1"/>
  <text x="481" y="222" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c2410c">Pantulan (Multipath)</text>

  <!-- Receiver Devices -->
  <rect x="634" y="96" width="118" height="140" rx="12" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="676" y="114" width="34" height="54" rx="5" fill="#1e293b"/>
  <rect x="680" y="120" width="26" height="40" rx="2" fill="#38bdf8"/>
  <rect x="664" y="182" width="58" height="32" rx="4" fill="#334155"/>
  <rect x="668" y="186" width="50" height="22" fill="#bae6fd"/>
  <rect x="656" y="214" width="74" height="6" rx="3" fill="#64748b"/>
  <text x="693" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#1e293b">Penerima</text>

  <!-- BOTTOM PANEL: Satellite GEO vs LEO -->
  <rect x="24" y="296" width="752" height="286" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="24" y="296" width="752" height="44" rx="14" fill="#fff7ed"/>
  <rect x="24" y="324" width="752" height="16" fill="#fff7ed"/>
  <line x1="24" y1="340" x2="776" y2="340" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="44" y="324" font-size="18" font-weight="800" fill="#c2410c">2. Komunikasi Satelit: GEO vs LEO</text>

  <!-- Dark Space Inset -->
  <rect x="42" y="354" width="716" height="212" rx="10" fill="#0f172a"/>

  <g clip-path="url(#spaceClip)">
    <!-- Stars -->
    <circle cx="90" cy="380" r="1.5" fill="#94a3b8"/>
    <circle cx="155" cy="410" r="1.2" fill="#cbd5e1"/>
    <circle cx="510" cy="382" r="1.5" fill="#94a3b8"/>
    <circle cx="695" cy="392" r="1.5" fill="#cbd5e1"/>
    <circle cx="715" cy="442" r="1.2" fill="#94a3b8"/>

    <!-- High GEO Orbit Arc -->
    <path d="M 55,412 Q 400,348 745,412" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6,5" opacity="0.85"/>

    <!-- Low LEO Orbit Arc -->
    <path d="M 55,488 Q 400,432 745,488" fill="none" stroke="#34d399" stroke-width="1.8" stroke-dasharray="6,4" opacity="0.9"/>

    <!-- Earth Curve -->
    <circle cx="400" cy="1030" r="522" fill="#1d4ed8" stroke="#38bdf8" stroke-width="3"/>
    <path d="M 190,542 Q 280,520 355,546 Q 430,526 535,544 Q 585,556 620,570 L 170,570 Z" fill="#15803d" opacity="0.75"/>

    <!-- Links Ground <-> GEO & Ground <-> LEO -->
    <line x1="128" y1="518" x2="210" y2="394" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrGold)"/>
    <line x1="128" y1="518" x2="275" y2="462" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrTeal)"/>

    <!-- GEO Satellite -->
    <g transform="translate(214, 382)">
      <rect x="-26" y="-8" width="16" height="16" rx="2" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/>
      <rect x="10" y="-8" width="16" height="16" rx="2" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/>
      <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#fbbf24" stroke="#fef3c7" stroke-width="1.5"/>
    </g>

    <!-- GEO Callout Box -->
    <rect x="256" y="362" width="234" height="46" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="373" y="381" text-anchor="middle" font-size="13" font-weight="800" fill="#fbbf24">Satelit GEO (~36.000 km)</text>
    <text x="373" y="399" text-anchor="middle" font-size="11.5" fill="#e2e8f0">Cakupan luas • Delay ~280 ms</text>

    <!-- LEO Constellation Satellites -->
    <g transform="translate(284, 456)">
      <rect x="-14" y="-5" width="28" height="10" rx="2" fill="#34d399"/>
      <rect x="-6" y="-7" width="12" height="14" rx="2" fill="#ecfdf5"/>
    </g>
    <g transform="translate(410, 444)">
      <rect x="-14" y="-5" width="28" height="10" rx="2" fill="#34d399"/>
      <rect x="-6" y="-7" width="12" height="14" rx="2" fill="#ecfdf5"/>
    </g>
    <g transform="translate(534, 454)">
      <rect x="-14" y="-5" width="28" height="10" rx="2" fill="#34d399"/>
      <rect x="-6" y="-7" width="12" height="14" rx="2" fill="#ecfdf5"/>
    </g>

    <!-- LEO Callout Box -->
    <rect x="514" y="366" width="230" height="46" rx="8" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
    <text x="629" y="385" text-anchor="middle" font-size="13" font-weight="800" fill="#6ee7b7">Konstelasi LEO (&lt;2.000 km)</text>
    <text x="629" y="403" text-anchor="middle" font-size="11.5" fill="#ecfdf5">Latensi rendah • Contoh: Starlink</text>

    <!-- Ground Station Dish -->
    <g transform="translate(122, 520)">
      <path d="M -16,0 Q 0,-18 16,0 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
      <line x1="0" y1="-9" x2="6" y2="-18" stroke="#f8fafc" stroke-width="2"/>
      <rect x="-4" y="0" width="8" height="12" fill="#64748b"/>
    </g>
    <text x="122" y="550" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Stasiun Bumi</text>
    <text x="415" y="548" text-anchor="middle" font-size="13" font-weight="700" fill="#e0f2fe">Permukaan Bumi</text>
  </g>
</svg>
