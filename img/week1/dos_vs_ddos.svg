<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" font-family="Inter, Arial, sans-serif">
  <defs>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="800" height="600" rx="16" fill="#f8fafc"/>

  <!-- TOP PANEL: DoS -->
  <rect x="24" y="20" width="752" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="24" y="20" width="752" height="44" rx="14" fill="#fef2f2"/>
  <rect x="24" y="48" width="752" height="16" fill="#fef2f2"/>
  <line x1="24" y1="64" x2="776" y2="64" stroke="#fecaca" stroke-width="1.5"/>
  <text x="44" y="48" font-size="18" font-weight="800" fill="#b91c1c">1. DoS (Denial of Service — 1 Sumber Penyerang)</text>

  <!-- Single Attacker -->
  <rect x="52" y="92" width="140" height="72" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="122" y="122" text-anchor="middle" font-size="15" font-weight="800" fill="#991b1b">Penyerang</text>
  <text x="122" y="144" text-anchor="middle" font-size="12" fill="#7f1d1d">(1 Mesin / 1 IP)</text>

  <!-- Legitimate User -->
  <rect x="52" y="186" width="140" height="72" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="122" y="216" text-anchor="middle" font-size="15" font-weight="800" fill="#1e40af">Pengguna Sah</text>
  <text x="122" y="238" text-anchor="middle" font-size="12" fill="#1e3a8a">(Akses Normal)</text>

  <!-- Attack Stream -->
  <line x1="196" y1="120" x2="500" y2="148" stroke="#dc2626" stroke-width="6" stroke-dasharray="10,5" marker-end="url(#arrowRed)"/>
  <rect x="250" y="78" width="196" height="28" rx="14" fill="#dc2626"/>
  <text x="348" y="97" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Banjir Trafik Sampah</text>

  <!-- Blocked Legit Stream -->
  <line x1="196" y1="222" x2="420" y2="195" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <circle cx="445" cy="192" r="16" fill="#dc2626"/>
  <line x1="436" y1="183" x2="454" y2="201" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="454" y1="183" x2="436" y2="201" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
  <text x="325" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#b91c1c">Gagal Akses (Terblokir)</text>

  <!-- Target Server Top -->
  <rect x="518" y="96" width="228" height="156" rx="12" fill="#fff1f2" stroke="#dc2626" stroke-width="2.5"/>
  <rect x="546" y="114" width="172" height="30" rx="6" fill="#1e293b"/>
  <circle cx="564" cy="129" r="5" fill="#ef4444"/>
  <circle cx="580" cy="129" r="5" fill="#ef4444"/>
  <text x="646" y="134" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">WEB SERVER</text>
  <text x="632" y="170" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Beban CPU / Memori: 100%</text>
  <rect x="546" y="182" width="172" height="16" rx="8" fill="#fecaca"/>
  <rect x="546" y="182" width="172" height="16" rx="8" fill="#dc2626"/>
  <text x="632" y="222" text-anchor="middle" font-size="13" font-weight="800" fill="#b91c1c">Layanan Lumpuh</text>
  <text x="632" y="240" text-anchor="middle" font-size="11" fill="#64748b">(Lebih mudah diblokir via 1 IP)</text>

  <!-- BOTTOM PANEL: DDoS -->
  <rect x="24" y="302" width="752" height="278" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="24" y="302" width="752" height="44" rx="14" fill="#fff7ed"/>
  <rect x="24" y="330" width="752" height="16" fill="#fff7ed"/>
  <line x1="24" y1="346" x2="776" y2="346" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="44" y="330" font-size="18" font-weight="800" fill="#c2410c">2. DDoS (Distributed DoS — Jaringan Botnet Terkoordinasi)</text>

  <!-- Attacker Commander -->
  <rect x="48" y="422" width="124" height="74" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="110" y="454" text-anchor="middle" font-size="14" font-weight="800" fill="#991b1b">Pengendali</text>
  <text x="110" y="474" text-anchor="middle" font-size="12" fill="#7f1d1d">(Botmaster)</text>

  <!-- Command arrows -->
  <line x1="172" y1="440" x2="238" y2="395" stroke="#475569" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowDark)"/>
  <line x1="172" y1="459" x2="238" y2="459" stroke="#475569" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowDark)"/>
  <line x1="172" y1="478" x2="238" y2="522" stroke="#475569" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrowDark)"/>

  <!-- Botnet Nodes -->
  <rect x="246" y="366" width="142" height="50" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="317" y="388" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Botnet #1 (PC)</text>
  <text x="317" y="405" text-anchor="middle" font-size="11" fill="#7c2d12">IP Asing A</text>

  <rect x="246" y="434" width="142" height="50" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="317" y="456" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Botnet #2 (IoT)</text>
  <text x="317" y="473" text-anchor="middle" font-size="11" fill="#7c2d12">IP Asing B</text>

  <rect x="246" y="502" width="142" height="50" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="317" y="524" text-anchor="middle" font-size="13" font-weight="700" fill="#9a3412">Botnet #N (...)</text>
  <text x="317" y="541" text-anchor="middle" font-size="11" fill="#7c2d12">Puluhan Ribu IP</text>

  <!-- Converging Flood -->
  <line x1="392" y1="391" x2="508" y2="442" stroke="#dc2626" stroke-width="4.5" marker-end="url(#arrowRed)"/>
  <line x1="392" y1="459" x2="508" y2="459" stroke="#dc2626" stroke-width="4.5" marker-end="url(#arrowRed)"/>
  <line x1="392" y1="527" x2="508" y2="476" stroke="#dc2626" stroke-width="4.5" marker-end="url(#arrowRed)"/>

  <!-- Target Server Bottom -->
  <rect x="518" y="378" width="228" height="168" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="546" y="396" width="172" height="30" rx="6" fill="#1e293b"/>
  <circle cx="564" cy="411" r="5" fill="#ef4444"/>
  <circle cx="580" cy="411" r="5" fill="#ef4444"/>
  <text x="646" y="416" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">WEB SERVER</text>
  <text x="632" y="454" text-anchor="middle" font-size="13" font-weight="800" fill="#9a3412">Banjir Trafik Terdistribusi</text>
  <text x="632" y="476" text-anchor="middle" font-size="12" fill="#7c2d12">Dari banyak negara &amp; IP</text>
  <rect x="540" y="492" width="184" height="36" rx="8" fill="#dc2626"/>
  <text x="632" y="515" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff">Sangat Sulit Ditangkal</text>
</svg>
