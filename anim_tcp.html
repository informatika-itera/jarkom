<!DOCTYPE html>
<html>
<head>
<style>
  body { margin:0; padding:20px; background:#222; color:white; font-family:sans-serif; display:flex; gap:20px; height: 100vh; box-sizing: border-box; overflow:hidden;}
  .pane { flex:1; background:#333; border-radius:10px; padding:20px; position:relative; overflow:hidden; }
  h2 { text-align:center; margin-top:0; }
  .house { position:absolute; right:20px; top:50%; transform:translateY(-50%); width:60px; height:60px; background:#4CAF50; clip-path: polygon(50% 0%, 100% 30%, 100% 100%, 0 100%, 0 30%); }
  
  /* TCP */
  .tcp-sender { position:absolute; left:20px; top:50%; transform:translateY(-50%); width:40px; height:60px; background:#2196F3; }
  .tcp-packet { position:absolute; left:70px; top:50%; transform:translateY(-50%); width:20px; height:20px; background:#FFF; border-radius:3px; animation: tcp-move 3s infinite linear; }
  .tcp-ack { position:absolute; right:90px; top:60%; transform:translateY(-50%); width:10px; height:10px; background:#4CAF50; border-radius:50%; opacity:0; animation: tcp-ack 3s infinite linear; }
  
  @keyframes tcp-move {
    0% { left: 70px; opacity:1; }
    40% { left: calc(100% - 100px); opacity:1; }
    45% { opacity:0; left: calc(100% - 100px); }
    100% { opacity:0; left: calc(100% - 100px); }
  }
  @keyframes tcp-ack {
    0% { opacity:0; right: 90px; }
    45% { opacity:0; right: 90px; }
    50% { opacity:1; right: 90px; }
    90% { opacity:1; right: calc(100% - 80px); }
    95% { opacity:0; right: calc(100% - 80px); }
    100% { opacity:0; }
  }

  /* UDP */
  .udp-sender { position:absolute; left:20px; top:50%; transform:translateY(-50%); width:40px; height:60px; background:#FF9800; border-radius: 20px 0 0 20px;}
  .udp-packet { position:absolute; left:70px; top:50%; transform:translateY(-50%); width:15px; height:15px; background:#FFF; border-radius:50%; opacity:0; }
  
  .p1 { animation: udp-fire 1.5s infinite linear 0s; }
  .p2 { animation: udp-fire 1.5s infinite linear 0.3s; top:40%; }
  .p3 { animation: udp-fire 1.5s infinite linear 0.6s; top:60%; }
  .p4 { animation: udp-fire-fail 1.5s infinite linear 0.9s; top:30%; }
  .p5 { animation: udp-fire 1.5s infinite linear 1.2s; top:70%; }
  
  @keyframes udp-fire {
    0% { left: 70px; opacity:1; }
    80% { left: calc(100% - 100px); opacity:1; }
    85% { opacity:0; left: calc(100% - 100px); }
    100% { opacity:0; left: calc(100% - 100px); }
  }
  @keyframes udp-fire-fail {
    0% { left: 70px; opacity:1; top:30%;}
    50% { left: 50%; opacity:1; top: 100%;}
    60% { opacity:0; }
    100% { opacity:0; }
  }
</style>
</head>
<body>
  <div class="pane">
    <h2 style="color:#2196F3;">TCP (Reliable)</h2>
    <div class="tcp-sender"></div>
    <div class="tcp-packet"></div>
    <div class="tcp-ack"></div>
    <div class="house"></div>
  </div>
  <div class="pane">
    <h2 style="color:#FF9800;">UDP (Unreliable & Fast)</h2>
    <div class="udp-sender"></div>
    <div class="udp-packet p1"></div>
    <div class="udp-packet p2"></div>
    <div class="udp-packet p3"></div>
    <div class="udp-packet p4"></div>
    <div class="udp-packet p5"></div>
    <div class="house"></div>
  </div>
</body>
</html>
